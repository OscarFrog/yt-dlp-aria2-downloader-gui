name: Concurrency stress
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stress-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: Source identity ${{ github.sha }}
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 3
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust only the checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          [[ ${workspace} == "$(pwd -P)" && ${workspace} != / && ${workspace} != */\* ]]
          git config --global --add safe.directory "${workspace}"
      - name: Bind validation to the event source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(git rev-parse HEAD) == "${EXPECTED_SHA}" ]]
          git rev-parse 'HEAD^{tree}'
          python3 -B scripts/check-push-version.py coherence
          source tests/lib/project-files.sh
          for file in "${ALL_SHELL_FILES[@]}"; do
            bash -n -- "${file}"
          done
  mock-stress:
    needs: identity
    name: Mock process/cancellation stress shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    # Each shard runs five independently bounded five-minute iterations.
    # Include all iterations plus checkout and cleanup in the job budget.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install cargo gcc rust aria2 bash coreutils curl desktop-file-utils diffutils findutils git gnupg2 grep jq procps-ng python3 python3-pip sed ShellCheck unzip util-linux tar gzip which file shadow-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare unprivileged fixture owner
        shell: bash
        run: |
          useradd --create-home qualification
          chown -R qualification:qualification -- "${GITHUB_WORKSPACE}"
      - name: Repeat race-sensitive integration scenarios with bounded jitter
        env:
          STRESS_SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cancel_timings=(0 0.01 0.03 0.07 0.12)
          late_cancel_timings=(0 0.01 0.04 0.08 0.15)
          pgid_timings=(2 2.5 3 4 5)
          worker_timings=(0 0.01 0.03 0.06)
          ffmpeg_timings=(0 0.01 0.04 0.08)
          supervisor_timings=(0 0.005 0.01 0.02)

          shard=${STRESS_SHARD}
          shard_count=4
          if [[ ! ${shard} =~ ^[1-4]$ ]]; then
            printf 'Error: invalid stress shard: %s\n' "${shard}" >&2
            exit 65
          fi

          for ((iteration = shard; iteration <= 20; iteration += shard_count)); do
            index=$((iteration - 1))
            cancel=${cancel_timings[index % ${#cancel_timings[@]}]}
            late_cancel=${late_cancel_timings[index % ${#late_cancel_timings[@]}]}
            pgid=${pgid_timings[index % ${#pgid_timings[@]}]}
            worker=${worker_timings[index % ${#worker_timings[@]}]}
            ffmpeg_start=${ffmpeg_timings[index % ${#ffmpeg_timings[@]}]}
            supervisor=${supervisor_timings[index % ${#supervisor_timings[@]}]}

            printf '%s\n' \
              "=== mock jitter iteration ${iteration}/20: cancel=${cancel}s late=${late_cancel}s pgid=${pgid}s worker=${worker}s ffmpeg=${ffmpeg_start}s supervisor=${supervisor}s ==="

            runuser -u qualification -- timeout --signal=TERM --kill-after=10s 5m \
              env \
                MOCK_CANCEL_JITTER_SECONDS="${cancel}" \
                MOCK_CANCEL_AFTER_EOF_JITTER_SECONDS="${late_cancel}" \
                MOCK_PGID_PUBLISH_DELAY_SECONDS="${pgid}" \
                MOCK_WORKER_START_JITTER_SECONDS="${worker}" \
                MOCK_FFMPEG_START_JITTER_SECONDS="${ffmpeg_start}" \
                MOCK_SETSID_START_JITTER_SECONDS="${supervisor}" \
                bash ./tests/mock-integration.sh --group stress-signals
          done

  mock-stress-gate:
    name: Mock process/cancellation stress (20x deterministic jitter)
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: ${{ always() }}
    needs:
      - mock-stress
      - runtime-hardening-stress
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Require all cancellation stress shards
        shell: bash
        env:
          MOCK_STRESS_RESULT: ${{ needs.mock-stress.result }}
          RUNTIME_STRESS_RESULT: ${{ needs.runtime-hardening-stress.result }}
        run: |
          set -Eeuo pipefail

          if [[ ${MOCK_STRESS_RESULT} != success ||
              ${RUNTIME_STRESS_RESULT} != success ]]; then
            printf 'Stress qualification results: mock=%s runtime=%s\n' \
              "${MOCK_STRESS_RESULT}" \
              "${RUNTIME_STRESS_RESULT}" >&2
            exit 65
          fi

          printf '%s\n' \
            'All cancellation and runtime-manager stress qualifications passed.'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every complementary qualification before merge
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 -I scripts/ci-validation.py wait-required --commit "${EXPECTED_SHA}" --timeout-minutes 75

  runtime-hardening-stress:
    needs: identity
    name: Runtime-manager hardening (10 rollback/contention cycles)
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 30
    env:
      RUNTIME_HARDENING_ROLLBACK_RUNS: 10
      RUNTIME_HARDENING_CONTENTION_RUNS: 10
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install aria2 bash coreutils curl desktop-file-utils diffutils findutils git gnupg2 grep jq procps-ng python3 python3-pip sed ShellCheck unzip util-linux tar gzip which file shadow-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare unprivileged fixture owner
        shell: bash
        run: |
          useradd --create-home qualification
          chown -R qualification:qualification -- "${GITHUB_WORKSPACE}"
      - name: Qualify runtime-manager transactions and contention
        shell: bash
        run: |
          set -Eeuo pipefail

          # Each semantic group runs once. Keep the per-group bound and the
          # ten rollback/contention cycles, including after an earlier failure.
          first_failure=0
          for group in validation rollback-admission recovery cache-identity transactions; do
            printf '\n=== Runtime hardening: %s ===\n' "${group}"
            status=0
            runuser -u qualification -- timeout --signal=TERM --kill-after=10s 2m \
              bash ./tests/runtime-manager-hardening-integration.sh --group "${group}" \
              || status=$?
            printf 'Runtime hardening %s status: %s\n' "${group}" "${status}"
            if ((first_failure == 0 && status != 0)); then
              first_failure=${status}
            fi
          done
          exit "${first_failure}"
