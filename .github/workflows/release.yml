name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v2.1.26
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install validation dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes curl desktop-file-utils gnupg shellcheck unzip
      - name: Verify tag and versions
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ ${RELEASE_TAG} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          [[ ${tag_commit} == "$(git rev-parse HEAD)" ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "${tag_commit}" origin/main
          version=${RELEASE_TAG#v}
          grep -Fqx "readonly VERSION=\"${version}\"" download-video.sh
          grep -Fq "# Version     : ${version}" download-video-gui.sh progress-monitor.sh install-gui.sh
          grep -Fq "is **${version}**." README.md
          grep -Fq "version actuelle est la **${version}**" README.fr.md
          grep -Fq "## ${version} - " CHANGELOG.md
      - run: bash ./tests/run-all.sh


  previous-release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
      version: ${{ steps.previous.outputs.version }}
      commit: ${{ steps.previous.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve previous versioned release
        id: previous
        shell: bash
        run: |
          set -Eeuo pipefail

          found_current=false
          previous_tag=''

          while IFS= read -r candidate; do
            [[ ${candidate} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

            if [[ ${found_current} == false ]]; then
              if [[ ${candidate} == "${RELEASE_TAG}" ]]; then
                found_current=true
              fi
              continue
            fi

            previous_tag=${candidate}
            break
          done < <(
            git tag \
              --list 'v[0-9]*.[0-9]*.[0-9]*' \
              --sort=-version:refname
          )

          if [[ ${found_current} != true ]]; then
            printf 'Error: current release tag was not found in the versioned tag set: %s\n' \
              "${RELEASE_TAG}" >&2
            exit 65
          fi

          if [[ ! ${previous_tag} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Error: unable to resolve a previous versioned release before %s.\n' \
              "${RELEASE_TAG}" >&2
            exit 65
          fi

          previous_commit=$(git rev-parse "${previous_tag}^{commit}")
          current_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")

          if [[ ! ${previous_commit} =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Error: invalid previous release commit: %s\n' \
              "${previous_commit}" >&2
            exit 65
          fi

          if ! git merge-base --is-ancestor \
              "${previous_commit}" \
              "${current_commit}"; then
            printf 'Error: previous release %s is not an ancestor of %s.\n' \
              "${previous_tag}" "${RELEASE_TAG}" >&2
            exit 65
          fi

          printf 'Previous immutable release candidate: %s\n' "${previous_tag}"
          printf 'Previous release commit: %s\n' "${previous_commit}"
          printf 'tag=%s\n' "${previous_tag}" >>"${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${previous_tag#v}" >>"${GITHUB_OUTPUT}"
          printf 'commit=%s\n' "${previous_commit}" >>"${GITHUB_OUTPUT}"

      - name: Download and verify exact previous immutable packages
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p previous

          immutable=$(
            gh release view "${PREVIOUS_TAG}" \
              -R "${GITHUB_REPOSITORY}" \
              --json isImmutable \
              --jq '.isImmutable'
          )

          if [[ ${immutable} != true ]]; then
            printf 'Error: previous release is not immutable: %s\n' \
              "${PREVIOUS_TAG}" >&2
            exit 65
          fi

          gh release verify "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}"

          gh release download "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --dir previous \
            --pattern '*.rpm'

          gh release download "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --dir previous \
            --pattern '*.deb'

          gh release download "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --dir previous \
            --pattern 'SHA256SUMS'

          shopt -s nullglob
          rpms=(previous/*.rpm)
          debs=(previous/*.deb)
          shopt -u nullglob

          if ((${#rpms[@]} != 1)); then
            printf 'Error: expected exactly one RPM in previous release; found %d.\n' \
              "${#rpms[@]}" >&2
            exit 65
          fi

          if ((${#debs[@]} != 1)); then
            printf 'Error: expected exactly one DEB in previous release; found %d.\n' \
              "${#debs[@]}" >&2
            exit 65
          fi

          grep -Fq "  ${rpms[0]##*/}" previous/SHA256SUMS
          grep -Fq "  ${debs[0]##*/}" previous/SHA256SUMS

          (
            cd previous
            sha256sum --ignore-missing --check SHA256SUMS
          )

          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/release.yml"

          for asset in \
            "${rpms[0]}" \
            "${debs[0]}" \
            previous/SHA256SUMS; do

            gh release verify-asset \
              "${PREVIOUS_TAG}" \
              "${asset}" \
              -R "${GITHUB_REPOSITORY}"

            gh attestation verify \
              "${asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${PREVIOUS_COMMIT}"
          done

          (
            cd previous
            sha256sum -- *.rpm *.deb > PREVIOUS_SHA256SUMS
            sha256sum --check PREVIOUS_SHA256SUMS
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previous-release-packages
          path: |
            previous/*.rpm
            previous/*.deb
            previous/PREVIOUS_SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  real-tools:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        yt_dlp_version: ['2026.6.9', '2026.8.19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install real engines
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes aria2 ffmpeg python3-venv
          python3 -m venv "${RUNNER_TEMP}/yt-dlp-venv"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" install \
            --disable-pip-version-check "yt-dlp==${{ matrix.yt_dlp_version }}"
          echo "${RUNNER_TEMP}/yt-dlp-venv/bin" >> "${GITHUB_PATH}"
      - name: Run hermetic real-tool integration
        run: timeout --signal=TERM --kill-after=10s 8m bash ./tests/real-tools-integration.sh

  zip:
    needs: [validate, real-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --yes curl desktop-file-utils gnupg shellcheck unzip
      - name: Build and retest ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          version=${RELEASE_TAG#v}; package="yt-dlp-aria2-downloader-gui-${version}"
          mkdir -p dist
          git archive --format=zip --prefix="${package}/" --output="dist/${package}.zip" "${RELEASE_TAG}^{commit}"
          unzip -t "dist/${package}.zip"
          extracted=$(mktemp -d); trap 'rm -rf -- "${extracted}"' EXIT
          unzip -q "dist/${package}.zip" -d "${extracted}"
          (cd "${extracted}/${package}" && bash ./tests/run-all.sh)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  rpm-build:
    needs: [validate, real-tools]
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install RPM build tools
        run: dnf install --assumeyes cpio desktop-file-utils findutils git gzip rpm-build tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build release RPM once
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          bash packaging/rpm/build-rpm.sh "${RELEASE_TAG#v}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  rpm-test:
    needs: [rpm-build, previous-release]
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, ffmpeg-free]
    steps:
      - name: Install RPM test tools
        run: |
          dnf install --assumeyes cpio desktop-file-utils findutils git gzip rpm-build tar
          if [[ '${{ matrix.scenario }}' == 'ffmpeg-free' ]]; then
            dnf install --assumeyes ffmpeg-free
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-rpm
          path: dist
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        if: matrix.scenario == 'fresh'
        with:
          name: previous-release-packages
          path: previous
      - name: Install exact shared RPM through supported Fedora bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          bash ./install-fedora.sh "${packages[0]}"
      - name: Validate installed environment
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm -q yt-dlp-aria2-downloader-gui ffmpeg aria2 zenity
          ! rpm -q ffmpeg-free
          vendor=$(rpm -q --qf '%{VENDOR}\n' ffmpeg)
          [[ ${vendor} == *'RPM Fusion'* ]]
          ! command -v deno >/dev/null 2>&1
          runtime_manager=/usr/libexec/yt-dlp-aria2-downloader/runtime-manager.sh
          "${runtime_manager}" versions
          /usr/bin/yt-dlp-aria2-downloader --version
      - name: Remove and re-run exact RPM lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf remove --assumeyes yt-dlp-aria2-downloader-gui
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          bash packaging/rpm/test-package-lifecycle.sh "${packages[0]}" "${RELEASE_TAG#v}"
      - name: Test exact previous immutable RPM -> release RPM upgrade
        if: matrix.scenario == 'fresh'
        shell: bash
        run: |
          set -Eeuo pipefail

          (
            cd previous
            sha256sum --check PREVIOUS_SHA256SUMS
          )

          shopt -s nullglob
          old=(previous/*.rpm)
          current=(dist/*.rpm)
          shopt -u nullglob

          ((${#old[@]} == 1 && ${#current[@]} == 1))

          bash packaging/rpm/test-package-upgrade.sh             "${old[0]}"             "${current[0]}"             "${{ needs.previous-release.outputs.version }}"             "${RELEASE_TAG#v}"

  deb:
    needs: [validate, real-tools, previous-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install DEB build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes desktop-file-utils
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: previous-release-packages
          path: ${{ runner.temp }}/previous-release
      - name: Build, lifecycle, reinstall, and upgrade DEB
        env:
          PREVIOUS_DIR: ${{ runner.temp }}/previous-release
        shell: bash
        run: |
          set -Eeuo pipefail
          bash packaging/deb/build-deb.sh "${RELEASE_TAG#v}" dist
          shopt -s nullglob; packages=(dist/*.deb); shopt -u nullglob
          ((${#packages[@]} == 1))
          sudo bash packaging/deb/test-package-lifecycle.sh "${packages[0]}" "${RELEASE_TAG#v}"

          (
            cd "${PREVIOUS_DIR}"
            sha256sum --check PREVIOUS_SHA256SUMS
          )

          shopt -s nullglob
          old=("${PREVIOUS_DIR}"/*.deb)
          shopt -u nullglob

          ((${#old[@]} == 1))

          sudo bash packaging/deb/test-package-upgrade.sh             "${old[0]}"             "${packages[0]}"             "${{ needs.previous-release.outputs.version }}"             "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [zip, rpm-test, deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify payloads and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0755 -- install-fedora.sh dist/install-fedora.sh
          shopt -s nullglob; payloads=(dist/*.zip dist/*.rpm dist/*.deb dist/install-fedora.sh); shopt -u nullglob
          ((${#payloads[@]} == 4))
          (cd dist && sha256sum -- *.zip *.rpm *.deb install-fedora.sh > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
      - name: Publish and verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob; payloads=(dist/*.zip dist/*.rpm dist/*.deb dist/install-fedora.sh); shopt -u nullglob
          expected=$(mktemp); actual=$(mktemp); existing=$(mktemp -d)
          trap 'rm -f -- "${expected}" "${actual}"; rm -rf -- "${existing}"' EXIT
          for payload in "${payloads[@]}" dist/SHA256SUMS; do
            printf '%s\n' "${payload##*/}"
          done | LC_ALL=C sort >"${expected}"

          created_release=false
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | LC_ALL=C sort >"${actual}"
            if ! cmp -s -- "${expected}" "${actual}"; then
              printf '%s\n' 'Error: existing release asset inventory differs from the expected immutable set.' >&2
              diff -u -- "${expected}" "${actual}" >&2 || true
              exit 65
            fi
            for payload in "${payloads[@]}" dist/SHA256SUMS; do
              name=${payload##*/}
              gh release download "${RELEASE_TAG}" --dir "${existing}" --pattern "${name}"
              cmp -s -- "${payload}" "${existing}/${name}"
            done
          else
            gh release create "${RELEASE_TAG}" "${payloads[@]}" dist/SHA256SUMS \
              --verify-tag --generate-notes --title "yt-dlp aria2 downloader ${RELEASE_TAG#v}"
            created_release=true
          fi

          immutable=false
          for _ in {1..10}; do
            immutable=$(gh release view "${RELEASE_TAG}" --json isImmutable --jq '.isImmutable' 2>/dev/null || true)
            [[ ${immutable} == true ]] && break
            sleep 2
          done
          if [[ ${immutable} != true ]]; then
            printf '%s\n' 'Error: the published release is not immutable.' >&2

            if [[ ${created_release} == true ]]; then
              if ! gh release delete "${RELEASE_TAG}" --yes; then
                printf '%s\n' \
                  'Error: failed to delete the newly-created mutable release.' >&2
                exit 79
              fi

              if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
                printf '%s\n' \
                  'Error: mutable release cleanup could not be confirmed.' >&2
                exit 79
              fi

              printf '%s\n' \
                'Mutable release cleanup completed.' >&2
            else
              printf '%s\n' \
                'Error: an existing mutable release must be removed before retrying.' >&2
            fi

            exit 78
          fi

          verify_with_retry() {
            local attempt
            for ((attempt = 1; attempt <= 10; attempt++)); do
              "$@" && return 0
              sleep 3
            done
            return 1
          }
          verify_with_retry gh release verify "${RELEASE_TAG}"
          for payload in "${payloads[@]}" dist/SHA256SUMS; do
            verify_with_retry gh release verify-asset "${RELEASE_TAG}" "${payload}"
          done
