name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to publish, for example vX.Y.Z
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate release tag identity before checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! ${RELEASE_TAG} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Error: invalid semantic release tag: %s\n' "${RELEASE_TAG}" >&2
            exit 65
          fi

          if [[ ${GITHUB_EVENT_NAME} == workflow_dispatch ]]; then
            if [[ ${GITHUB_REF_TYPE} != tag ||
                ${GITHUB_REF_NAME} != "${RELEASE_TAG}" ]]; then
              printf 'Error: manual release recovery must run from the exact requested tag ref.\n' >&2
              exit 65
            fi
          fi

          tag_ref=$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '[.object.type,.object.sha] | @tsv'
          )
          IFS=$'\t' read -r tag_object_type tag_object_sha <<<"${tag_ref}"
          if [[ ${tag_object_type} != tag ||
              ! ${tag_object_sha} =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Error: release ref must resolve to an annotated tag object: %s\n' \
              "${RELEASE_TAG}" >&2
            exit 65
          fi

          tag_verification=$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '[.tag,.object.type,.object.sha,.verification.verified,.verification.reason] | @tsv'
          )
          IFS=$'\t' read -r verified_tag target_type target_sha verified reason \
            <<<"${tag_verification}"

          if [[ ${verified_tag} != "${RELEASE_TAG}" ||
              ${target_type} != commit ||
              ! ${target_sha} =~ ^[0-9a-f]{40}$ ||
              ${verified} != true ||
              ${reason} != valid ]]; then
            printf 'Error: release tag failed GitHub signature verification: tag=%s type=%s verified=%s reason=%s\n' \
              "${verified_tag:-<missing>}" \
              "${target_type:-<missing>}" \
              "${verified:-<missing>}" \
              "${reason:-<missing>}" >&2
            exit 65
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install validation dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes aria2 curl desktop-file-utils gnupg shellcheck unzip
      - name: Verify the exact authorized release-tag signer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_SIGNING_FINGERPRINT: 43E5361414863738F0324F2B047B26057E612CDC
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          tag_gpg_home=$(mktemp -d)
          tag_keys=$(mktemp)
          trap 'rm -rf -- "${tag_gpg_home}"; rm -f -- "${tag_keys}"' EXIT
          chmod 700 -- "${tag_gpg_home}"

          gh api users/OscarFrog/gpg_keys --jq '.[].raw_key' >"${tag_keys}"
          [[ -s ${tag_keys} ]]
          GNUPGHOME="${tag_gpg_home}" gpg --batch --no-options \
            --import "${tag_keys}"

          verification=''
          if ! verification=$(GNUPGHOME="${tag_gpg_home}" \
            git verify-tag --raw "${RELEASE_TAG}" 2>&1 >/dev/null); then
            printf 'Error: local release-tag signature verification failed.\n' >&2
            exit 65
          fi
          signer_fingerprint=$(
            awk '
              $1 == "[GNUPG:]" && $2 == "VALIDSIG" {
                fingerprint = (NF >= 12 && $12 != "") ? $12 : $3
                print toupper(fingerprint)
              }
            ' <<<"${verification}"
          )
          if [[ -z ${signer_fingerprint} ||
              ${signer_fingerprint} == *$'\n'* ||
              ${signer_fingerprint} != "${RELEASE_TAG_SIGNING_FINGERPRINT}" ]]; then
            printf 'Error: release tag signer is not the authorized fingerprint.\n' >&2
            exit 65
          fi
      - name: Validate pinned RPM public signing certificate
        env:
          RPM_SIGNING_FINGERPRINT: 7B54065FE061E78ED2C96252E3BE996196ABEA7F
          RPM_SIGNING_SUBKEY_FINGERPRINT: 1F5B769CE48A08AAC0A7D9DDECC9894B41830245
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          listing=$(mktemp)
          gpg_home=$(mktemp -d)
          trap 'rm -f -- "${listing}"; rm -rf -- "${gpg_home}"' EXIT
          chmod 700 "${gpg_home}"

          LC_ALL=C gpg \
            --homedir "${gpg_home}" \
            --batch \
            --no-options \
            --with-colons \
            --show-keys \
            --fingerprint \
            packaging/keys/RPM-GPG-KEY-OscarFrog >"${listing}"

          primary_count=$(
            awk -F: '$1 == "pub" { count++ } END { print count + 0 }' "${listing}"
          )
          primary_fingerprint=$(
            awk -F: \
              '$1 == "pub" { want=1; next }
               want && $1 == "fpr" && !found {
                 value=toupper($10); found=1
               }
               END { if (found) print value }' "${listing}"
          )
          primary_capabilities=$(
            awk -F: '$1 == "pub" { print $12; exit }' "${listing}"
          )
          signing_subkey_count=$(
            awk -F: \
              '$1 == "sub" &&
               $2 != "r" &&
               $2 != "e" &&
               index($12, "s") > 0 {
                   count++
               }
               END { print count + 0 }' \
              "${listing}"
          )
          signing_subkey=$(
            awk -F: -v expected="${RPM_SIGNING_SUBKEY_FINGERPRINT}" \
              '$1 == "sub" {
                 want=($2 != "r" && $2 != "e" && index($12, "s") > 0)
                 next
               }
               want && $1 == "fpr" {
                 value=toupper($10)
                 if (value == expected) { print value; exit }
                 want=0
               }' "${listing}"
          )

          [[ ${primary_count} == 1 ]]
          [[ ${primary_fingerprint} == "${RPM_SIGNING_FINGERPRINT}" ]]
          [[ ${primary_capabilities} == *c* ]]
          [[ ${primary_capabilities} != *s* ]]
          [[ ${signing_subkey_count} == 1 ]]
          [[ ${signing_subkey} == "${RPM_SIGNING_SUBKEY_FINGERPRINT}" ]]

      - name: Verify tag and versions
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ ${RELEASE_TAG} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")

          if [[ ${GITHUB_EVENT_NAME} == workflow_dispatch ]]; then
            [[ ${GITHUB_REF_TYPE} == tag ]] || {
              printf 'Error: manual release recovery must run from a tag ref; got %s.\n' \
                "${GITHUB_REF_TYPE}" >&2
              exit 65
            }
            [[ ${GITHUB_REF_NAME} == "${RELEASE_TAG}" ]] || {
              printf 'Error: workflow_dispatch ref/tag mismatch: ref=%s requested=%s\n' \
                "${GITHUB_REF_NAME}" "${RELEASE_TAG}" >&2
              exit 65
            }
            [[ ${GITHUB_SHA} == "${tag_commit}" ]] || {
              printf 'Error: workflow_dispatch source SHA differs from release tag commit.\n' >&2
              exit 65
            }
          fi

          [[ ${tag_commit} == "$(git rev-parse HEAD)" ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "${tag_commit}" origin/main
          version=${RELEASE_TAG#v}
          reported_version=$(./download-video.sh --version)
          expected_reported_version="download-video.sh version ${version}"
          if [[ ${reported_version} != "${expected_reported_version}" ]]; then
            printf 'Error: release executable version mismatch: expected=%q actual=%q\n' \
              "${expected_reported_version}" "${reported_version}" >&2
            exit 65
          fi
          grep -Fqx "readonly VERSION=\"${version}\"" download-video.sh
          grep -Fqx "readonly APP_VERSION='${version}'" install-fedora.sh
          grep -Fq "development version is **${version}**." README.md
          grep -Fq "développement actuelle est la **${version}**." README.fr.md
          grep -Fq "## ${version} - " CHANGELOG.md
      - run: bash ./tests/run-all.sh --jobs 4


  previous-release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
      version: ${{ steps.previous.outputs.version }}
      commit: ${{ steps.previous.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve previous versioned release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          found_current=false
          previous_tag=''
          published_release_tags=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --paginate \
              --jq '.[] | select(.draft == false and .prerelease == false and .published_at != null) | .tag_name'
          )

          while IFS= read -r candidate; do
            [[ ${candidate} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

            if [[ ${found_current} == false ]]; then
              if [[ ${candidate} == "${RELEASE_TAG}" ]]; then
                found_current=true
              fi
              continue
            fi

            previous_tag=${candidate}
            break
          done < <(
            {
              printf '%s\n' "${RELEASE_TAG}"
              printf '%s\n' "${published_release_tags}"
            } | LC_ALL=C sort -Vr -u
          )

          if [[ ${found_current} != true ]]; then
            printf 'Error: current release tag was not found in the versioned tag set: %s\n' \
              "${RELEASE_TAG}" >&2
            exit 65
          fi

          if [[ ! ${previous_tag} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Error: unable to resolve a previous versioned release before %s.\n' \
              "${RELEASE_TAG}" >&2
            exit 65
          fi

          previous_commit=$(git rev-parse "${previous_tag}^{commit}")
          current_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")

          if [[ ! ${previous_commit} =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Error: invalid previous release commit: %s\n' \
              "${previous_commit}" >&2
            exit 65
          fi

          if ! git merge-base --is-ancestor \
              "${previous_commit}" \
              "${current_commit}"; then
            printf 'Error: previous release %s is not an ancestor of %s.\n' \
              "${previous_tag}" "${RELEASE_TAG}" >&2
            exit 65
          fi

          printf 'Previous immutable release candidate: %s\n' "${previous_tag}"
          printf 'Previous release commit: %s\n' "${previous_commit}"
          {
            printf 'tag=%s\n' "${previous_tag}"
            printf 'version=%s\n' "${previous_tag#v}"
            printf 'commit=%s\n' "${previous_commit}"
          } >>"${GITHUB_OUTPUT}"

      - name: Download and verify exact previous immutable packages
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p previous

          immutable=$(
            gh release view "${PREVIOUS_TAG}" \
              -R "${GITHUB_REPOSITORY}" \
              --json isImmutable \
              --jq '.isImmutable'
          )

          if [[ ${immutable} != true ]]; then
            printf 'Error: previous release is not immutable: %s\n' \
              "${PREVIOUS_TAG}" >&2
            exit 65
          fi

          gh release verify "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}"

          gh release download "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --dir previous \
            --pattern '*.rpm'

          gh release download "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --dir previous \
            --pattern '*.deb'

          gh release download "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --dir previous \
            --pattern 'SHA256SUMS'

          shopt -s nullglob
          rpms=(previous/*.rpm)
          debs=(previous/*.deb)
          shopt -u nullglob

          if ((${#rpms[@]} != 1)); then
            printf 'Error: expected exactly one RPM in previous release; found %d.\n' \
              "${#rpms[@]}" >&2
            exit 65
          fi

          if ((${#debs[@]} != 1)); then
            printf 'Error: expected exactly one DEB in previous release; found %d.\n' \
              "${#debs[@]}" >&2
            exit 65
          fi

          require_checksum_entry() {
            local checksum_file=$1
            local expected_name=$2
            local entry_count

            entry_count=$(
              awk -v expected="${expected_name}" '
                length($0) >= 67 &&
                substr($0, 65, 2) == "  " &&
                substr($0, 67) == expected &&
                substr($0, 1, 64) ~ /^[[:xdigit:]]+$/ {
                  count++
                }
                END { print count + 0 }
              ' "${checksum_file}"
            )
            if [[ ${entry_count} != 1 ]]; then
              printf 'Error: expected exactly one SHA256SUMS entry for %s; found %s.\n' \
                "${expected_name}" "${entry_count}" >&2
              return 65
            fi
          }

          require_checksum_entry previous/SHA256SUMS "${rpms[0]##*/}"
          require_checksum_entry previous/SHA256SUMS "${debs[0]##*/}"

          (
            cd previous
            sha256sum --ignore-missing --check SHA256SUMS
          )

          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/release.yml"

          for asset in \
            "${rpms[0]}" \
            "${debs[0]}" \
            previous/SHA256SUMS; do

            gh release verify-asset \
              "${PREVIOUS_TAG}" \
              "${asset}" \
              -R "${GITHUB_REPOSITORY}"

            gh attestation verify \
              "${asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${PREVIOUS_COMMIT}" \
              --source-ref "refs/tags/${PREVIOUS_TAG}"
          done

          (
            cd previous
            sha256sum -- *.rpm *.deb > PREVIOUS_SHA256SUMS
            sha256sum --check PREVIOUS_SHA256SUMS
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previous-release-packages
          path: |
            previous/*.rpm
            previous/*.deb
            previous/PREVIOUS_SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  real-tools:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        yt_dlp_version: ['2026.6.9', '2026.8.19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install real engines
        env:
          YT_DLP_VERSION: ${{ matrix.yt_dlp_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            aria2 ffmpeg python3-venv

          case ${YT_DLP_VERSION} in
            2026.6.9)
              yt_dlp_sha=442ba4c75724b9496144c8434b617962ee08d0ee7c26ec663848fe9b78d5a3e4
              ;;
            2026.8.19)
              yt_dlp_sha=1d57897e94c6665a0a6f9bc54b34e584284e32c034ffab3a7df25d8f7b24eedf
              ;;
            *)
              printf 'Error: no approved release yt-dlp wheel digest for %s.\n' \
                "${YT_DLP_VERSION}" >&2
              exit 65
              ;;
          esac

          requirements="${RUNNER_TEMP}/release-yt-dlp-requirements.txt"
          printf 'yt-dlp==%s --hash=sha256:%s\n' \
            "${YT_DLP_VERSION}" "${yt_dlp_sha}" >"${requirements}"

          python3 -m venv "${RUNNER_TEMP}/yt-dlp-venv"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement "${requirements}"
          echo "${RUNNER_TEMP}/yt-dlp-venv/bin" >>"${GITHUB_PATH}"
      - name: Run hermetic routing integration (3x)
        shell: bash
        run: |
          bash ./tests/repeat-qualification.sh \
            --label 'release routing iteration' --runs 3 --jobs 3 -- \
            timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/real-tools-integration.sh
      - name: Run aria2 direct-transfer behavior qualification
        env:
          ARIA2_BEHAVIOR_BASIC_RUNS: 3
          ARIA2_BEHAVIOR_CANCEL_RESTART_RUNS: 10
        run: |
          timeout --signal=TERM --kill-after=10s 12m \
            bash ./tests/aria2-real-behavior-integration.sh
      - name: Run real FFmpeg progress integration
        run: |
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/ffmpeg-real-progress-integration.sh
      - name: Run HLS post-remux duration validation (3x)
        shell: bash
        run: |
          bash ./tests/repeat-qualification.sh \
            --label 'release HLS duration guard iteration' --runs 3 --jobs 3 -- \
            timeout --signal=TERM --kill-after=10s 5m \
            bash ./tests/hls-remux-duration-integration.sh

  zip:
    needs: [validate, real-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --yes aria2 curl desktop-file-utils findutils gnupg shellcheck unzip
      - name: Build and retest ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          version=${RELEASE_TAG#v}; package="yt-dlp-aria2-downloader-gui-${version}"
          mkdir -p dist
          git archive --format=zip --prefix="${package}/" --output="dist/${package}.zip" "${RELEASE_TAG}^{commit}"
          unzip -t "dist/${package}.zip"
          extracted=$(mktemp -d); trap 'rm -rf -- "${extracted}"' EXIT
          unzip -q "dist/${package}.zip" -d "${extracted}"
          (cd "${extracted}/${package}" && bash ./tests/run-all.sh --jobs 4)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  rpm-build:
    needs: [validate, real-tools]
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install RPM build tools
        run: dnf install --assumeyes cpio desktop-file-utils findutils gawk git gnupg2 gzip python3 rpm-build rpm-sign tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build release RPM once
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          bash packaging/rpm/build-rpm.sh "${RELEASE_TAG#v}" dist
      - name: Qualify release RPM v4/v6 signature semantics (3x)
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(dist/*.rpm)
          shopt -u nullglob
          ((${#packages[@]} == 1))

          bash ./tests/repeat-qualification.sh \
            --label 'release RPM v4/v6 qualification iteration' \
            --runs 3 --jobs 3 -- \
            timeout --signal=TERM --kill-after=10s 4m \
            bash ./tests/rpm6-multisig-integration.sh "${packages[0]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  rpm-sign:
    needs: rpm-build
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 10
    environment: rpm-signing
    env:
      RPM_SIGNING_FINGERPRINT: 7B54065FE061E78ED2C96252E3BE996196ABEA7F
      RPM_SIGNING_SUBKEY_FINGERPRINT: 1F5B769CE48A08AAC0A7D9DDECC9894B41830245
    steps:
      - name: Install isolated RPM signing tools
        run: dnf install --assumeyes coreutils gawk gnupg2 rpm rpm-sign
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: unsigned-rpm
          path: unsigned
      - name: Sign exact release RPM with OpenPGP
        shell: bash
        env:
          RPM_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RPM_SIGNING_PRIVATE_KEY_B64 }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          umask 077

          [[ -n ${RPM_SIGNING_PRIVATE_KEY_B64} ]] || {
            printf '%s\n' 'Error: RPM_SIGNING_PRIVATE_KEY_B64 is not configured.' >&2
            exit 78
          }
          [[ -n ${RPM_SIGNING_PASSPHRASE} ]] || {
            printf '%s\n' 'Error: RPM_SIGNING_PASSPHRASE is not configured.' >&2
            exit 78
          }

          shopt -s nullglob
          unsigned=(unsigned/*.rpm)
          shopt -u nullglob
          ((${#unsigned[@]} == 1))

          initial_format=$(LC_ALL=C rpm -qp --qf '%{rpmformat}\n' -- "${unsigned[0]}")
          [[ ${initial_format} == 4 ]] || {
            printf 'Error: unsigned release RPM uses unexpected package format: %s\n' \
              "${initial_format:-missing}" >&2
            exit 65
          }

          initial_state=$(LC_ALL=C rpm -qp --qf '%|OPENPGP?{signed}:{unsigned}|\n' -- "${unsigned[0]}")
          [[ ${initial_state} == unsigned ]] || {
            printf '%s\n' 'Error: rpm-build unexpectedly produced an already-signed RPM.' >&2
            exit 65
          }

          signing_home=$(mktemp -d)
          key_file=$(mktemp)
          passphrase_file=$(mktemp)
          public_key=$(mktemp)
          verify_keyring="${signing_home}/rpm-keyring"

          cleanup_signing() {
            gpgconf --homedir "${signing_home}" --kill gpg-agent \
              >/dev/null 2>&1 || true
            unset GNUPGHOME || true
            rm -rf -- "${signing_home}" || true
            rm -f -- "${key_file}" "${passphrase_file}" "${public_key}" || true
          }
          trap cleanup_signing EXIT

          chmod 700 "${signing_home}"
          chmod 600 "${key_file}" "${passphrase_file}"
          mkdir -p -- "${verify_keyring}"
          chmod 700 "${verify_keyring}"

          printf '%s' "${RPM_SIGNING_PRIVATE_KEY_B64}" | base64 --decode >"${key_file}"
          printf '%s' "${RPM_SIGNING_PASSPHRASE}" >"${passphrase_file}"
          unset RPM_SIGNING_PRIVATE_KEY_B64 RPM_SIGNING_PASSPHRASE

          export GNUPGHOME="${signing_home}"
          gpg --batch --import "${key_file}"
          rm -f -- "${key_file}"

          secret_listing="${signing_home}/secret-keys.colons"

          gpg --batch --with-colons --list-secret-keys --fingerprint \
            "${RPM_SIGNING_FINGERPRINT}" >"${secret_listing}"

          imported_primary_count=$(
            awk -F: '$1 == "sec" { count++ } END { print count + 0 }' \
              "${secret_listing}"
          )
          imported_primary_secret_state=$(
            awk -F: '$1 == "sec" { print $15; exit }' "${secret_listing}"
          )
          imported_fingerprint=$(
            awk -F: \
              '$1 == "sec" { want=1; next }
               want && $1 == "fpr" && !found {
                 value=toupper($10); found=1
               }
               END { if (found) print value }' \
              "${secret_listing}"
          )
          imported_primary_capabilities=$(
            awk -F: '$1 == "sec" { print $12; exit }' "${secret_listing}"
          )
          imported_signing_subkey_count=$(
            awk -F: \
              '$1 == "ssb" &&
               $2 != "r" &&
               $2 != "e" &&
               index($12, "s") > 0 {
                   count++
               }
               END { print count + 0 }' \
              "${secret_listing}"
          )
          imported_signing_subkey=$(
            awk -F: -v expected="${RPM_SIGNING_SUBKEY_FINGERPRINT}" \
              '$1 == "ssb" {
                 want=($2 != "r" && $2 != "e" && index($12, "s") > 0)
                 next
               }
               want && $1 == "fpr" {
                 value=toupper($10)
                 if (value == expected) { print value; exit }
                 want=0
               }' \
              "${secret_listing}"
          )

          [[ ${imported_primary_count} == 1 ]] || {
            printf 'Error: signing secret must contain exactly one primary certificate; found %s\n' \
              "${imported_primary_count}" >&2
            exit 65
          }
          [[ ${imported_primary_secret_state} == '#' ]] || {
            printf '%s\n' \
              'Error: primary private signing key material must remain offline; configure an export-secret-subkeys bundle.' >&2
            exit 65
          }
          [[ ${imported_fingerprint} == "${RPM_SIGNING_FINGERPRINT}" ]] || {
            printf 'Error: imported signing primary fingerprint mismatch: %s\n' \
              "${imported_fingerprint:-missing}" >&2
            exit 65
          }
          [[ ${imported_primary_capabilities} == *c* &&
              ${imported_primary_capabilities} != *s* ]] || {
            printf '%s\n' \
              'Error: signing primary certificate must remain certification-only.' >&2
            exit 65
          }
          [[ ${imported_signing_subkey_count} == 1 ]] || {
            printf 'Error: signing secret must contain exactly one usable signing subkey; found %s\n' \
              "${imported_signing_subkey_count}" >&2
            exit 65
          }
          [[ ${imported_signing_subkey} == "${RPM_SIGNING_SUBKEY_FINGERPRINT}" ]] || {
            printf 'Error: required signing subkey is absent, expired, revoked, or not signing-capable: %s\n' \
              "${RPM_SIGNING_SUBKEY_FINGERPRINT}" >&2
            exit 65
          }

          gpg --batch --armor --export "${RPM_SIGNING_FINGERPRINT}" >"${public_key}"

          rpmkeys \
            --define "_keyring fs" \
            --define "_keyringpath ${verify_keyring}" \
            --define "_keyring_lockpath ${verify_keyring}/.keyring.lock" \
            --define "_rpmlock_path ${verify_keyring}/.rpm.lock" \
            --import "${public_key}"

          mkdir -p dist
          cp -- "${unsigned[0]}" "dist/${unsigned[0]##*/}"
          signed="dist/${unsigned[0]##*/}"

          GPG_TTY=/dev/null rpmsign --addsign \
            --key-id "${RPM_SIGNING_SUBKEY_FINGERPRINT}" \
            --define "_openpgp_sign gpg" \
            --define "_gpg_path ${signing_home}" \
            --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file ${passphrase_file}" \
            "${signed}"
          rm -f -- "${passphrase_file}"

          final_format=$(LC_ALL=C rpm -qp --qf '%{rpmformat}\n' -- "${signed}")
          [[ ${final_format} == 4 ]] || {
            printf 'Error: signed release RPM changed package format unexpectedly: %s\n' \
              "${final_format:-missing}" >&2
            exit 65
          }

          final_state=$(LC_ALL=C rpm -qp --qf '%|OPENPGP?{signed}:{unsigned}|\n' -- "${signed}")
          [[ ${final_state} == signed ]] || {
            printf '%s\n' 'Error: rpmsign completed without an OpenPGP signature.' >&2
            exit 65
          }

          rpmkeys \
            --define "_keyring fs" \
            --define "_keyringpath ${verify_keyring}" \
            --define "_keyring_lockpath ${verify_keyring}/.keyring.lock" \
            --define "_rpmlock_path ${verify_keyring}/.rpm.lock" \
            --checksig "${signed}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  rpm-test:
    needs: [rpm-sign, previous-release]
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 35
    env:
      PACKAGE_TEST_HOME: /root
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, ffmpeg-free]
    steps:
      - name: Install RPM test tools
        env:
          PACKAGE_SCENARIO: ${{ matrix.scenario }}
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf install --assumeyes cpio desktop-file-utils findutils git gnupg2 gzip rpm-build rpm-sign tar
          if [[ ${PACKAGE_SCENARIO} == ffmpeg-free ]]; then
            dnf install --assumeyes ffmpeg-free
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-rpm
          path: dist
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        if: matrix.scenario == 'fresh'
        with:
          name: previous-release-packages
          path: previous
      - name: Reject a different globally trusted RPM signer
        if: matrix.scenario == 'fresh'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          shopt -s nullglob
          packages=(dist/*.rpm)
          shopt -u nullglob
          ((${#packages[@]} == 1))

          wrong_home=$(mktemp -d)
          wrong_public=$(mktemp)
          wrong_rpm=$(mktemp --suffix=.rpm)
          wrong_passphrase=$(mktemp)
          wrong_verify_keyring="${wrong_home}/rpm-keyring"
          log=$(mktemp)
          wrong_fingerprint=''

          cleanup_wrong_signer() {
            if [[ -n ${wrong_fingerprint} ]]; then
              rpmkeys --delete "${wrong_fingerprint}" >/dev/null 2>&1 || true
            fi
            rm -rf -- "${wrong_home}" || true
            rm -f --               "${wrong_public}"               "${wrong_rpm}"               "${wrong_passphrase}"               "${log}" || true
          }
          trap cleanup_wrong_signer EXIT
          chmod 700 "${wrong_home}"
          chmod 600 "${wrong_passphrase}"
          mkdir -p -- "${wrong_verify_keyring}"
          chmod 700 "${wrong_verify_keyring}"

          gpg \
            --homedir "${wrong_home}" \
            --batch \
            --pinentry-mode loopback \
            --passphrase '' \
            --quick-generate-key \
            'yt-dlp-aria2 wrong-signer CI <wrong-signer@example.invalid>' \
            rsa2048 sign 1d

          wrong_fingerprint=$(
            gpg \
              --homedir "${wrong_home}" \
              --batch \
              --with-colons \
              --list-secret-keys \
              --fingerprint |
              awk -F: \
                '$1 == "fpr" && !found {
                   value=toupper($10); found=1
                 }
                 END { if (found) print value }'
          )
          [[ ${wrong_fingerprint} =~ ^[0-9A-F]{40}$ ]]

          gpg \
            --homedir "${wrong_home}" \
            --batch \
            --armor \
            --export "${wrong_fingerprint}" >"${wrong_public}"

          # Reproduce the 2.1.28 trust-domain bug precondition deliberately:
          # the wrong signer is trusted by the host RPM database.
          rpmkeys --import "${wrong_public}"

          cp -- "${packages[0]}" "${wrong_rpm}"
          rpmsign --delsign "${wrong_rpm}"
          GPG_TTY=/dev/null rpmsign \
            --addsign \
            --key-id "${wrong_fingerprint}" \
            --define "_openpgp_sign gpg" \
            --define "_gpg_path ${wrong_home}" \
            --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file ${wrong_passphrase}" \
            "${wrong_rpm}"

          wrong_state=$(
            LC_ALL=C rpm -qp --qf '%|OPENPGP?{signed}:{unsigned}|\n' \
              -- "${wrong_rpm}"
          )
          [[ ${wrong_state} == signed ]]

          # Prove independently that the adversarial RPM is genuinely
          # valid for the attacker's certificate before requiring the
          # production bootstrap to reject it.
          rpmkeys \
            --define "_keyring fs" \
            --define "_keyringpath ${wrong_verify_keyring}" \
            --define "_keyring_lockpath ${wrong_verify_keyring}/.keyring.lock" \
            --define "_rpmlock_path ${wrong_verify_keyring}/.rpm.lock" \
            --import "${wrong_public}"
          rpmkeys \
            --define "_keyring fs" \
            --define "_keyringpath ${wrong_verify_keyring}" \
            --define "_keyring_lockpath ${wrong_verify_keyring}/.keyring.lock" \
            --define "_rpmlock_path ${wrong_verify_keyring}/.rpm.lock" \
            --checksig "${wrong_rpm}"

          set +e
          HOME="${PACKAGE_TEST_HOME}" \
            bash ./install-fedora.sh "${wrong_rpm}" >"${log}" 2>&1
          status=$?
          set -e

          [[ ${status} -eq 65 ]]
          grep -Fq 'RPM OpenPGP signature verification failed against the isolated pinned certificate.' "${log}"

      - name: Install exact shared RPM through supported Fedora bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          state=$(LC_ALL=C rpm -qp --qf '%|OPENPGP?{signed}:{unsigned}|\n' -- "${packages[0]}")
          [[ ${state} == signed ]]
          HOME="${PACKAGE_TEST_HOME}" bash ./install-fedora.sh "${packages[0]}"
      - name: Validate installed environment
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm -q yt-dlp-aria2-downloader-gui ffmpeg aria2 zenity
          if rpm -q ffmpeg-free >/dev/null 2>&1; then
            printf '%s\n' 'Error: ffmpeg-free must not remain installed after bootstrap.' >&2
            exit 65
          fi
          vendor=$(rpm -q --qf '%{VENDOR}\n' ffmpeg)
          [[ ${vendor} == *'RPM Fusion'* ]]
          if command -v deno >/dev/null 2>&1; then
            printf '%s\n' 'Error: Deno must not be provided by the system PATH.' >&2
            exit 65
          fi
          runtime_manager=/usr/libexec/yt-dlp-aria2-downloader/runtime-manager.sh
          HOME="${PACKAGE_TEST_HOME}" "${runtime_manager}" versions
          /usr/bin/yt-dlp-aria2-downloader --version
      - name: Remove and re-run exact RPM lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf remove --assumeyes yt-dlp-aria2-downloader-gui

          runtime_root="${PACKAGE_TEST_HOME}/.local/share/yt-dlp-aria2-downloader/runtime"
          if [[ -e ${runtime_root} || -L ${runtime_root} ]]; then
            printf 'Error: supported Fedora bootstrap runtime survived final RPM removal: %s\n' \
              "${runtime_root}" >&2
            exit 65
          fi

          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          bash packaging/rpm/test-package-lifecycle.sh "${packages[0]}" "${RELEASE_TAG#v}"
      - name: Test exact previous immutable RPM -> release RPM upgrade
        if: matrix.scenario == 'fresh'
        shell: bash
        run: |
          set -Eeuo pipefail

          (
            cd previous
            sha256sum --check PREVIOUS_SHA256SUMS
          )

          shopt -s nullglob
          old=(previous/*.rpm)
          current=(dist/*.rpm)
          shopt -u nullglob

          ((${#old[@]} == 1 && ${#current[@]} == 1))

          HOME="${PACKAGE_TEST_HOME}" bash packaging/rpm/test-package-upgrade.sh             "${old[0]}"             "${current[0]}"             "${{ needs.previous-release.outputs.version }}"             "${RELEASE_TAG#v}"

  deb:
    needs: [validate, real-tools, previous-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install DEB build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes desktop-file-utils
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: previous-release-packages
          path: ${{ runner.temp }}/previous-release
      - name: Build, lifecycle, reinstall, and upgrade DEB
        env:
          PREVIOUS_DIR: ${{ runner.temp }}/previous-release
        shell: bash
        run: |
          set -Eeuo pipefail
          bash packaging/deb/build-deb.sh "${RELEASE_TAG#v}" dist
          shopt -s nullglob; packages=(dist/*.deb); shopt -u nullglob
          ((${#packages[@]} == 1))
          sudo bash packaging/deb/test-package-lifecycle.sh "${packages[0]}" "${RELEASE_TAG#v}"

          (
            cd "${PREVIOUS_DIR}"
            sha256sum --check PREVIOUS_SHA256SUMS
          )

          shopt -s nullglob
          old=("${PREVIOUS_DIR}"/*.deb)
          shopt -u nullglob

          ((${#old[@]} == 1))

          sudo bash packaging/deb/test-package-upgrade.sh             "${old[0]}"             "${packages[0]}"             "${{ needs.previous-release.outputs.version }}"             "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: [zip, rpm-test, deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify payloads and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0755 -- install-fedora.sh dist/install-fedora.sh
          install -m 0644 -- packaging/keys/RPM-GPG-KEY-OscarFrog dist/RPM-GPG-KEY-OscarFrog
          shopt -s nullglob; payloads=(dist/*.zip dist/*.rpm dist/*.deb dist/install-fedora.sh dist/RPM-GPG-KEY-OscarFrog); shopt -u nullglob
          ((${#payloads[@]} == 5))
          (cd dist && sha256sum -- *.zip *.rpm *.deb install-fedora.sh RPM-GPG-KEY-OscarFrog > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
      - name: Publish and verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob; payloads=(dist/*.zip dist/*.rpm dist/*.deb dist/install-fedora.sh dist/RPM-GPG-KEY-OscarFrog); shopt -u nullglob
          expected=$(mktemp); actual=$(mktemp); existing=$(mktemp -d)
          trap 'rm -f -- "${expected}" "${actual}"; rm -rf -- "${existing}"' EXIT
          for payload in "${payloads[@]}" dist/SHA256SUMS; do
            printf '%s\n' "${payload##*/}"
          done | LC_ALL=C sort >"${expected}"

          created_release=false
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | LC_ALL=C sort >"${actual}"
            if ! cmp -s -- "${expected}" "${actual}"; then
              printf '%s\n' 'Error: existing release asset inventory differs from the expected immutable set.' >&2
              diff -u -- "${expected}" "${actual}" >&2 || true
              exit 65
            fi
            for payload in "${payloads[@]}" dist/SHA256SUMS; do
              name=${payload##*/}
              gh release download "${RELEASE_TAG}" --dir "${existing}" --pattern "${name}"
              if ! cmp -s -- "${payload}" "${existing}/${name}"; then
                printf 'Error: existing release asset differs byte-for-byte from tested artifact: %s\n' \
                  "${name}" >&2
                exit 65
              fi
            done
          else
            gh release create "${RELEASE_TAG}" "${payloads[@]}" dist/SHA256SUMS \
              --verify-tag --generate-notes --title "yt-dlp aria2 downloader ${RELEASE_TAG#v}"
            created_release=true
          fi

          immutable=false
          for _ in {1..10}; do
            immutable=$(gh release view "${RELEASE_TAG}" --json isImmutable --jq '.isImmutable' 2>/dev/null || true)
            [[ ${immutable} == true ]] && break
            sleep 2
          done
          if [[ ${immutable} != true ]]; then
            printf '%s\n' 'Error: the published release is not immutable.' >&2

            if [[ ${created_release} == true ]]; then
              if ! gh release delete "${RELEASE_TAG}" --yes; then
                printf '%s\n' \
                  'Error: failed to delete the newly-created mutable release.' >&2
                exit 79
              fi

              if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
                printf '%s\n' \
                  'Error: mutable release cleanup could not be confirmed.' >&2
                exit 79
              fi

              printf '%s\n' \
                'Mutable release cleanup completed.' >&2
            else
              printf '%s\n' \
                'Error: an existing mutable release must be removed before retrying.' >&2
            fi

            exit 78
          fi

          verify_with_retry() {
            local attempt
            for ((attempt = 1; attempt <= 10; attempt++)); do
              "$@" && return 0
              sleep 3
            done
            return 1
          }
          verify_with_retry gh release verify \
            "${RELEASE_TAG}" \
            -R "${GITHUB_REPOSITORY}"
          for payload in "${payloads[@]}" dist/SHA256SUMS; do
            verify_with_retry gh release verify-asset \
              "${RELEASE_TAG}" \
              "${payload}" \
              -R "${GITHUB_REPOSITORY}"
          done

  verify-published:
    name: Fresh-download public release verification
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: release-*
          path: expected
          merge-multiple: true

      - name: Reconstruct expected public payload
        shell: bash
        run: |
          set -Eeuo pipefail

          install -m 0755 -- install-fedora.sh expected/install-fedora.sh
          install -m 0644 -- \
            packaging/keys/RPM-GPG-KEY-OscarFrog \
            expected/RPM-GPG-KEY-OscarFrog

          shopt -s nullglob
          payloads=(
            expected/*.zip
            expected/*.rpm
            expected/*.deb
            expected/install-fedora.sh
            expected/RPM-GPG-KEY-OscarFrog
          )
          shopt -u nullglob

          ((${#payloads[@]} == 5))

          (
            cd expected
            sha256sum -- \
              *.zip *.rpm *.deb \
              install-fedora.sh RPM-GPG-KEY-OscarFrog \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Download and independently verify immutable public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p public

          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          [[ ${tag_commit} =~ ^[0-9a-f]{40}$ ]]

          immutable=$(
            gh release view "${RELEASE_TAG}" \
              -R "${GITHUB_REPOSITORY}" \
              --json isImmutable \
              --jq '.isImmutable'
          )
          [[ ${immutable} == true ]] || {
            printf 'Error: public release is not immutable: %s\n' \
              "${RELEASE_TAG}" >&2
            exit 65
          }

          gh release download "${RELEASE_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --dir public

          expected_inventory=$(mktemp)
          public_inventory=$(mktemp)
          trap 'rm -f -- "${expected_inventory}" "${public_inventory}"' EXIT

          find expected -maxdepth 1 -type f -printf '%f\n' |
            LC_ALL=C sort >"${expected_inventory}"
          find public -maxdepth 1 -type f -printf '%f\n' |
            LC_ALL=C sort >"${public_inventory}"

          if ! cmp -s -- "${expected_inventory}" "${public_inventory}"; then
            printf '%s\n' \
              'Error: freshly-downloaded public release inventory differs from tested artifacts.' >&2
            diff -u -- "${expected_inventory}" "${public_inventory}" >&2 || true
            exit 65
          fi

          retry() {
            local attempt
            for ((attempt = 1; attempt <= 10; attempt++)); do
              "$@" && return 0
              sleep 3
            done
            return 1
          }

          retry gh release verify \
            "${RELEASE_TAG}" \
            -R "${GITHUB_REPOSITORY}"

          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/release.yml"

          while IFS= read -r name; do
            [[ -n ${name} ]]

            cmp -s -- "expected/${name}" "public/${name}" || {
              printf 'Error: public asset differs byte-for-byte from tested artifact: %s\n' \
                "${name}" >&2
              exit 65
            }

            retry gh release verify-asset \
              "${RELEASE_TAG}" \
              "public/${name}" \
              -R "${GITHUB_REPOSITORY}"

            retry gh attestation verify \
              "public/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${tag_commit}"
          done <"${expected_inventory}"

          (
            cd public
            sha256sum --check SHA256SUMS
          )

          printf '%s\n' \
            'Fresh public release is immutable, attested, and byte-identical to tested artifacts.'
