name: Release archive

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils shellcheck

      - name: Run validation
        run: |
          ./test-static.sh
          shellcheck -o all \
            download-video.sh \
            download-video-gui.sh \
            install-gui.sh
          shellcheck \
            test-static.sh \
            tests/mock-integration.sh \
            tests/installer-integration.sh
          ./tests/mock-integration.sh
          ./tests/installer-integration.sh

  release:
    name: Publish release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and project versions
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -Fqx -- "readonly VERSION=\"${version}\"" download-video.sh
          grep -Fq -- "# Version     : ${version}" download-video-gui.sh
          grep -Fq -- "is **${version}**." README.md
          grep -Fq -- "version actuelle est la **${version}**" README.fr.md
          grep -Fq -- "## ${version} - " CHANGELOG.md

      - name: Build ZIP archive and checksum
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          package="yt-dlp-aria2-downloader-gui-${version}"
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="${package}/" \
            --output="dist/${package}.zip" \
            "${GITHUB_SHA}"
          (
            cd dist
            sha256sum "${package}.zip" > SHA256SUMS
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          package="yt-dlp-aria2-downloader-gui-${version}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${package}.zip" \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "yt-dlp aria2 downloader ${version}"
