name: Release archive

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v2.1.9
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils shellcheck

      - name: Run validation
        run: ./tests/run-all.sh

  release:
    name: Publish release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install archive validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils shellcheck unzip

      - name: Verify tag and project versions
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ${RELEASE_TAG} != v* ]]; then
            printf 'Release tag must begin with v: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          fi

          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          checked_out_commit=$(git rev-parse HEAD)
          if [[ ${tag_commit} != "${checked_out_commit}" ]]; then
            printf 'Tag %s resolves to %s, but checkout is %s.\n' \
              "${RELEASE_TAG}" "${tag_commit}" "${checked_out_commit}" >&2
            exit 1
          fi
          if [[ ${GITHUB_EVENT_NAME} == push && ${tag_commit} != "${GITHUB_SHA}" ]]; then
            printf 'Tag %s resolves to %s, but the push event used %s.\n' \
              "${RELEASE_TAG}" "${tag_commit}" "${GITHUB_SHA}" >&2
            exit 1
          fi

          version=${RELEASE_TAG#v}
          grep -Fqx -- "readonly VERSION=\"${version}\"" download-video.sh
          grep -Fq -- "# Version     : ${version}" download-video-gui.sh
          grep -Fq -- "# Version     : ${version}" install-gui.sh
          grep -Fq -- "is **${version}**." README.md
          grep -Fq -- "version actuelle est la **${version}**" README.fr.md
          grep -Fq -- "## ${version} - " CHANGELOG.md

      - name: Build and test ZIP archive
        shell: bash
        run: |
          set -Eeuo pipefail
          version=${RELEASE_TAG#v}
          package="yt-dlp-aria2-downloader-gui-${version}"
          commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="${package}/" \
            --output="dist/${package}.zip" \
            "${commit}"
          (
            cd dist
            sha256sum "${package}.zip" > SHA256SUMS
            sha256sum --check SHA256SUMS
            unzip -t "${package}.zip"
          )

          extracted=$(mktemp -d)
          trap 'rm -rf -- "${extracted}"' EXIT
          unzip -q "dist/${package}.zip" -d "${extracted}"
          (
            cd "${extracted}/${package}"
            ./tests/run-all.sh
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version=${RELEASE_TAG#v}
          package="yt-dlp-aria2-downloader-gui-${version}"
          gh release create "${RELEASE_TAG}" \
            "dist/${package}.zip" \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "yt-dlp aria2 downloader ${version}"
