name: Update shfmt pin

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-shfmt-pin
  cancel-in-progress: false

jobs:
  prepare-shfmt-update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      update: ${{ steps.detect.outputs.update }}
      latest: ${{ steps.detect.outputs.latest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes \
            aria2 curl desktop-file-utils gnupg procps shellcheck unzip

      - name: Detect latest stable shfmt release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          latest_tag=$(gh api repos/mvdan/sh/releases/latest --jq '.tag_name')
          [[ ${latest_tag} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Error: unexpected upstream shfmt release tag: %s\n' \
              "${latest_tag}" >&2
            exit 65
          }

          tag_ref=$(
            gh api "repos/mvdan/sh/git/ref/tags/${latest_tag}" \
              --jq '[.object.type,.object.sha] | @tsv'
          )
          IFS=$'\t' read -r tag_object_type tag_object_sha <<<"${tag_ref}"
          [[ ${tag_object_type} == tag && ${tag_object_sha} =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Error: upstream shfmt release must use an annotated tag: %s\n' \
              "${latest_tag}" >&2
            exit 65
          }

          tag_verification=$(
            gh api "repos/mvdan/sh/git/tags/${tag_object_sha}" \
              --jq '[.tag,.object.type,.verification.verified,.verification.reason] | @tsv'
          )
          IFS=$'\t' read -r verified_tag target_type verified reason \
            <<<"${tag_verification}"
          if [[ ${verified_tag} != "${latest_tag}" ||
              ${target_type} != commit ||
              ${verified} != true ||
              ${reason} != valid ]]; then
            printf 'Error: upstream shfmt tag verification failed: tag=%s type=%s verified=%s reason=%s\n' \
              "${verified_tag:-<missing>}" \
              "${target_type:-<missing>}" \
              "${verified:-<missing>}" \
              "${reason:-<missing>}" >&2
            exit 65
          fi

          latest_version=${latest_tag#v}
          current_version=$(
            awk -F= \
              '$1 == "SHFMT_VERSION" { print $2; found=1 }
               END { if (!found) exit 1 }' \
              scripts/dev-tools/shfmt-pin.env
          )

          [[ ${current_version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Error: invalid current shfmt pin: %s\n' \
              "${current_version}" >&2
            exit 65
          }

          printf 'Current shfmt: v%s\n' "${current_version}"
          printf 'Latest shfmt:  v%s\n' "${latest_version}"

          if [[ ${latest_version} == "${current_version}" ]]; then
            printf 'update=false\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          newest_version=$(
            printf '%s\n%s\n' "${current_version}" "${latest_version}" |
              sort -V |
              tail -n 1
          )
          if [[ ${newest_version} != "${latest_version}" ]]; then
            printf 'Upstream latest v%s is older than the project pin v%s; refusing downgrade.\n' \
              "${latest_version}" "${current_version}"
            printf 'update=false\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          printf 'update=true\n' >>"${GITHUB_OUTPUT}"
          printf 'latest=%s\n' "${latest_version}" >>"${GITHUB_OUTPUT}"

      - name: Update pin and checksums
        if: steps.detect.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHFMT_VERSION: ${{ steps.detect.outputs.latest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          [[ ${SHFMT_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          amd64_sha=''
          arm64_sha=''
          work_dir=$(mktemp -d)
          trap 'rm -rf -- "${work_dir}"' EXIT

          for arch in amd64 arm64; do
            asset="shfmt_v${SHFMT_VERSION}_linux_${arch}"
            url="https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/${asset}"
            expected_digest=$(
              gh api "repos/mvdan/sh/releases/tags/v${SHFMT_VERSION}" \
                --jq ".assets[] | select(.name == \"${asset}\") | .digest"
            )
            if [[ ! ${expected_digest} =~ ^sha256:([0-9a-f]{64})$ ]]; then
              printf 'Error: missing or invalid GitHub release digest for %s: %s\n' \
                "${asset}" "${expected_digest:-<missing>}" >&2
              exit 65
            fi
            expected_sha=${BASH_REMATCH[1]}

            curl \
              --fail \
              --location \
              --proto '=https' \
              --tlsv1.2 \
              --retry 3 \
              --retry-delay 1 \
              --silent \
              --show-error \
              --output "${work_dir}/${asset}" \
              "${url}"

            downloaded_sha=$(sha256sum "${work_dir}/${asset}")
            downloaded_sha=${downloaded_sha%% *}
            if [[ ${downloaded_sha} != "${expected_sha}" ]]; then
              printf 'Error: downloaded shfmt digest mismatch for %s.\n' \
                "${asset}" >&2
              exit 65
            fi
            printf -v "${arch}_sha" '%s' "${downloaded_sha}"
          done

          [[ ${amd64_sha} =~ ^[0-9a-f]{64}$ ]]
          [[ ${arm64_sha} =~ ^[0-9a-f]{64}$ ]]

          case $(uname -m) in
            x86_64 | amd64)
              native_arch='amd64'
              native_sha=${amd64_sha}
              ;;
            aarch64 | arm64)
              native_arch='arm64'
              native_sha=${arm64_sha}
              ;;
            *)
              printf 'Error: unsupported runner architecture for shfmt sandbox: %s\n' \
                "$(uname -m)" >&2
              exit 69
              ;;
          esac

          candidate_dir="${RUNNER_TEMP}/shfmt-candidate-binary"
          mkdir -p -- "${candidate_dir}"
          cp -- \
            "${work_dir}/shfmt_v${SHFMT_VERSION}_linux_${native_arch}" \
            "${candidate_dir}/shfmt"
          chmod 0555 -- "${candidate_dir}/shfmt"
          printf '%s  shfmt\n' "${native_sha}" \
            >"${candidate_dir}/shfmt.sha256"

          python3 - \
            "${SHFMT_VERSION}" \
            "${amd64_sha}" \
            "${arm64_sha}" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("scripts/dev-tools/shfmt-pin.env")
          version, amd64_sha, arm64_sha = sys.argv[1:]
          text = path.read_text(encoding="utf-8")

          replacements = {
              "SHFMT_VERSION": version,
              "SHFMT_LINUX_AMD64_SHA256": amd64_sha,
              "SHFMT_LINUX_ARM64_SHA256": arm64_sha,
          }

          for key, value in replacements.items():
              pattern = rf"(?m)^{re.escape(key)}=.*$"
              text, count = re.subn(pattern, f"{key}={value}", text)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one {key} entry; found {count}"
                  )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Reformat with candidate shfmt in a no-network sandbox
        if: steps.detect.outputs.update == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          candidate_dir="${RUNNER_TEMP}/shfmt-candidate-binary"
          shell_file=$(mktemp)
          docker_context=$(mktemp -d)
          image="shfmt-candidate:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="shfmt-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup_candidate_sandbox() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
            docker image rm -f "${image}" >/dev/null 2>&1 || true
            rm -f -- "${shell_file}"
            rm -rf -- "${docker_context}"
          }
          trap cleanup_candidate_sandbox EXIT

          command -v docker >/dev/null 2>&1 || {
            printf 'Error: docker is required for isolated candidate shfmt execution.\n' >&2
            exit 127
          }

          (
            cd "${candidate_dir}"
            sha256sum --check shfmt.sha256
          )

          python3 - tests/lib/project-files.sh >"${shell_file}" <<'PY'
          from pathlib import Path
          import shlex
          import sys

          inventory = Path(sys.argv[1])
          arrays = {
              "PRODUCTION_SHELL_FILES",
              "PACKAGING_SHELL_FILES",
              "TEST_SHELL_FILES",
              "DEVELOPMENT_SHELL_FILES",
          }
          active = None
          seen = set()
          entries = []
          for raw_line in inventory.read_text(encoding="utf-8").splitlines():
              stripped = raw_line.strip()
              if active is None:
                  matched = next(
                      (name for name in arrays if stripped == f"{name}=("),
                      None,
                  )
                  if matched is not None:
                      if matched in seen:
                          raise SystemExit(f"duplicate canonical array: {matched}")
                      seen.add(matched)
                      active = matched
                  continue
              if stripped == ")":
                  active = None
                  continue
              if not stripped or stripped.startswith("#"):
                  continue
              fields = shlex.split(stripped, comments=True, posix=True)
              if len(fields) != 1 or "$" in fields[0]:
                  raise SystemExit(
                      f"unsupported canonical inventory entry: {raw_line}"
                  )
              entry = fields[0]
              path = Path(entry)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"unsafe canonical inventory path: {entry}")
              entries.append(entry)
          if active is not None:
              raise SystemExit(f"unterminated canonical array: {active}")
          if seen != arrays:
              missing = ", ".join(sorted(arrays - seen))
              raise SystemExit(f"missing canonical arrays: {missing}")
          if not entries:
              raise SystemExit("canonical shell inventory is empty")
          for entry in sorted(set(entries)):
              print(entry)
          PY

          mapfile -t shell_files <"${shell_file}"
          ((${#shell_files[@]} > 0))

          for file in "${shell_files[@]}"; do
            [[ -f ${file} && ! -L ${file} ]] || {
              printf 'Error: unsafe canonical shell file for candidate sandbox: %s\n' \
                "${file}" >&2
              exit 65
            }
          done

          cp -- "${candidate_dir}/shfmt" "${docker_context}/shfmt"
          cat >"${docker_context}/Dockerfile" <<'DOCKERFILE'
          FROM scratch
          COPY shfmt /shfmt
          ENTRYPOINT ["/shfmt"]
          DOCKERFILE

          docker build \
            --network=none \
            --tag "${image}" \
            "${docker_context}"

          timeout --signal=TERM --kill-after=10s 30s \
            docker run \
              --rm \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=64 \
              --memory=512m \
              --cpus=2 \
              --user "$(id -u):$(id -g)" \
              "${image}" \
              --version

          timeout --signal=TERM --kill-after=10s 2m \
            docker run \
              --name "${container}" \
              --rm \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=64 \
              --memory=512m \
              --cpus=2 \
              --user "$(id -u):$(id -g)" \
              --volume "${GITHUB_WORKSPACE}:/workspace:rw" \
              --volume "${GITHUB_WORKSPACE}/.git:/workspace/.git:ro" \
              --workdir /workspace \
              "${image}" \
              -w -i 4 -ci -bn -- \
              "${shell_files[@]}"

      - name: Build data-only shfmt handoff
        if: steps.detect.outputs.update == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          # The candidate formatter is untrusted. Do not source or execute any
          # project file after it has run. Capture every tracked change and let a
          # fresh read-only verifier enforce the exact allowlist and semantics.
          handoff_dir="${RUNNER_TEMP}/shfmt-update-handoff"
          patch="${handoff_dir}/shfmt-update.patch"
          mkdir -p -- "${handoff_dir}"

          git diff --binary >"${patch}"

          if [[ ! -s ${patch} ]]; then
            printf 'Error: shfmt update produced an empty handoff patch.\n' >&2
            exit 65
          fi

          (
            cd "${handoff_dir}"
            sha256sum shfmt-update.patch >shfmt-update.patch.sha256
          )

      - name: Upload data-only shfmt handoff
        if: steps.detect.outputs.update == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shfmt-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shfmt-update-handoff/shfmt-update.patch
            ${{ runner.temp }}/shfmt-update-handoff/shfmt-update.patch.sha256
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  verify-shfmt-update:
    needs: prepare-shfmt-update
    if: github.ref == 'refs/heads/main' && needs.prepare-shfmt-update.outputs.update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_BASE_SHA: ${{ github.sha }}
      SHFMT_VERSION: ${{ needs.prepare-shfmt-update.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verifier dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            aria2 curl desktop-file-utils findutils gnupg procps python3 shellcheck unzip
      - name: Download untrusted candidate handoff
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: shfmt-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shfmt-candidate-handoff
      - name: Verify formatter-only semantics and upstream provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ ${EXPECTED_BASE_SHA} =~ ^[0-9a-f]{40}$ ]]
          [[ ${SHFMT_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          actual_base=$(git rev-parse HEAD)
          [[ ${actual_base} == "${EXPECTED_BASE_SHA}" ]] || {
            printf 'Error: verifier checkout/base mismatch.\n' >&2
            exit 65
          }

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          current_main=$(git rev-parse refs/remotes/origin/main)
          if [[ ${current_main} != "${EXPECTED_BASE_SHA}" ]]; then
            printf 'Error: main advanced from %s to %s; refusing stale shfmt candidate.\n' \
              "${EXPECTED_BASE_SHA}" "${current_main}" >&2
            exit 75
          fi

          candidate_dir="${RUNNER_TEMP}/shfmt-candidate-handoff"
          patch="${candidate_dir}/shfmt-update.patch"
          patch_digest="${candidate_dir}/shfmt-update.patch.sha256"
          [[ -f ${patch} && ! -L ${patch} ]]
          [[ -f ${patch_digest} && ! -L ${patch_digest} ]]
          mapfile -t candidate_entries < <(
            find "${candidate_dir}" -mindepth 1 -maxdepth 1 -printf '%f\n' |
              LC_ALL=C sort
          )
          expected_candidate_entries=(
            shfmt-update.patch
            shfmt-update.patch.sha256
          )
          [[ ${candidate_entries[*]} == "${expected_candidate_entries[*]}" ]] || {
            printf 'Error: unexpected candidate handoff entries: %s\n' \
              "${candidate_entries[*]}" >&2
            exit 65
          }
          (
            cd "${candidate_dir}"
            sha256sum --check shfmt-update.patch.sha256
          )

          allowed_file=$(mktemp)
          shell_file=$(mktemp)
          patch_paths=$(mktemp)
          unexpected_paths=$(mktemp)
          baseline=$(mktemp)
          after=$(mktemp)
          expected_pin=$(mktemp)
          verified_dir="${RUNNER_TEMP}/shfmt-verified-handoff"
          mkdir -p -- "${verified_dir}"
          trap 'rm -f -- "${allowed_file}" "${shell_file}" "${patch_paths}" "${unexpected_paths}" "${baseline}" "${after}" "${expected_pin}"' EXIT

          python3 - tests/lib/project-files.sh >"${shell_file}" <<'PY'
          from pathlib import Path
          import shlex
          import sys

          inventory = Path(sys.argv[1])
          arrays = {
              "PRODUCTION_SHELL_FILES",
              "PACKAGING_SHELL_FILES",
              "TEST_SHELL_FILES",
              "DEVELOPMENT_SHELL_FILES",
          }
          active = None
          seen = set()
          entries = []
          for raw_line in inventory.read_text(encoding="utf-8").splitlines():
              stripped = raw_line.strip()
              if active is None:
                  matched = next(
                      (name for name in arrays if stripped == f"{name}=("),
                      None,
                  )
                  if matched is not None:
                      if matched in seen:
                          raise SystemExit(f"duplicate canonical array: {matched}")
                      seen.add(matched)
                      active = matched
                  continue
              if stripped == ")":
                  active = None
                  continue
              if not stripped or stripped.startswith("#"):
                  continue
              fields = shlex.split(stripped, comments=True, posix=True)
              if len(fields) != 1 or "$" in fields[0]:
                  raise SystemExit(
                      f"unsupported canonical inventory entry: {raw_line}"
                  )
              entries.append(fields[0])
          if active is not None:
              raise SystemExit(f"unterminated canonical array: {active}")
          if seen != arrays:
              missing = ", ".join(sorted(arrays - seen))
              raise SystemExit(f"missing canonical arrays: {missing}")
          if not entries:
              raise SystemExit("canonical shell inventory is empty")
          for entry in sorted(set(entries)):
              print(entry)
          PY

          if grep -Fxq 'tests/lib/project-files.sh' "${shell_file}"; then
            grep -Fxv 'tests/lib/project-files.sh' "${shell_file}" >"${shell_file}.new"
            mv -f -- "${shell_file}.new" "${shell_file}"
          fi
          [[ -s ${shell_file} ]]
          {
            printf '%s\n' scripts/dev-tools/shfmt-pin.env
            cat -- "${shell_file}"
          } | LC_ALL=C sort -u >"${allowed_file}"

          trusted_shfmt=$(bash ./scripts/dev-tools/ensure-shfmt.sh)
          [[ -x ${trusted_shfmt} && ! -L ${trusted_shfmt} ]] || {
            printf 'Error: trusted prior shfmt could not be resolved.\n' >&2
            exit 65
          }

          canonical_manifest() {
            local output=$1
            local file
            local digest
            : >"${output}"
            while IFS= read -r file; do
              digest=$(
                "${trusted_shfmt}" -i 4 -ci -bn -- "${file}" |
                  sha256sum |
                  awk '{ print $1 }'
              )
              [[ ${digest} =~ ^[0-9a-f]{64}$ ]]
              printf '%s  %s\n' "${digest}" "${file}" >>"${output}"
            done <"${shell_file}"
          }
          canonical_manifest "${baseline}"

          git apply --check -- "${patch}"
          git apply --numstat -- "${patch}" |
            while IFS=$'\t' read -r added removed path; do
              if [[ ${added} == '-' || ${removed} == '-' ]]; then
                printf 'Error: binary content is forbidden in shfmt candidate: %s\n' \
                  "${path}" >&2
                exit 65
              fi
              printf '%s\n' "${path}"
            done |
            LC_ALL=C sort -u >"${patch_paths}"

          [[ -s ${patch_paths} ]]
          grep -Fxq 'scripts/dev-tools/shfmt-pin.env' "${patch_paths}"
          if grep -Fxq 'tests/lib/project-files.sh' "${patch_paths}"; then
            printf 'Error: shfmt automation may not modify its canonical inventory controller.\n' >&2
            exit 65
          fi
          comm -23 -- "${patch_paths}" "${allowed_file}" >"${unexpected_paths}"
          if [[ -s ${unexpected_paths} ]]; then
            printf 'Error: shfmt candidate contains paths outside the trusted allowlist:\n' >&2
            cat -- "${unexpected_paths}" >&2
            exit 65
          fi

          git apply -- "${patch}"
          git diff --check
          diff_summary=$(git diff --summary)
          if [[ -n ${diff_summary} ]]; then
            printf 'Error: shfmt candidate changes file type/mode or creates, deletes, or renames files:\n%s\n' \
              "${diff_summary}" >&2
            exit 65
          fi

          canonical_manifest "${after}"
          if ! cmp -s -- "${baseline}" "${after}"; then
            printf 'Error: candidate shfmt changed canonical shell semantics/content under the previously trusted formatter.\n' >&2
            diff -u -- "${baseline}" "${after}" >&2 || true
            exit 65
          fi

          pin_version=$(awk -F= '$1 == "SHFMT_VERSION" { print $2 }' scripts/dev-tools/shfmt-pin.env)
          pin_amd64=$(awk -F= '$1 == "SHFMT_LINUX_AMD64_SHA256" { print $2 }' scripts/dev-tools/shfmt-pin.env)
          pin_arm64=$(awk -F= '$1 == "SHFMT_LINUX_ARM64_SHA256" { print $2 }' scripts/dev-tools/shfmt-pin.env)
          [[ ${pin_version} == "${SHFMT_VERSION}" ]]
          [[ ${pin_amd64} =~ ^[0-9a-f]{64}$ ]]
          [[ ${pin_arm64} =~ ^[0-9a-f]{64}$ ]]

          {
            printf '%s\n'               '# Managed by .github/workflows/shfmt-update.yml.'
            printf '%s\n'               '# Do not change a checksum without changing/reviewing the corresponding asset.'
            printf 'SHFMT_VERSION=%s\n' "${pin_version}"
            printf 'SHFMT_LINUX_AMD64_SHA256=%s\n' "${pin_amd64}"
            printf 'SHFMT_LINUX_ARM64_SHA256=%s\n' "${pin_arm64}"
          } >"${expected_pin}"

          if ! cmp -s -- scripts/dev-tools/shfmt-pin.env "${expected_pin}"; then
            printf '%s\n'               'Error: candidate shfmt pin file differs from the exact data-only schema.' >&2
            exit 65
          fi

          upstream_tag="v${pin_version}"
          tag_ref=$(
            gh api "repos/mvdan/sh/git/ref/tags/${upstream_tag}" \
              --jq '[.object.type,.object.sha] | @tsv'
          )
          IFS=$'\t' read -r tag_object_type tag_object_sha <<<"${tag_ref}"
          [[ ${tag_object_type} == tag && ${tag_object_sha} =~ ^[0-9a-f]{40}$ ]]
          tag_verification=$(
            gh api "repos/mvdan/sh/git/tags/${tag_object_sha}" \
              --jq '[.tag,.object.type,.verification.verified,.verification.reason] | @tsv'
          )
          IFS=$'\t' read -r verified_tag target_type verified reason <<<"${tag_verification}"
          if [[ ${verified_tag} != "${upstream_tag}" ||
              ${target_type} != commit ||
              ${verified} != true ||
              ${reason} != valid ]]; then
            printf 'Error: verifier rejected upstream shfmt tag provenance.\n' >&2
            exit 65
          fi

          for arch in amd64 arm64; do
            asset="shfmt_v${pin_version}_linux_${arch}"
            release_digest=$(
              gh api "repos/mvdan/sh/releases/tags/${upstream_tag}" \
                --jq ".assets[] | select(.name == \"${asset}\") | .digest"
            )
            [[ ${release_digest} =~ ^sha256:([0-9a-f]{64})$ ]] || {
              printf 'Error: verifier could not resolve upstream digest for %s.\n' \
                "${asset}" >&2
              exit 65
            }
            expected_sha=${BASH_REMATCH[1]}
            if [[ ${arch} == amd64 ]]; then
              pinned_sha=${pin_amd64}
            else
              pinned_sha=${pin_arm64}
            fi
            [[ ${pinned_sha} == "${expected_sha}" ]] || {
              printf 'Error: candidate pin does not match GitHub release digest for %s.\n' \
                "${asset}" >&2
              exit 65
            }
          done

          cp -- "${patch}" "${verified_dir}/shfmt-update.patch"
          (
            cd "${verified_dir}"
            sha256sum shfmt-update.patch >shfmt-update.patch.sha256
          )
          mapfile -t verified_shell_files <"${shell_file}"
          sha256sum -- \
            scripts/dev-tools/shfmt-pin.env \
            "${verified_shell_files[@]}" \
            >"${verified_dir}/shfmt-tested-tree.sha256"
      - name: Validate verified formatter and project
        shell: bash
        run: timeout --signal=TERM --kill-after=10s 8m bash ./tests/run-all.sh

      - name: Upload verified data-only shfmt handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shfmt-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shfmt-verified-handoff/shfmt-update.patch
            ${{ runner.temp }}/shfmt-verified-handoff/shfmt-update.patch.sha256
            ${{ runner.temp }}/shfmt-verified-handoff/shfmt-tested-tree.sha256
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-shfmt-pr:
    needs:
      - prepare-shfmt-update
      - verify-shfmt-update
    if: github.ref == 'refs/heads/main' && needs.prepare-shfmt-update.outputs.update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      EXPECTED_BASE_SHA: ${{ github.sha }}
      SHFMT_VERSION: ${{ needs.prepare-shfmt-update.outputs.latest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified data-only shfmt handoff
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: shfmt-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shfmt-update-handoff

      - name: Verify base and apply allowlisted patch
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          [[ ${EXPECTED_BASE_SHA} =~ ^[0-9a-f]{40}$ ]]
          [[ ${SHFMT_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          actual_base=$(git rev-parse HEAD)
          if [[ ${actual_base} != "${EXPECTED_BASE_SHA}" ]]; then
            printf 'Error: checkout SHA %s does not match candidate base %s.\n' \
              "${actual_base}" "${EXPECTED_BASE_SHA}" >&2
            exit 65
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          current_main=$(git rev-parse refs/remotes/origin/main)
          if [[ ${current_main} != "${EXPECTED_BASE_SHA}" ]]; then
            printf 'Error: main advanced from %s to %s; refusing stale shfmt handoff.\n' \
              "${EXPECTED_BASE_SHA}" "${current_main}" >&2
            exit 75
          fi

          if [[ -n $(git status --short) ]]; then
            printf 'Error: privileged checkout is not clean before patch application.\n' >&2
            git status --short >&2
            exit 65
          fi

          handoff_dir="${RUNNER_TEMP}/shfmt-update-handoff"
          patch="${handoff_dir}/shfmt-update.patch"
          digest="${handoff_dir}/shfmt-update.patch.sha256"

          [[ -f ${patch} && ! -L ${patch} ]]
          [[ -f ${digest} && ! -L ${digest} ]]

          mapfile -t handoff_entries < <(
            find "${handoff_dir}" \
              -mindepth 1 \
              -maxdepth 1 \
              -printf '%f\n' |
              LC_ALL=C sort
          )
          expected_entries=(
            shfmt-tested-tree.sha256
            shfmt-update.patch
            shfmt-update.patch.sha256
          )
          if [[ ${handoff_entries[*]} != "${expected_entries[*]}" ]]; then
            printf 'Error: unexpected shfmt handoff entries: %s\n' \
              "${handoff_entries[*]}" >&2
            exit 65
          fi

          (
            cd "${handoff_dir}"
            sha256sum --check shfmt-update.patch.sha256
          )

          allowed_file=$(mktemp)
          patch_paths=$(mktemp)
          changed_paths=$(mktemp)
          unexpected_paths=$(mktemp)
          trap 'rm -f -- "${allowed_file}" "${patch_paths}" "${changed_paths}" "${unexpected_paths}"' EXIT

          {
            printf '%s\n' scripts/dev-tools/shfmt-pin.env
            python3 - tests/lib/project-files.sh <<'PY'
          from pathlib import Path
          import shlex
          import sys

          inventory = Path(sys.argv[1])
          arrays = {
              "PRODUCTION_SHELL_FILES",
              "PACKAGING_SHELL_FILES",
              "TEST_SHELL_FILES",
              "DEVELOPMENT_SHELL_FILES",
          }
          active = None
          seen = set()
          entries = []

          for raw_line in inventory.read_text(encoding="utf-8").splitlines():
              stripped = raw_line.strip()
              if active is None:
                  matched = next(
                      (name for name in arrays if stripped == f"{name}=("),
                      None,
                  )
                  if matched is not None:
                      if matched in seen:
                          raise SystemExit(f"duplicate canonical array: {matched}")
                      seen.add(matched)
                      active = matched
                  continue

              if stripped == ")":
                  active = None
                  continue
              if not stripped or stripped.startswith("#"):
                  continue

              fields = shlex.split(stripped, comments=True, posix=True)
              if len(fields) != 1 or "$" in fields[0]:
                  raise SystemExit(
                      f"unsupported canonical inventory entry: {raw_line}"
                  )
              entries.append(fields[0])

          if active is not None:
              raise SystemExit(f"unterminated canonical array: {active}")
          if seen != arrays:
              missing = ", ".join(sorted(arrays - seen))
              raise SystemExit(f"missing canonical arrays: {missing}")
          if not entries:
              raise SystemExit("canonical shell inventory is empty")

          for entry in entries:
              print(entry)
          PY
          } |
            grep -Fxv 'tests/lib/project-files.sh' |
            LC_ALL=C sort -u >"${allowed_file}"

          git apply --check -- "${patch}"
          git apply --numstat -- "${patch}" |
            while IFS=$'\t' read -r added removed path; do
              if [[ ${added} == '-' || ${removed} == '-' ]]; then
                printf 'Error: binary content is forbidden in shfmt handoff: %s\n' \
                  "${path}" >&2
                exit 65
              fi
              printf '%s\n' "${path}"
            done |
            LC_ALL=C sort -u >"${patch_paths}"

          [[ -s ${patch_paths} ]]
          grep -Fxq 'scripts/dev-tools/shfmt-pin.env' "${patch_paths}"
          comm -23 -- "${patch_paths}" "${allowed_file}" >"${unexpected_paths}"
          if [[ -s ${unexpected_paths} ]]; then
            printf 'Error: shfmt handoff contains paths outside the allowlist:\n' >&2
            cat -- "${unexpected_paths}" >&2
            exit 65
          fi

          git apply -- "${patch}"
          git diff --check

          diff_summary=$(git diff --summary)
          if [[ -n ${diff_summary} ]]; then
            printf 'Error: shfmt handoff changes file type/mode or creates, deletes, or renames files:\n%s\n' \
              "${diff_summary}" >&2
            exit 65
          fi

          git diff --numstat |
            while IFS=$'\t' read -r added removed path; do
              if [[ ${added} == '-' || ${removed} == '-' ]]; then
                printf 'Error: binary working-tree change is forbidden: %s\n' \
                  "${path}" >&2
                exit 65
              fi
            done

          git diff --name-only --no-renames | LC_ALL=C sort -u >"${changed_paths}"
          [[ -s ${changed_paths} ]]
          grep -Fxq 'scripts/dev-tools/shfmt-pin.env' "${changed_paths}"
          comm -23 -- "${changed_paths}" "${allowed_file}" >"${unexpected_paths}"
          if [[ -s ${unexpected_paths} ]]; then
            printf 'Error: applied shfmt handoff changed unexpected paths:\n' >&2
            cat -- "${unexpected_paths}" >&2
            exit 65
          fi

          if grep -Fxq 'tests/lib/project-files.sh' "${changed_paths}"; then
            printf 'Error: verified shfmt handoff unexpectedly changes the canonical inventory controller.\n' >&2
            exit 65
          fi
          sha256sum --check "${handoff_dir}/shfmt-tested-tree.sha256"

      - name: Create or update shfmt pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ ${SHFMT_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          branch="automation/shfmt-v${SHFMT_VERSION}"

          mapfile -t changed_paths < <(git diff --name-only --no-renames)
          if ((${#changed_paths[@]} == 0)); then
            printf 'Error: no validated formatter changes remain for publication.\n' >&2
            exit 65
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "${branch}"
          git add -- "${changed_paths[@]}"

          if git diff --cached --quiet; then
            printf 'Error: validated shfmt changes were not staged.\n' >&2
            exit 65
          fi

          git -c core.hooksPath=/dev/null commit \
            -m "Update shfmt to v${SHFMT_VERSION}"

          gh auth setup-git
          set +e
          remote_line=$(
            git ls-remote --exit-code --heads \
              origin "refs/heads/${branch}" 2>/dev/null
          )
          remote_status=$?
          set -e

          case ${remote_status} in
            0)
              remote_sha=${remote_line%%[[:space:]]*}
              if [[ ! ${remote_sha} =~ ^[0-9a-f]{40}$ ]]; then
                printf 'Error: invalid remote automation branch SHA: %s\n' \
                  "${remote_sha}" >&2
                exit 65
              fi
              git push \
                --force-with-lease="refs/heads/${branch}:${remote_sha}" \
                origin \
                "HEAD:refs/heads/${branch}"
              ;;
            2)
              git push --set-upstream origin \
                "HEAD:refs/heads/${branch}"
              ;;
            *)
              printf 'Error: unable to determine remote shfmt automation branch state (status %d).\n' \
                "${remote_status}" >&2
              exit 69
              ;;
          esac

          existing_pr=$(
            gh pr list \
              --state open \
              --head "${branch}" \
              --json number \
              --jq '.[0].number // empty'
          )

          if [[ -n ${existing_pr} ]]; then
            printf 'Updated existing shfmt PR #%s.\n' "${existing_pr}"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "Update shfmt to v${SHFMT_VERSION}" \
            --body "Automated shfmt update to v${SHFMT_VERSION}.

          The candidate formatter ran without repository write permission. A separate
          fresh read-only verifier rechecked upstream tag/digest provenance, required
          canonical equivalence under the previously trusted shfmt, and bound the exact
          tested tree to the data-only handoff consumed here. Review remains required
          before merge."
