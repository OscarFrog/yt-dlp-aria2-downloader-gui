name: Update shfmt pin

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-shfmt-pin
  cancel-in-progress: false

jobs:
  prepare-shfmt-update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      update: ${{ steps.detect.outputs.update }}
      latest: ${{ steps.detect.outputs.latest }}
      project_version: ${{ steps.source_version.outputs.project_version }}
      version_floor: ${{ steps.source_version.outputs.version_floor }}
      version_date: ${{ steps.source_version.outputs.version_date }}
      previous_branch_sha: ${{ steps.source_version.outputs.previous_branch_sha }}
      ref_catalog_sha: ${{ steps.source_version.outputs.ref_catalog_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes \
            aria2 curl desktop-file-utils gnupg procps shellcheck unzip

      - name: Detect latest stable shfmt release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          latest_tag=$(gh api repos/mvdan/sh/releases/latest --jq '.tag_name')
          [[ ${latest_tag} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Error: unexpected upstream shfmt release tag: %s\n' \
              "${latest_tag}" >&2
            exit 65
          }

          tag_ref=$(
            gh api "repos/mvdan/sh/git/ref/tags/${latest_tag}" \
              --jq '[.object.type,.object.sha] | @tsv'
          )
          IFS=$'\t' read -r tag_object_type tag_object_sha <<<"${tag_ref}"
          [[ ${tag_object_type} == tag && ${tag_object_sha} =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Error: upstream shfmt release must use an annotated tag: %s\n' \
              "${latest_tag}" >&2
            exit 65
          }

          tag_verification=$(
            gh api "repos/mvdan/sh/git/tags/${tag_object_sha}" \
              --jq '[.tag,.object.type,.verification.verified,.verification.reason] | @tsv'
          )
          IFS=$'\t' read -r verified_tag target_type verified reason \
            <<<"${tag_verification}"
          if [[ ${verified_tag} != "${latest_tag}" ||
              ${target_type} != commit ||
              ${verified} != true ||
              ${reason} != valid ]]; then
            printf 'Error: upstream shfmt tag verification failed: tag=%s type=%s verified=%s reason=%s\n' \
              "${verified_tag:-<missing>}" \
              "${target_type:-<missing>}" \
              "${verified:-<missing>}" \
              "${reason:-<missing>}" >&2
            exit 65
          fi

          latest_version=${latest_tag#v}
          current_version=$(
            awk -F= \
              '$1 == "SHFMT_VERSION" { print $2; found=1 }
               END { if (!found) exit 1 }' \
              scripts/dev-tools/shfmt-pin.env
          )

          [[ ${current_version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Error: invalid current shfmt pin: %s\n' \
              "${current_version}" >&2
            exit 65
          }

          printf 'Current shfmt: v%s\n' "${current_version}"
          printf 'Latest shfmt:  v%s\n' "${latest_version}"

          if [[ ${latest_version} == "${current_version}" ]]; then
            printf 'update=false\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          newest_version=$(
            printf '%s\n%s\n' "${current_version}" "${latest_version}" |
              sort -V |
              tail -n 1
          )
          if [[ ${newest_version} != "${latest_version}" ]]; then
            printf 'Upstream latest v%s is older than the project pin v%s; refusing downgrade.\n' \
              "${latest_version}" "${current_version}"
            printf 'update=false\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          # Preserve an existing automation branch. A same-base upstream candidate
          # needs review, not another source push; stale or divergent branches
          # require a maintainer decision instead of a blind force-with-lease update.
          export GIT_NO_REPLACE_OBJECTS=1
          branch="automation/shfmt-v${latest_version}"
          existing=$(git ls-remote --refs origin "refs/heads/${branch}")
          if [[ -n ${existing} ]]; then
            git fetch --no-tags origin \
              "refs/heads/${branch}:refs/remotes/origin/${branch}"
            branch_sha=$(git rev-parse "refs/remotes/origin/${branch}")
            branch_parents=$(git show --no-show-signature -s --format=%P "${branch_sha}")
            if [[ ${branch_parents} != "${GITHUB_SHA}" ]]; then
              printf 'Error: existing shfmt branch has a different base; preserve and review %s before retrying.\n' \
                "${branch}" >&2
              exit 65
            fi
            amd64_digest=$(gh api "repos/mvdan/sh/releases/tags/${latest_tag}" \
              --jq '.assets[] | select(.name | endswith("_linux_amd64")) | .digest')
            arm64_digest=$(gh api "repos/mvdan/sh/releases/tags/${latest_tag}" \
              --jq '.assets[] | select(.name | endswith("_linux_arm64")) | .digest')
            [[ ${amd64_digest} =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ ${arm64_digest} =~ ^sha256:[0-9a-f]{64}$ ]]
            python3 - "${branch_sha}" "${latest_version}" \
              "${amd64_digest#sha256:}" "${arm64_digest#sha256:}" <<'PYCODE'
          import importlib.util
          import sys

          spec = importlib.util.spec_from_file_location("push_version", "scripts/check-push-version.py")
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)
          oid, version, amd64, arm64 = sys.argv[1:]
          checker.coherent_version(lambda path: checker.object_source(oid, path))
          expected = (
              "# Managed by .github/workflows/shfmt-update.yml.\n"
              "# Do not change a checksum without changing/reviewing the corresponding asset.\n"
              f"SHFMT_VERSION={version}\nSHFMT_LINUX_AMD64_SHA256={amd64}\n"
              f"SHFMT_LINUX_ARM64_SHA256={arm64}\n"
          )
          if checker.object_source(oid, "scripts/dev-tools/shfmt-pin.env").decode("utf-8") != expected:
              raise SystemExit("Error: existing shfmt branch differs from the expected upstream pin; preserve and review it.")
          PYCODE
            printf 'Branch %s already carries this upstream pin on the same base; review it without another push.\n' \
              "${branch}"
            printf 'update=false\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          printf 'update=true\n' >>"${GITHUB_OUTPUT}"
          printf 'latest=%s\n' "${latest_version}" >>"${GITHUB_OUTPUT}"

      - name: Prepare a coherent source version before candidate execution
        id: source_version
        if: steps.detect.outputs.update == 'true'
        env:
          EXPECTED_BASE_SHA: ${{ github.sha }}
          SHFMT_VERSION: ${{ steps.detect.outputs.latest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          export GIT_NO_REPLACE_OBJECTS=1
          [[ ${EXPECTED_BASE_SHA} =~ ^[0-9a-f]{40}$ ]]
          [[ ${SHFMT_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          branch="automation/shfmt-v${SHFMT_VERSION}"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          plan="${RUNNER_TEMP}/shfmt-source-version-plan.json"
          prepared="${RUNNER_TEMP}/shfmt-source-version-prepared.json"
          python3 -B scripts/check-push-version.py next-version \
            --remote origin --branch "${branch}" >"${plan}"
          base_timestamp=$(git show --no-show-signature -s --format=%ct "${EXPECTED_BASE_SHA}")
          [[ ${base_timestamp} =~ ^[0-9]+$ ]]
          version_date=$(date -u --date="@${base_timestamp}" +%F)
          python3 - "${plan}" "${EXPECTED_BASE_SHA}" "${branch}" >"${plan}.values" <<'PYCODE'
          import json
          from pathlib import Path
          import re
          import sys

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (plan.get("schema_version") != 1 or plan.get("remote") != "origin"
                  or plan.get("main_sha") != sys.argv[2] or plan.get("branch") != sys.argv[3]
                  or plan.get("target_sha") != "0" * 40):
              raise SystemExit("Error: stale or invalid shfmt source-version baseline.")
          for key, pattern in (("floor_version", r"[0-9]+\.[0-9]+\.[0-9]+"),
                               ("next_version", r"[0-9]+\.[0-9]+\.[0-9]+"),
                               ("target_sha", r"[0-9a-f]{40}"),
                               ("refs_sha256", r"[0-9a-f]{64}")):
              value = plan.get(key)
              if not isinstance(value, str) or not re.fullmatch(pattern, value):
                  raise SystemExit("Error: malformed source-version metadata.")
              print(value)
          PYCODE
          mapfile -t version_values <"${plan}.values"
          floor=${version_values[0]}
          project_version=${version_values[1]}
          python3 -B scripts/prepare-source-version.py --root . \
            --floor-version "${floor}" --date "${version_date}" \
            --reason "Update shfmt to v${SHFMT_VERSION}" >"${prepared}"
          python3 - "${prepared}" "${project_version}" <<'PYCODE'
          import json
          from pathlib import Path
          import sys

          if json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["new_version"] != sys.argv[2]:
              raise SystemExit("Error: prepared source version differs from its remote baseline.")
          PYCODE
          {
            printf 'project_version=%s\n' "${project_version}"
            printf 'version_floor=%s\n' "${floor}"
            printf 'version_date=%s\n' "${version_date}"
            printf 'previous_branch_sha=%s\n' "${version_values[2]}"
            printf 'ref_catalog_sha=%s\n' "${version_values[3]}"
          } >>"${GITHUB_OUTPUT}"

      - name: Update pin and checksums
        if: steps.detect.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHFMT_VERSION: ${{ steps.detect.outputs.latest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          [[ ${SHFMT_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          amd64_sha=''
          arm64_sha=''
          work_dir=$(mktemp -d)
          trap 'rm -rf -- "${work_dir}"' EXIT

          for arch in amd64 arm64; do
            asset="shfmt_v${SHFMT_VERSION}_linux_${arch}"
            url="https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/${asset}"
            expected_digest=$(
              gh api "repos/mvdan/sh/releases/tags/v${SHFMT_VERSION}" \
                --jq ".assets[] | select(.name == \"${asset}\") | .digest"
            )
            if [[ ! ${expected_digest} =~ ^sha256:([0-9a-f]{64})$ ]]; then
              printf 'Error: missing or invalid GitHub release digest for %s: %s\n' \
                "${asset}" "${expected_digest:-<missing>}" >&2
              exit 65
            fi
            expected_sha=${BASH_REMATCH[1]}

            curl \
              --fail \
              --location \
              --proto '=https' \
              --tlsv1.2 \
              --retry 3 \
              --retry-delay 1 \
              --silent \
              --show-error \
              --output "${work_dir}/${asset}" \
              "${url}"

            downloaded_sha=$(sha256sum "${work_dir}/${asset}")
            downloaded_sha=${downloaded_sha%% *}
            if [[ ${downloaded_sha} != "${expected_sha}" ]]; then
              printf 'Error: downloaded shfmt digest mismatch for %s.\n' \
                "${asset}" >&2
              exit 65
            fi
            printf -v "${arch}_sha" '%s' "${downloaded_sha}"
          done

          [[ ${amd64_sha} =~ ^[0-9a-f]{64}$ ]]
          [[ ${arm64_sha} =~ ^[0-9a-f]{64}$ ]]

          case $(uname -m) in
            x86_64 | amd64)
              native_arch='amd64'
              native_sha=${amd64_sha}
              ;;
            aarch64 | arm64)
              native_arch='arm64'
              native_sha=${arm64_sha}
              ;;
            *)
              printf 'Error: unsupported runner architecture for shfmt sandbox: %s\n' \
                "$(uname -m)" >&2
              exit 69
              ;;
          esac

          candidate_dir="${RUNNER_TEMP}/shfmt-candidate-binary"
          mkdir -p -- "${candidate_dir}"
          cp -- \
            "${work_dir}/shfmt_v${SHFMT_VERSION}_linux_${native_arch}" \
            "${candidate_dir}/shfmt"
          chmod 0555 -- "${candidate_dir}/shfmt"
          printf '%s  shfmt\n' "${native_sha}" \
            >"${candidate_dir}/shfmt.sha256"

          python3 - \
            "${SHFMT_VERSION}" \
            "${amd64_sha}" \
            "${arm64_sha}" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("scripts/dev-tools/shfmt-pin.env")
          version, amd64_sha, arm64_sha = sys.argv[1:]
          text = path.read_text(encoding="utf-8")

          replacements = {
              "SHFMT_VERSION": version,
              "SHFMT_LINUX_AMD64_SHA256": amd64_sha,
              "SHFMT_LINUX_ARM64_SHA256": arm64_sha,
          }

          for key, value in replacements.items():
              pattern = rf"(?m)^{re.escape(key)}=.*$"
              text, count = re.subn(pattern, f"{key}={value}", text)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one {key} entry; found {count}"
                  )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Reformat with candidate shfmt in a no-network sandbox
        if: steps.detect.outputs.update == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          candidate_dir="${RUNNER_TEMP}/shfmt-candidate-binary"
          shell_file=$(mktemp)
          docker_context=$(mktemp -d)
          image="shfmt-candidate:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="shfmt-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup_candidate_sandbox() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
            docker image rm -f "${image}" >/dev/null 2>&1 || true
            rm -f -- "${shell_file}"
            rm -rf -- "${docker_context}"
          }
          trap cleanup_candidate_sandbox EXIT

          command -v docker >/dev/null 2>&1 || {
            printf 'Error: docker is required for isolated candidate shfmt execution.\n' >&2
            exit 127
          }

          (
            cd "${candidate_dir}"
            sha256sum --check shfmt.sha256
          )

          python3 - tests/lib/project-files.sh >"${shell_file}" <<'PY'
          from pathlib import Path
          import shlex
          import sys

          inventory = Path(sys.argv[1])
          arrays = {
              "PRODUCTION_SHELL_FILES",
              "PACKAGING_SHELL_FILES",
              "TEST_SHELL_FILES",
              "DEVELOPMENT_SHELL_FILES",
          }
          active = None
          seen = set()
          entries = []
          for raw_line in inventory.read_text(encoding="utf-8").splitlines():
              stripped = raw_line.strip()
              if active is None:
                  matched = next(
                      (name for name in arrays if stripped == f"{name}=("),
                      None,
                  )
                  if matched is not None:
                      if matched in seen:
                          raise SystemExit(f"duplicate canonical array: {matched}")
                      seen.add(matched)
                      active = matched
                  continue
              if stripped == ")":
                  active = None
                  continue
              if not stripped or stripped.startswith("#"):
                  continue
              fields = shlex.split(stripped, comments=True, posix=True)
              if len(fields) != 1 or "$" in fields[0]:
                  raise SystemExit(
                      f"unsupported canonical inventory entry: {raw_line}"
                  )
              entry = fields[0]
              path = Path(entry)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"unsafe canonical inventory path: {entry}")
              entries.append(entry)
          if active is not None:
              raise SystemExit(f"unterminated canonical array: {active}")
          if seen != arrays:
              missing = ", ".join(sorted(arrays - seen))
              raise SystemExit(f"missing canonical arrays: {missing}")
          if not entries:
              raise SystemExit("canonical shell inventory is empty")
          for entry in sorted(set(entries)):
              print(entry)
          PY

          mapfile -t shell_files <"${shell_file}"
          ((${#shell_files[@]} > 0))

          for file in "${shell_files[@]}"; do
            [[ -f ${file} && ! -L ${file} ]] || {
              printf 'Error: unsafe canonical shell file for candidate sandbox: %s\n' \
                "${file}" >&2
              exit 65
            }
          done

          cp -- "${candidate_dir}/shfmt" "${docker_context}/shfmt"
          # COPY must restore executable access for the non-root container user;
          # the private host copy inherits umask 077 and is readable only by its owner.
          cat >"${docker_context}/Dockerfile" <<'DOCKERFILE'
          FROM scratch
          COPY --chmod=0555 shfmt /shfmt
          ENTRYPOINT ["/shfmt"]
          DOCKERFILE

          docker build \
            --network=none \
            --tag "${image}" \
            "${docker_context}"

          timeout --signal=TERM --kill-after=10s 30s \
            docker run \
              --rm \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=64 \
              --memory=512m \
              --cpus=2 \
              --user "$(id -u):$(id -g)" \
              "${image}" \
              --version

          timeout --signal=TERM --kill-after=10s 2m \
            docker run \
              --name "${container}" \
              --rm \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=64 \
              --memory=512m \
              --cpus=2 \
              --user "$(id -u):$(id -g)" \
              --volume "${GITHUB_WORKSPACE}:/workspace:rw" \
              --volume "${GITHUB_WORKSPACE}/.git:/workspace/.git:ro" \
              --workdir /workspace \
              "${image}" \
              -w -i 4 -ci -bn -- \
              "${shell_files[@]}"

      - name: Build data-only shfmt handoff
        if: steps.detect.outputs.update == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          # The candidate formatter is untrusted. Do not source or execute any
          # project file after it has run. Capture every tracked change and let a
          # fresh read-only verifier enforce the exact allowlist and semantics.
          handoff_dir="${RUNNER_TEMP}/shfmt-update-handoff"
          patch="${handoff_dir}/shfmt-update.patch"
          mkdir -p -- "${handoff_dir}"

          git diff --binary >"${patch}"

          if [[ ! -s ${patch} ]]; then
            printf 'Error: shfmt update produced an empty handoff patch.\n' >&2
            exit 65
          fi

          (
            cd "${handoff_dir}"
            sha256sum shfmt-update.patch >shfmt-update.patch.sha256
          )

      - name: Upload data-only shfmt handoff
        if: steps.detect.outputs.update == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shfmt-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shfmt-update-handoff/shfmt-update.patch
            ${{ runner.temp }}/shfmt-update-handoff/shfmt-update.patch.sha256
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  verify-shfmt-update:
    needs: prepare-shfmt-update
    if: github.ref == 'refs/heads/main' && needs.prepare-shfmt-update.outputs.update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_BASE_SHA: ${{ github.sha }}
      SHFMT_VERSION: ${{ needs.prepare-shfmt-update.outputs.latest }}
      PROJECT_VERSION: ${{ needs.prepare-shfmt-update.outputs.project_version }}
      VERSION_FLOOR: ${{ needs.prepare-shfmt-update.outputs.version_floor }}
      VERSION_DATE: ${{ needs.prepare-shfmt-update.outputs.version_date }}
      EXPECTED_BRANCH_SHA: ${{ needs.prepare-shfmt-update.outputs.previous_branch_sha }}
      REF_CATALOG_SHA: ${{ needs.prepare-shfmt-update.outputs.ref_catalog_sha }}
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verifier dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            aria2 curl desktop-file-utils findutils gnupg procps python3 shellcheck unzip
      - name: Download untrusted candidate handoff
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: shfmt-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shfmt-candidate-handoff
      - name: Verify approved version bump, formatter semantics and upstream provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ ${EXPECTED_BASE_SHA} =~ ^[0-9a-f]{40}$ ]]
          [[ ${SHFMT_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          actual_base=$(git rev-parse HEAD)
          [[ ${actual_base} == "${EXPECTED_BASE_SHA}" ]] || {
            printf 'Error: verifier checkout/base mismatch.\n' >&2
            exit 65
          }

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          current_main=$(git rev-parse refs/remotes/origin/main)
          if [[ ${current_main} != "${EXPECTED_BASE_SHA}" ]]; then
            printf 'Error: main advanced from %s to %s; refusing stale shfmt candidate.\n' \
              "${EXPECTED_BASE_SHA}" "${current_main}" >&2
            exit 75
          fi

          # Resolve the same catalogue independently, before applying candidate data.
          python3 -B scripts/check-push-version.py next-version --remote origin \
            --branch "automation/shfmt-v${SHFMT_VERSION}" \
            >"${RUNNER_TEMP}/shfmt-verifier-version-plan.json"
          python3 - "${RUNNER_TEMP}/shfmt-verifier-version-plan.json" <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import sys

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"main_sha": "EXPECTED_BASE_SHA", "target_sha": "EXPECTED_BRANCH_SHA",
                      "floor_version": "VERSION_FLOOR", "next_version": "PROJECT_VERSION",
                      "refs_sha256": "REF_CATALOG_SHA"}
          if any(plan.get(key) != os.environ[name] for key, name in expected.items()):
              raise SystemExit("Error: the source-version baseline changed before verification.")
          PYCODE
          base_timestamp=$(git show --no-show-signature -s --format=%ct "${EXPECTED_BASE_SHA}")
          [[ ${base_timestamp} =~ ^[0-9]+$ ]]
          [[ $(date -u --date="@${base_timestamp}" +%F) == "${VERSION_DATE}" ]]

          candidate_dir="${RUNNER_TEMP}/shfmt-candidate-handoff"
          patch="${candidate_dir}/shfmt-update.patch"
          patch_digest="${candidate_dir}/shfmt-update.patch.sha256"
          [[ -f ${patch} && ! -L ${patch} ]]
          [[ -f ${patch_digest} && ! -L ${patch_digest} ]]
          mapfile -t candidate_entries < <(
            find "${candidate_dir}" -mindepth 1 -maxdepth 1 -printf '%f\n' |
              LC_ALL=C sort
          )
          expected_candidate_entries=(
            shfmt-update.patch
            shfmt-update.patch.sha256
          )
          [[ ${candidate_entries[*]} == "${expected_candidate_entries[*]}" ]] || {
            printf 'Error: unexpected candidate handoff entries: %s\n' \
              "${candidate_entries[*]}" >&2
            exit 65
          }
          (
            cd "${candidate_dir}"
            sha256sum --check shfmt-update.patch.sha256
          )

          allowed_file=$(mktemp)
          shell_file=$(mktemp)
          patch_paths=$(mktemp)
          unexpected_paths=$(mktemp)
          baseline=$(mktemp)
          after=$(mktemp)
          expected_pin=$(mktemp)
          expected_tree=$(mktemp -d)
          verified_dir="${RUNNER_TEMP}/shfmt-verified-handoff"
          mkdir -p -- "${verified_dir}"
          trap 'rm -f -- "${allowed_file}" "${shell_file}" "${patch_paths}" "${unexpected_paths}" "${baseline}" "${after}" "${expected_pin}"; rm -rf -- "${expected_tree}"' EXIT

          git archive "${EXPECTED_BASE_SHA}" | tar -x --directory "${expected_tree}"
          python3 -B scripts/prepare-source-version.py --root "${expected_tree}" \
            --floor-version "${VERSION_FLOOR}" --date "${VERSION_DATE}" \
            --reason "Update shfmt to v${SHFMT_VERSION}" \
            >"${RUNNER_TEMP}/shfmt-expected-version.json"
          version_documents=(README.md README.fr.md CHANGELOG.md \
            packaging/rpm/yt-dlp-aria2-downloader-gui.spec)

          python3 - tests/lib/project-files.sh >"${shell_file}" <<'PY'
          from pathlib import Path
          import shlex
          import sys

          inventory = Path(sys.argv[1])
          arrays = {
              "PRODUCTION_SHELL_FILES",
              "PACKAGING_SHELL_FILES",
              "TEST_SHELL_FILES",
              "DEVELOPMENT_SHELL_FILES",
          }
          active = None
          seen = set()
          entries = []
          for raw_line in inventory.read_text(encoding="utf-8").splitlines():
              stripped = raw_line.strip()
              if active is None:
                  matched = next(
                      (name for name in arrays if stripped == f"{name}=("),
                      None,
                  )
                  if matched is not None:
                      if matched in seen:
                          raise SystemExit(f"duplicate canonical array: {matched}")
                      seen.add(matched)
                      active = matched
                  continue
              if stripped == ")":
                  active = None
                  continue
              if not stripped or stripped.startswith("#"):
                  continue
              fields = shlex.split(stripped, comments=True, posix=True)
              if len(fields) != 1 or "$" in fields[0]:
                  raise SystemExit(
                      f"unsupported canonical inventory entry: {raw_line}"
                  )
              entries.append(fields[0])
          if active is not None:
              raise SystemExit(f"unterminated canonical array: {active}")
          if seen != arrays:
              missing = ", ".join(sorted(arrays - seen))
              raise SystemExit(f"missing canonical arrays: {missing}")
          if not entries:
              raise SystemExit("canonical shell inventory is empty")
          for entry in sorted(set(entries)):
              print(entry)
          PY

          if grep -Fxq 'tests/lib/project-files.sh' "${shell_file}"; then
            grep -Fxv 'tests/lib/project-files.sh' "${shell_file}" >"${shell_file}.new"
            mv -f -- "${shell_file}.new" "${shell_file}"
          fi
          [[ -s ${shell_file} ]]
          {
            printf '%s\n' scripts/dev-tools/shfmt-pin.env "${version_documents[@]}"
            cat -- "${shell_file}"
          } | LC_ALL=C sort -u >"${allowed_file}"

          trusted_shfmt=$(bash ./scripts/dev-tools/ensure-shfmt.sh)
          [[ -x ${trusted_shfmt} && ! -L ${trusted_shfmt} ]] || {
            printf 'Error: trusted prior shfmt could not be resolved.\n' >&2
            exit 65
          }

          canonical_manifest() {
            local output=$1
            local file
            local digest
            : >"${output}"
            while IFS= read -r file; do
              digest=$(
                "${trusted_shfmt}" -i 4 -ci -bn -- "${canonical_source_root}/${file}" |
                  sha256sum |
                  awk '{ print $1 }'
              )
              [[ ${digest} =~ ^[0-9a-f]{64}$ ]]
              printf '%s  %s\n' "${digest}" "${file}" >>"${output}"
            done <"${shell_file}"
          }
          canonical_source_root=${expected_tree}
          canonical_manifest "${baseline}"

          git apply --check -- "${patch}"
          git apply --numstat -- "${patch}" |
            while IFS=$'\t' read -r added removed path; do
              if [[ ${added} == '-' || ${removed} == '-' ]]; then
                printf 'Error: binary content is forbidden in shfmt candidate: %s\n' \
                  "${path}" >&2
                exit 65
              fi
              printf '%s\n' "${path}"
            done |
            LC_ALL=C sort -u >"${patch_paths}"

          [[ -s ${patch_paths} ]]
          grep -Fxq 'scripts/dev-tools/shfmt-pin.env' "${patch_paths}"
          if grep -Fxq 'tests/lib/project-files.sh' "${patch_paths}"; then
            printf 'Error: shfmt automation may not modify its canonical inventory controller.\n' >&2
            exit 65
          fi
          comm -23 -- "${patch_paths}" "${allowed_file}" >"${unexpected_paths}"
          if [[ -s ${unexpected_paths} ]]; then
            printf 'Error: shfmt candidate contains paths outside the trusted allowlist:\n' >&2
            cat -- "${unexpected_paths}" >&2
            exit 65
          fi

          git apply -- "${patch}"
          git diff --check
          diff_summary=$(git diff --summary)
          if [[ -n ${diff_summary} ]]; then
            printf 'Error: shfmt candidate changes file type/mode or creates, deletes, or renames files:\n%s\n' \
              "${diff_summary}" >&2
            exit 65
          fi

          canonical_source_root=${GITHUB_WORKSPACE}
          for file in "${version_documents[@]}"; do
            if ! cmp -s -- "${expected_tree}/${file}" "${file}"; then
              printf 'Error: candidate changed approved version document content: %s\n' "${file}" >&2
              exit 65
            fi
          done
          canonical_manifest "${after}"
          if ! cmp -s -- "${baseline}" "${after}"; then
            printf 'Error: candidate shfmt changed canonical shell semantics/content under the previously trusted formatter.\n' >&2
            diff -u -- "${baseline}" "${after}" >&2 || true
            exit 65
          fi

          pin_version=$(awk -F= '$1 == "SHFMT_VERSION" { print $2 }' scripts/dev-tools/shfmt-pin.env)
          pin_amd64=$(awk -F= '$1 == "SHFMT_LINUX_AMD64_SHA256" { print $2 }' scripts/dev-tools/shfmt-pin.env)
          pin_arm64=$(awk -F= '$1 == "SHFMT_LINUX_ARM64_SHA256" { print $2 }' scripts/dev-tools/shfmt-pin.env)
          [[ ${pin_version} == "${SHFMT_VERSION}" ]]
          [[ ${pin_amd64} =~ ^[0-9a-f]{64}$ ]]
          [[ ${pin_arm64} =~ ^[0-9a-f]{64}$ ]]

          {
            printf '%s\n'               '# Managed by .github/workflows/shfmt-update.yml.'
            printf '%s\n'               '# Do not change a checksum without changing/reviewing the corresponding asset.'
            printf 'SHFMT_VERSION=%s\n' "${pin_version}"
            printf 'SHFMT_LINUX_AMD64_SHA256=%s\n' "${pin_amd64}"
            printf 'SHFMT_LINUX_ARM64_SHA256=%s\n' "${pin_arm64}"
          } >"${expected_pin}"

          if ! cmp -s -- scripts/dev-tools/shfmt-pin.env "${expected_pin}"; then
            printf '%s\n'               'Error: candidate shfmt pin file differs from the exact data-only schema.' >&2
            exit 65
          fi

          upstream_tag="v${pin_version}"
          tag_ref=$(
            gh api "repos/mvdan/sh/git/ref/tags/${upstream_tag}" \
              --jq '[.object.type,.object.sha] | @tsv'
          )
          IFS=$'\t' read -r tag_object_type tag_object_sha <<<"${tag_ref}"
          [[ ${tag_object_type} == tag && ${tag_object_sha} =~ ^[0-9a-f]{40}$ ]]
          tag_verification=$(
            gh api "repos/mvdan/sh/git/tags/${tag_object_sha}" \
              --jq '[.tag,.object.type,.verification.verified,.verification.reason] | @tsv'
          )
          IFS=$'\t' read -r verified_tag target_type verified reason <<<"${tag_verification}"
          if [[ ${verified_tag} != "${upstream_tag}" ||
              ${target_type} != commit ||
              ${verified} != true ||
              ${reason} != valid ]]; then
            printf 'Error: verifier rejected upstream shfmt tag provenance.\n' >&2
            exit 65
          fi

          for arch in amd64 arm64; do
            asset="shfmt_v${pin_version}_linux_${arch}"
            release_digest=$(
              gh api "repos/mvdan/sh/releases/tags/${upstream_tag}" \
                --jq ".assets[] | select(.name == \"${asset}\") | .digest"
            )
            [[ ${release_digest} =~ ^sha256:([0-9a-f]{64})$ ]] || {
              printf 'Error: verifier could not resolve upstream digest for %s.\n' \
                "${asset}" >&2
              exit 65
            }
            expected_sha=${BASH_REMATCH[1]}
            if [[ ${arch} == amd64 ]]; then
              pinned_sha=${pin_amd64}
            else
              pinned_sha=${pin_arm64}
            fi
            [[ ${pinned_sha} == "${expected_sha}" ]] || {
              printf 'Error: candidate pin does not match GitHub release digest for %s.\n' \
                "${asset}" >&2
              exit 65
            }
          done

          # Validate verified formatter and project without exposing the host
          # checkout, handoff files, runtime token, or network to the candidate.
          docker_context=$(mktemp -d)
          image="shfmt-verifier:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="shfmt-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_verifier_sandbox() {
            docker rm -f --volumes "${container}" >/dev/null 2>&1 || true
            docker image rm -f "${image}" >/dev/null 2>&1 || true
            rm -rf -- "${docker_context}" "${expected_tree}"
            rm -f -- "${allowed_file}" "${shell_file}" "${patch_paths}" \
              "${unexpected_paths}" "${baseline}" "${after}" "${expected_pin}"
          }
          trap cleanup_verifier_sandbox EXIT

          case $(uname -m) in
            x86_64 | amd64) native_arch=amd64; native_sha=${pin_amd64} ;;
            aarch64 | arm64) native_arch=arm64; native_sha=${pin_arm64} ;;
            *) printf 'Error: unsupported verifier architecture.\n' >&2; exit 69 ;;
          esac
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${docker_context}/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${pin_version}/shfmt_v${pin_version}_linux_${native_arch}"
          printf '%s  %s\n' "${native_sha}" "${docker_context}/shfmt" \
            | sha256sum --check
          chmod 0555 -- "${docker_context}/shfmt"
          cat >"${docker_context}/Dockerfile" <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get -o Acquire::Retries=3 update && \
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install \
              --yes --no-install-recommends aria2 bash ca-certificates coreutils \
              curl desktop-file-utils diffutils findutils git gnupg grep jq procps \
              python3 sed shellcheck unzip util-linux && \
              rm -rf /var/lib/apt/lists/*
          ARG SHFMT_VERSION
          COPY --chmod=0555 shfmt /opt/shfmt/v${SHFMT_VERSION}/shfmt
          DOCKERFILE
          docker build --build-arg "SHFMT_VERSION=${pin_version}" \
            --tag "${image}" "${docker_context}"

          # HOME expands inside the isolated shell, never in the host command.
          # shellcheck disable=SC2016
          timeout --signal=TERM --kill-after=10s 8m \
            docker run \
              --name "${container}" \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=1024 \
              --memory=4g \
              --cpus=4 \
              --user "$(id -u):$(id -g)" \
              --tmpfs /tmp:rw,exec,nosuid,nodev,size=2g,mode=1777 \
              --volume /var/tmp \
              --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
              --workdir /workspace \
              --env HOME=/tmp/validation-home \
              --env SHFMT_TOOL_ROOT=/opt/shfmt \
              "${image}" \
              bash -c 'mkdir -m 700 -- "$HOME"; bash ./tests/run-all.sh --jobs 4 --full'
          # Remove the whole container before trusting any resulting status.
          docker rm -f --volumes "${container}" >/dev/null
          canonical_manifest "${after}"
          cmp -s -- "${baseline}" "${after}"
          git diff --binary >"${docker_context}/after.patch"
          cmp -s -- "${patch}" "${docker_context}/after.patch"

          cp -- "${patch}" "${verified_dir}/shfmt-update.patch"
          (
            cd "${verified_dir}"
            sha256sum shfmt-update.patch >shfmt-update.patch.sha256
          )
          mapfile -t verified_shell_files <"${shell_file}"
          sha256sum -- \
            scripts/dev-tools/shfmt-pin.env \
            "${verified_shell_files[@]}" \
            "${version_documents[@]}" \
            >"${verified_dir}/shfmt-tested-tree.sha256"
      - name: Upload verified data-only shfmt handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shfmt-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shfmt-verified-handoff/shfmt-update.patch
            ${{ runner.temp }}/shfmt-verified-handoff/shfmt-update.patch.sha256
            ${{ runner.temp }}/shfmt-verified-handoff/shfmt-tested-tree.sha256
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-shfmt-pr:
    needs:
      - prepare-shfmt-update
      - verify-shfmt-update
    if: github.ref == 'refs/heads/main' && needs.prepare-shfmt-update.outputs.update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_BASE_SHA: ${{ github.sha }}
      SHFMT_VERSION: ${{ needs.prepare-shfmt-update.outputs.latest }}
      PROJECT_VERSION: ${{ needs.prepare-shfmt-update.outputs.project_version }}
      VERSION_FLOOR: ${{ needs.prepare-shfmt-update.outputs.version_floor }}
      VERSION_DATE: ${{ needs.prepare-shfmt-update.outputs.version_date }}
      EXPECTED_BRANCH_SHA: ${{ needs.prepare-shfmt-update.outputs.previous_branch_sha }}
      REF_CATALOG_SHA: ${{ needs.prepare-shfmt-update.outputs.ref_catalog_sha }}
      GIT_NO_REPLACE_OBJECTS: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified data-only shfmt handoff
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: shfmt-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shfmt-update-handoff

      - name: Verify base and apply allowlisted patch
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          [[ ${EXPECTED_BASE_SHA} =~ ^[0-9a-f]{40}$ ]]
          [[ ${SHFMT_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          actual_base=$(git rev-parse HEAD)
          if [[ ${actual_base} != "${EXPECTED_BASE_SHA}" ]]; then
            printf 'Error: checkout SHA %s does not match candidate base %s.\n' \
              "${actual_base}" "${EXPECTED_BASE_SHA}" >&2
            exit 65
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          current_main=$(git rev-parse refs/remotes/origin/main)
          if [[ ${current_main} != "${EXPECTED_BASE_SHA}" ]]; then
            printf 'Error: main advanced from %s to %s; refusing stale shfmt handoff.\n' \
              "${EXPECTED_BASE_SHA}" "${current_main}" >&2
            exit 75
          fi

          if [[ -n $(git status --short) ]]; then
            printf 'Error: privileged checkout is not clean before patch application.\n' >&2
            git status --short >&2
            exit 65
          fi

          handoff_dir="${RUNNER_TEMP}/shfmt-update-handoff"
          patch="${handoff_dir}/shfmt-update.patch"
          digest="${handoff_dir}/shfmt-update.patch.sha256"

          [[ -f ${patch} && ! -L ${patch} ]]
          [[ -f ${digest} && ! -L ${digest} ]]

          mapfile -t handoff_entries < <(
            find "${handoff_dir}" \
              -mindepth 1 \
              -maxdepth 1 \
              -printf '%f\n' |
              LC_ALL=C sort
          )
          expected_entries=(
            shfmt-tested-tree.sha256
            shfmt-update.patch
            shfmt-update.patch.sha256
          )
          if [[ ${handoff_entries[*]} != "${expected_entries[*]}" ]]; then
            printf 'Error: unexpected shfmt handoff entries: %s\n' \
              "${handoff_entries[*]}" >&2
            exit 65
          fi

          (
            cd "${handoff_dir}"
            sha256sum --check shfmt-update.patch.sha256
          )

          allowed_file=$(mktemp)
          patch_paths=$(mktemp)
          changed_paths=$(mktemp)
          unexpected_paths=$(mktemp)
          trap 'rm -f -- "${allowed_file}" "${patch_paths}" "${changed_paths}" "${unexpected_paths}"' EXIT

          {
            printf '%s\n' scripts/dev-tools/shfmt-pin.env \
              README.md README.fr.md CHANGELOG.md \
              packaging/rpm/yt-dlp-aria2-downloader-gui.spec
            python3 -I - tests/lib/project-files.sh <<'PY'
          from pathlib import Path
          import shlex
          import sys

          inventory = Path(sys.argv[1])
          arrays = {
              "PRODUCTION_SHELL_FILES",
              "PACKAGING_SHELL_FILES",
              "TEST_SHELL_FILES",
              "DEVELOPMENT_SHELL_FILES",
          }
          active = None
          seen = set()
          entries = []

          for raw_line in inventory.read_text(encoding="utf-8").splitlines():
              stripped = raw_line.strip()
              if active is None:
                  matched = next(
                      (name for name in arrays if stripped == f"{name}=("),
                      None,
                  )
                  if matched is not None:
                      if matched in seen:
                          raise SystemExit(f"duplicate canonical array: {matched}")
                      seen.add(matched)
                      active = matched
                  continue

              if stripped == ")":
                  active = None
                  continue
              if not stripped or stripped.startswith("#"):
                  continue

              fields = shlex.split(stripped, comments=True, posix=True)
              if len(fields) != 1 or "$" in fields[0]:
                  raise SystemExit(
                      f"unsupported canonical inventory entry: {raw_line}"
                  )
              entries.append(fields[0])

          if active is not None:
              raise SystemExit(f"unterminated canonical array: {active}")
          if seen != arrays:
              missing = ", ".join(sorted(arrays - seen))
              raise SystemExit(f"missing canonical arrays: {missing}")
          if not entries:
              raise SystemExit("canonical shell inventory is empty")

          for entry in entries:
              print(entry)
          PY
          } |
            grep -Fxv 'tests/lib/project-files.sh' |
            LC_ALL=C sort -u >"${allowed_file}"

          git apply --check -- "${patch}"
          git apply --numstat -- "${patch}" |
            while IFS=$'\t' read -r added removed path; do
              if [[ ${added} == '-' || ${removed} == '-' ]]; then
                printf 'Error: binary content is forbidden in shfmt handoff: %s\n' \
                  "${path}" >&2
                exit 65
              fi
              printf '%s\n' "${path}"
            done |
            LC_ALL=C sort -u >"${patch_paths}"

          [[ -s ${patch_paths} ]]
          grep -Fxq 'scripts/dev-tools/shfmt-pin.env' "${patch_paths}"
          comm -23 -- "${patch_paths}" "${allowed_file}" >"${unexpected_paths}"
          if [[ -s ${unexpected_paths} ]]; then
            printf 'Error: shfmt handoff contains paths outside the allowlist:\n' >&2
            cat -- "${unexpected_paths}" >&2
            exit 65
          fi

          git apply -- "${patch}"
          git diff --check

          diff_summary=$(git diff --summary)
          if [[ -n ${diff_summary} ]]; then
            printf 'Error: shfmt handoff changes file type/mode or creates, deletes, or renames files:\n%s\n' \
              "${diff_summary}" >&2
            exit 65
          fi

          git diff --numstat |
            while IFS=$'\t' read -r added removed path; do
              if [[ ${added} == '-' || ${removed} == '-' ]]; then
                printf 'Error: binary working-tree change is forbidden: %s\n' \
                  "${path}" >&2
                exit 65
              fi
            done

          git diff --name-only --no-renames | LC_ALL=C sort -u >"${changed_paths}"
          [[ -s ${changed_paths} ]]
          grep -Fxq 'scripts/dev-tools/shfmt-pin.env' "${changed_paths}"
          comm -23 -- "${changed_paths}" "${allowed_file}" >"${unexpected_paths}"
          if [[ -s ${unexpected_paths} ]]; then
            printf 'Error: applied shfmt handoff changed unexpected paths:\n' >&2
            cat -- "${unexpected_paths}" >&2
            exit 65
          fi

          if grep -Fxq 'tests/lib/project-files.sh' "${changed_paths}"; then
            printf 'Error: verified shfmt handoff unexpectedly changes the canonical inventory controller.\n' >&2
            exit 65
          fi
          # Read only bytes in this privileged job: never import a project helper.
          # The verifier binds shell semantics to the immutable base plus this bump;
          # bind every allowed path to its tested digest and recheck version metadata.
          python3 -I - "${allowed_file}" "${handoff_dir}/shfmt-tested-tree.sha256" <<'PYCODE'
          import datetime
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import sys

          def fail(message):
              raise SystemExit("Error: " + message)

          def version(value):
              if not re.fullmatch(r"[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}", value):
                  fail("invalid project source version")
              return tuple(map(int, value.split(".")))

          def read_file(path):
              if not stat.S_ISREG(path.lstat().st_mode) or path.stat().st_size > 1024 * 1024:
                  fail("non-regular or oversized publication metadata")
              return path.read_text(encoding="utf-8")

          def once(text, old, new):
              if text.count(old) != 1:
                  fail("ambiguous source-version declaration")
              return text.replace(old, new, 1)

          allowed = set(Path(sys.argv[1]).read_text(encoding="utf-8").splitlines())
          manifest = read_file(Path(sys.argv[2])).splitlines()
          seen = set()
          for line in manifest:
              match = re.fullmatch(r"[0-9a-f]{64}  ([A-Za-z0-9_./-]+)", line)
              if not match or match[1] in seen or match[1] not in allowed:
                  fail("invalid or duplicated tested-tree digest entry")
              seen.add(match[1])
              if not stat.S_ISREG(Path(match[1]).lstat().st_mode):
                  fail("tested-tree path is not a regular file")
          if seen != allowed:
              fail("tested-tree manifest does not cover every allowed path")

          if os.environ["EXPECTED_BRANCH_SHA"] != "0" * 40:
              fail("existing shfmt branches must be preserved for maintainer review")
          floor = version(os.environ["VERSION_FLOOR"])
          project_text = os.environ["PROJECT_VERSION"]
          project = version(project_text)
          if project != (floor[0], floor[1], floor[2] + 1):
              fail("project version is not the approved next PATCH")
          base = os.environ["EXPECTED_BASE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              fail("invalid immutable source identity")
          paths = ("download-video.sh", "install-fedora.sh", "test-static.sh", "README.md",
                   "README.fr.md", "CHANGELOG.md", "packaging/rpm/yt-dlp-aria2-downloader-gui.spec")
          originals = {
              path: subprocess.check_output(["git", "show", f"{base}:{path}"]).decode("utf-8")
              for path in paths
          }
          source_pattern = r'(?m)^readonly VERSION=([\x22\x27])([0-9]+\.[0-9]+\.[0-9]+)\1$'
          source_versions = re.findall(source_pattern, originals["download-video.sh"])
          if len(source_versions) != 1:
              fail("ambiguous base version")
          old = source_versions[0][1]
          if version(old) > floor:
              fail("base version exceeds the approved remote floor")
          declarations = {
              "download-video.sh": (source_pattern, project_text),
              "install-fedora.sh": (r"(?m)^readonly APP_VERSION='([0-9]+\.[0-9]+\.[0-9]+)'$", project_text),
              "test-static.sh": (r"(?m)^readonly EXPECTED_VERSION='([0-9]+\.[0-9]+\.[0-9]+)'$", project_text),
          }
          for path, (pattern, expected) in declarations.items():
              values = re.findall(pattern, read_file(Path(path)))
              values = [value[-1] if isinstance(value, tuple) else value for value in values]
              if values != [expected]:
                  fail("candidate source-version declarations disagree")
          timestamp = subprocess.check_output(
              ["git", "show", "--no-show-signature", "-s", "--format=%ct", base], text=True
          ).strip()
          date = datetime.datetime.fromtimestamp(int(timestamp), datetime.timezone.utc).date()
          if date.isoformat() != os.environ["VERSION_DATE"]:
              fail("source-version date differs from the immutable base commit")
          reason = "Update shfmt to v" + os.environ["SHFMT_VERSION"]
          expected_documents = {}
          for path, marker in (("README.md", "development version is **{}**."),
                               ("README.fr.md", "développement actuelle est la **{}**.")):
              text = once(originals[path], marker.format(old), marker.format(project_text))
              for prefix in ("--ref v", "-f tag=v"):
                  text, count = re.subn(re.escape(prefix) + r"[0-9]+\.[0-9]+\.[0-9]+(?=\s|$)",
                                        prefix + project_text, text)
                  if count != 1:
                      fail("ambiguous manual release reference")
              expected_documents[path] = text
          expected_documents["CHANGELOG.md"] = once(
              originals["CHANGELOG.md"], "# Changelog\n\n",
              f"# Changelog\n\n## {project_text} - Unreleased\n\n### Maintenance\n\n- {reason}\n\n",
          )
          weekdays = ("Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun")
          months = ("Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec")
          rpm_date = f"{weekdays[date.weekday()]} {months[date.month - 1]} {date.day:02d} {date.year:04d}"
          rpm_path = paths[-1]
          expected_documents[rpm_path] = once(
              originals[rpm_path], "%changelog\n",
              f"%changelog\n* {rpm_date} OscarFrog <151366285+OscarFrog@users.noreply.github.com> "
              f"- {project_text}-1\n- {reason}\n\n",
          )
          for path, expected in expected_documents.items():
              if read_file(Path(path)) != expected:
                  fail("candidate document differs from the approved version increment: " + path)
          PYCODE
          sha256sum --check "${handoff_dir}/shfmt-tested-tree.sha256"

      - name: Create or update reviewed shfmt branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ ${SHFMT_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          branch="automation/shfmt-v${SHFMT_VERSION}"

          mapfile -t changed_paths < <(git diff --name-only --no-renames)
          if ((${#changed_paths[@]} == 0)); then
            printf 'Error: no validated formatter changes remain for publication.\n' >&2
            exit 65
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "${branch}"
          git add -- "${changed_paths[@]}"

          if git diff --cached --quiet; then
            printf 'Error: validated shfmt changes were not staged.\n' >&2
            exit 65
          fi

          git -c core.hooksPath=/dev/null commit \
            -m "Update shfmt to v${SHFMT_VERSION}"

          gh auth setup-git
          [[ ${EXPECTED_BRANCH_SHA} =~ ^[0-9a-f]{40}$ ]]
          [[ ${REF_CATALOG_SHA} =~ ^[0-9a-f]{64}$ ]]
          # Revalidate the exact main/branch/tag advertisement used for the floor.
          # Refuse stale work instead of leasing a branch value newer than the tests.
          current_catalog=$(mktemp)
          trap 'rm -f -- "${current_catalog}"' EXIT
          git ls-remote --refs origin refs/heads/main "refs/heads/${branch}" 'refs/tags/v*' \
            | LC_ALL=C sort >"${current_catalog}"
          current_digest=$(sha256sum "${current_catalog}")
          current_digest=${current_digest%% *}
          if [[ ${current_digest} != "${REF_CATALOG_SHA}" ]]; then
            printf 'Error: main, tags or the automation branch advanced; rerun the shfmt workflow.\n' >&2
            exit 75
          fi
          lease_sha=${EXPECTED_BRANCH_SHA}
          if [[ ${lease_sha} == 0000000000000000000000000000000000000000 ]]; then
            lease_sha=''
          fi
          git push --set-upstream \
            --force-with-lease="refs/heads/${branch}:${lease_sha}" \
            origin "HEAD:refs/heads/${branch}"

          printf 'Prepared shfmt branch %s at %s.\n' "${branch}" "$(git rev-parse HEAD)"
          {
            printf '%s\n' \
              '### Reviewed shfmt branch ready' \
              '' \
              'The candidate was isolated during formatting and complete validation.' \
              'The verifier required canonical equivalence under the previously trusted shfmt after the approved version bump.'
            printf '\nOpen a maintainer-authenticated pull request from %s to main.\n' "${branch}"
          } >>"${GITHUB_STEP_SUMMARY}"
