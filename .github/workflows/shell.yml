name: Shell validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils shellcheck

      - name: Check Bash syntax
        run: |
          bash -n download-video.sh
          bash -n download-video-gui.sh
          bash -n install-gui.sh
          bash -n test-static.sh
          bash -n tests/mock-integration.sh
          bash -n tests/installer-integration.sh

      - name: Run ShellCheck
        run: |
          shellcheck -o all \
            download-video.sh \
            download-video-gui.sh \
            install-gui.sh
          shellcheck \
            test-static.sh \
            tests/mock-integration.sh \
            tests/installer-integration.sh

      - name: Run local tests
        run: |
          ./test-static.sh
          ./tests/mock-integration.sh
          ./tests/installer-integration.sh
