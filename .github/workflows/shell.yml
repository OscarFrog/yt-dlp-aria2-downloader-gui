name: Shell validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shell-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  identity:
    name: Source identity ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind validation to the event source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ $(git rev-parse HEAD) == "${EXPECTED_SHA}" ]]
          git rev-parse 'HEAD^{tree}'
          python3 -B scripts/check-push-version.py coherence
          source tests/lib/project-files.sh
          for file in "${ALL_SHELL_FILES[@]}"; do
            bash -n -- "${file}"
          done
  validate-ubuntu:
    needs: identity
    name: Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            aria2 coreutils curl desktop-file-utils diffutils findutils git gnupg \
            grep jq procps python3 sed shellcheck unzip util-linux
      - name: Install reviewed workflow linter
        run: |
          set -Eeuo pipefail
          umask 077
          source scripts/dev-tools/actionlint-pin.env
          tool_dir=$(mktemp -d "${RUNNER_TEMP}/actionlint.XXXXXXXX")
          archive=$(mktemp "${RUNNER_TEMP}/actionlint-archive.XXXXXXXX")
          trap 'rm -f -- "${archive}"' EXIT
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${tool_dir}" \
            --no-same-owner --no-same-permissions actionlint
          chmod 0755 -- "${tool_dir}/actionlint"
          printf '%s\n' "${tool_dir}" >>"${GITHUB_PATH}"
      - name: Check workflow syntax and embedded shell
        run: bash ./scripts/check-workflows.sh
      - name: Run validation
        run: |
          set -Eeuo pipefail
          validation_umask=$(umask)
          umask 077
          diagnostic_dir=$(mktemp -d "${RUNNER_TEMP}/validation-diagnostics.XXXXXXXX")
          python3 -I -B scripts/ci-validation-diagnostics.py observe "${diagnostic_dir}" \
            >"${diagnostic_dir}/samples.jsonl" &
          diagnostic_pid=$!
          finish_diagnostics() {
            local validation_status=$1
            local diagnostic_status=0
            trap - EXIT
            umask 077
            : >"${diagnostic_dir}/done" || diagnostic_status=$?
            wait "${diagnostic_pid}" || diagnostic_status=$?
            cat -- "${diagnostic_dir}/samples.jsonl" || diagnostic_status=$?
            printf 'Validation status: %d; diagnostic status: %d\n' \
              "${validation_status}" "${diagnostic_status}" || diagnostic_status=$?
            ((validation_status != 0)) || validation_status=${diagnostic_status}
            exit "${validation_status}"
          }
          trap 'finish_diagnostics "$?"' EXIT
          validation_status=0
          umask "${validation_umask}"
          YTDLP_ARIA2_CI_DIAGNOSTICS_DIR=${diagnostic_dir} \
            timeout --signal=TERM --kill-after=10s 5m bash ./tests/run-all.sh --jobs 4 \
            || validation_status=$?
          finish_diagnostics "${validation_status}"
  validate-python-minimum:
    needs: identity
    name: Python 3.10 / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install validation tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            aria2 build-essential coreutils curl desktop-file-utils diffutils findutils git gnupg \
            grep jq procps sed shellcheck unzip util-linux
      - name: Build and bind verified Bash 4.4 on the disposable runner
        run: |
          set -Eeuo pipefail
          umask 077
          [[ ${GITHUB_ACTIONS} == true && ${RUNNER_ENVIRONMENT} == github-hosted ]]
          readonly version=4.4
          readonly source_sha=d86b3392c1202e8ff5a423b302e6284db7f8f435ea9f39b5b1b20fd3ac36dfcb
          readonly fingerprint=7C0135FB088AAF6C66C650B9BB5869F064EA74AB
          source_dir=$(mktemp -d "${RUNNER_TEMP}/bash-source.XXXXXXXX")
          prefix="${RUNNER_TEMP}/bash-${version}"
          gpg_home=$(mktemp -d "${RUNNER_TEMP}/bash-keyring.XXXXXXXX")
          trap 'rm -rf -- "${gpg_home}"' EXIT
          cd -- "${source_dir}"
          for suffix in tar.gz tar.gz.sig; do
            curl --fail --location --proto '=https' --proto-redir '=https' \
              --tlsv1.2 --connect-timeout 15 --max-time 120 --retry 3 \
              --output "bash-${version}.${suffix}" \
              "https://ftp.gnu.org/gnu/bash/bash-${version}.${suffix}"
          done
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --connect-timeout 15 --max-time 120 --retry 3 \
            --output gnu-keyring.gpg https://ftp.gnu.org/gnu/gnu-keyring.gpg
          printf '%s  %s\n' "${source_sha}" "bash-${version}.tar.gz" | sha256sum --check
          verify_status=$(
            gpgv --homedir "${gpg_home}" --keyring "${source_dir}/gnu-keyring.gpg" \
              --status-fd=1 "bash-${version}.tar.gz.sig" "bash-${version}.tar.gz"
          )
          signature_fingerprint=$(
            awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print toupper($12) }' \
              <<<"${verify_status}"
          )
          [[ ${signature_fingerprint} == "${fingerprint}" ]]
          tar --extract --gzip --file "bash-${version}.tar.gz" \
            --no-same-owner --no-same-permissions
          cd -- "bash-${version}"
          # Use the source's C dialect and pre-GCC-10 tentative-definition model.
          ./configure --prefix="${prefix}" CFLAGS='-O2 -fcommon -std=gnu89'
          timeout --signal=TERM --kill-after=10s 3m make -j2
          make install
          # shellcheck disable=SC2016 # Expand version variables in the new shell.
          "${prefix}/bin/bash" -c 'printf "%s\n" "${BASH_VERSION}"; [[ ${BASH_VERSINFO[0]} == 4 && ${BASH_VERSINFO[1]} == 4 && ${BASH_VERSINFO[2]} == 0 ]]'
          # Bind absolute-path and restricted-PATH fixtures as well as the driver.
          # Never perform this replacement on a personal or self-hosted system.
          sudo ln -sfnT -- "${prefix}/bin/bash" /usr/bin/bash
          printf '%s\n' "${prefix}/bin" >>"${GITHUB_PATH}"
          # shellcheck disable=SC2016 # Expand version variables in the new shell.
          env PATH=/usr/bin:/bin bash -c '[[ ${BASH_VERSINFO[0]} == 4 && ${BASH_VERSINFO[1]} == 4 && ${BASH_VERSINFO[2]} == 0 ]]'
          [[ $(readlink -f /usr/bin/bash) == "${prefix}/bin/bash" ]]
          [[ $(readlink -f /bin/bash) == "${prefix}/bin/bash" ]]
      - name: Bind every test interpreter to the minimum Python
        run: |
          set -Eeuo pipefail
          # Some hermetic fixtures use /usr/bin/python3 or a restricted PATH.
          # Bind those to setup-python only after apt, on this disposable runner.
          python_binary=$(readlink -f "$(command -v python3)")
          "${python_binary}" -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 10)'
          sudo ln -sfnT -- "${python_binary}" /usr/bin/python3
          env PATH=/usr/bin:/bin python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 10)'
          [[ $(readlink -f /usr/bin/python3) == "${python_binary}" ]]
      - name: Confirm minimum Python and environment
        run: |
          python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 10)'
          bash -c 'printf "%s\n" "${BASH_VERSION}"; [[ ${BASH_VERSINFO[0]} == 4 && ${BASH_VERSINFO[1]} == 4 && ${BASH_VERSINFO[2]} == 0 ]]'
          bash ./tests/run-all.sh --doctor
      - name: Exercise the complete contract under Python 3.10
        run: timeout --signal=TERM --kill-after=10s 8m bash ./tests/run-all.sh --full --jobs 4
  validate-fedora:
    needs: identity
    name: Fedora 44
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44
      volumes:
        - /tmp
        - /var/tmp
    env:
      TMPDIR: /var/tmp
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install validation tools
        run: |
          dnf install --assumeyes --no-docs --setopt=install_weak_deps=False \
            aria2 bash coreutils curl desktop-file-utils diffutils findutils git gnupg2 \
            grep jq procps-ng python3 sed ShellCheck unzip util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run validation
        run: timeout --signal=TERM --kill-after=10s 5m bash ./tests/run-all.sh --jobs 4
