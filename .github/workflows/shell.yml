name: Shell validation
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shell-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validate-ubuntu:
    name: Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            aria2 coreutils curl desktop-file-utils diffutils findutils git gnupg \
            grep procps python3 sed shellcheck unzip util-linux
      - name: Run validation
        run: timeout --signal=TERM --kill-after=10s 5m bash ./tests/run-all.sh
  validate-fedora:
    name: Fedora 44
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install validation tools
        run: |
          dnf install --assumeyes --no-docs --setopt=install_weak_deps=False \
            aria2 bash coreutils curl desktop-file-utils diffutils findutils git gnupg2 \
            grep procps-ng python3 sed ShellCheck unzip util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run validation
        run: timeout --signal=TERM --kill-after=10s 5m bash ./tests/run-all.sh
