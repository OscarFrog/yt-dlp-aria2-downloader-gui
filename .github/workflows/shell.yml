name: Shell validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shell-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  identity:
    name: Source identity ${{ github.sha }}
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 3
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust only the checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          [[ ${workspace} == "$(pwd -P)" && ${workspace} != / && ${workspace} != */\* ]]
          git config --global --add safe.directory "${workspace}"
      - name: Bind validation to the event source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ $(git rev-parse HEAD) == "${EXPECTED_SHA}" ]]
          git rev-parse 'HEAD^{tree}'
          python3 -B scripts/check-push-version.py coherence
          source tests/lib/project-files.sh
          for file in "${ALL_SHELL_FILES[@]}"; do
            bash -n -- "${file}"
          done
  validate-nonroot:
    needs: identity
    name: Fedora 45 non-root
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 10
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf --repo=fedora --repo=updates --assumeyes --best distro-sync
          dnf --repo=fedora --repo=updates -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          dnf --repo=fedora --repo=updates -y install cargo clippy gcc rust rustfmt aria2 bash coreutils curl desktop-file-utils diffutils findutils git gnupg2 grep jq procps-ng python3 python3-pip sed ShellCheck unzip util-linux tar gzip which file shadow-utils
          useradd --create-home qualification
          chown -R qualification:qualification -- "${GITHUB_WORKSPACE}"
      - name: Install reviewed workflow linter
        run: |
          set -Eeuo pipefail
          umask 077
          source scripts/dev-tools/actionlint-pin.env
          tool_dir=$(mktemp -d "${RUNNER_TEMP}/actionlint.XXXXXXXX")
          archive=$(mktemp "${RUNNER_TEMP}/actionlint-archive.XXXXXXXX")
          trap 'rm -f -- "${archive}"' EXIT
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${tool_dir}" \
            --no-same-owner --no-same-permissions actionlint
          chmod 0755 -- "${tool_dir}/actionlint"
          printf '%s\n' "${tool_dir}" >>"${GITHUB_PATH}"
      - name: Check workflow syntax and embedded shell
        run: bash ./scripts/check-workflows.sh
      - name: Check Python with reviewed Ruff
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          umask 077
          tool_dir=$(mktemp -d "${RUNNER_TEMP}/ruff.XXXXXXXX")
          trap 'rm -rf -- "${tool_dir}"' EXIT
          python3 -m venv "${tool_dir}"
          PIP_CONFIG_FILE=/dev/null timeout --signal=TERM --kill-after=10s 90s \
            "${tool_dir}/bin/python" -m pip --isolated --disable-pip-version-check \
            install --index-url https://pypi.org/simple --no-cache-dir \
            --timeout 15 --retries 2 --only-binary=:all: --no-deps --require-hashes \
            --requirement scripts/dev-tools/ruff-requirements.txt
          source tests/lib/project-files.sh
          "${tool_dir}/bin/ruff" check --no-cache --config ruff.toml "${PYTHON_FILES[@]}"
      - name: Run validation
        run: |
          runuser -u qualification -- bash -se <<'FEDORA_FULL'
          set -Eeuo pipefail
          validation_umask=$(umask)
          umask 077
          diagnostic_dir=$(mktemp -d "${TMPDIR:-/var/tmp}/validation-diagnostics.XXXXXXXX")
          python3 -I -B scripts/ci-validation-diagnostics.py observe "${diagnostic_dir}" \
            >"${diagnostic_dir}/samples.jsonl" &
          diagnostic_pid=$!
          finish_diagnostics() {
            local validation_status=$1
            local diagnostic_status=0
            trap - EXIT
            umask 077
            : >"${diagnostic_dir}/done" || diagnostic_status=$?
            wait "${diagnostic_pid}" || diagnostic_status=$?
            cat -- "${diagnostic_dir}/samples.jsonl" || diagnostic_status=$?
            printf 'Validation status: %d; diagnostic status: %d\n' \
              "${validation_status}" "${diagnostic_status}" || diagnostic_status=$?
            ((validation_status != 0)) || validation_status=${diagnostic_status}
            exit "${validation_status}"
          }
          trap 'finish_diagnostics "$?"' EXIT
          validation_status=0
          umask "${validation_umask}"
          YTDLP_ARIA2_CI_DIAGNOSTICS_DIR=${diagnostic_dir} \
            timeout --signal=TERM --kill-after=10s 7m bash ./tests/run-all.sh --jobs 4 \
            || validation_status=$?
          finish_diagnostics "${validation_status}"
          FEDORA_FULL
  validate-fedora:
    needs: identity
    name: Fedora 45
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    env:
      TMPDIR: /var/tmp
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
      - name: Install validation tools
        run: |
          dnf --repo=fedora --repo=updates --assumeyes --best distro-sync
          dnf --repo=fedora --repo=updates install --assumeyes --no-docs --setopt=install_weak_deps=False \
            cargo clippy gcc rust rustfmt aria2 bash coreutils curl desktop-file-utils diffutils findutils git gnupg2 \
            grep jq procps-ng python3 sed ShellCheck unzip util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust only the checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          [[ ${workspace} == "$(pwd -P)" && ${workspace} != / && ${workspace} != */\* ]]
          git config --global --add safe.directory "${workspace}"
      - name: Run validation
        run: timeout --signal=TERM --kill-after=10s 7m bash ./tests/run-all.sh --jobs 4
