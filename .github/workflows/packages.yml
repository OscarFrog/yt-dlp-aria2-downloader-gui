name: Package validation
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rpm-build:
    name: Fedora 44 RPM build-once
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install RPM build tools
        run: dnf install --assumeyes cpio desktop-file-utils findutils git gzip rpm-build tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build RPM once
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          version=$(./download-video.sh --version); version=${version##* }
          bash packaging/rpm/build-rpm.sh "${version}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-under-test-${{ github.sha }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: Fedora 44 RPM (${{ matrix.scenario }})
    needs: rpm-build
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, ffmpeg-free]
    steps:
      - name: Install test tools
        run: |
          dnf install --assumeyes cpio desktop-file-utils findutils git gzip rpm-build tar
          if [[ '${{ matrix.scenario }}' == 'ffmpeg-free' ]]; then
            dnf install --assumeyes ffmpeg-free
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: rpm-under-test-${{ github.sha }}
          path: dist
      - name: Install exact shared RPM through supported bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          bash ./install-fedora.sh "${packages[0]}"
      - name: Validate installed environment
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm -q yt-dlp-aria2-downloader-gui ffmpeg aria2 zenity
          ! rpm -q ffmpeg-free
          vendor=$(rpm -q --qf '%{VENDOR}\n' ffmpeg)
          [[ ${vendor} == *'RPM Fusion'* ]]
          ! command -v deno >/dev/null 2>&1
          runtime_manager=/usr/libexec/yt-dlp-aria2-downloader/runtime-manager.sh
          "${runtime_manager}" versions
          /usr/bin/yt-dlp-aria2-downloader --version
      - name: Remove and re-run exact RPM lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf remove --assumeyes yt-dlp-aria2-downloader-gui
          version=$(./download-video.sh --version); version=${version##* }
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          bash packaging/rpm/test-package-lifecycle.sh "${packages[0]}" "${version}"
      - name: Test v2.1.24 -> current RPM upgrade
        if: matrix.scenario == 'fresh'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          old_root=$(mktemp -d); old_tree="${old_root}/tree"; old_dist="${old_root}/dist"; mkdir -p -- "${old_dist}"
          trap 'git worktree remove --force "${old_tree}" >/dev/null 2>&1 || true; rm -rf -- "${old_root}"' EXIT
          git worktree add --detach "${old_tree}" v2.1.24
          git config --global --add safe.directory "${old_tree}"
          bash "${old_tree}/packaging/rpm/build-rpm.sh" 2.1.24 "${old_dist}"
          shopt -s nullglob; old=("${old_dist}"/*.rpm); current=(dist/*.rpm); shopt -u nullglob
          ((${#old[@]} == 1 && ${#current[@]} == 1))
          version=$(./download-video.sh --version); version=${version##* }
          bash packaging/rpm/test-package-upgrade.sh "${old[0]}" "${current[0]}" 2.1.24 "${version}"

  deb:
    name: Ubuntu 24.04 DEB
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install DEB build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes desktop-file-utils
      - name: Build, lifecycle, reinstall, and upgrade DEB
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(./download-video.sh --version); version=${version##* }
          bash packaging/deb/build-deb.sh "${version}" dist
          shopt -s nullglob; packages=(dist/*.deb); shopt -u nullglob
          ((${#packages[@]} == 1))
          sudo bash packaging/deb/test-package-lifecycle.sh "${packages[0]}" "${version}"
          old_root=$(mktemp -d); old_tree="${old_root}/tree"; old_dist="${old_root}/dist"; mkdir -p -- "${old_dist}"
          trap 'git worktree remove --force "${old_tree}" >/dev/null 2>&1 || true; rm -rf -- "${old_root}"' EXIT
          git worktree add --detach "${old_tree}" v2.1.24
          bash "${old_tree}/packaging/deb/build-deb.sh" 2.1.24 "${old_dist}"
          shopt -s nullglob; old=("${old_dist}"/*.deb); shopt -u nullglob
          ((${#old[@]} == 1))
          sudo bash packaging/deb/test-package-upgrade.sh "${old[0]}" "${packages[0]}" 2.1.24 "${version}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ github.sha }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
