name: Package validation
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 20
    steps:
      - name: Prepare Debian 13 with backports
        run: |
          printf '%s\n' 'deb http://deb.debian.org/debian trixie-backports main' \
            > /etc/apt/sources.list.d/trixie-backports.list
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install --yes \
            bash ca-certificates coreutils desktop-file-utils dpkg-dev findutils \
            git grep sed util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build DEB
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          version=$(./download-video.sh --version); version=${version##* }
          bash packaging/deb/build-deb.sh "${version}" dist
      - name: Install and remove DEB
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(./download-video.sh --version); version=${version##* }
          shopt -s nullglob; packages=(dist/*.deb); shopt -u nullglob
          ((${#packages[@]} == 1))
          bash packaging/deb/test-package-lifecycle.sh "${packages[0]}" "${version}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ github.sha }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
  rpm:
    name: Fedora 44 RPM
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install RPM build tools and repositories
        run: |
          dnf install --assumeyes cpio desktop-file-utils findutils git gzip rpm-build tar
          dnf install --assumeyes \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build RPM
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          version=$(./download-video.sh --version); version=${version##* }
          bash packaging/rpm/build-rpm.sh "${version}" dist
      - name: Install and remove RPM
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(./download-video.sh --version); version=${version##* }
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          bash packaging/rpm/test-package-lifecycle.sh "${packages[0]}" "${version}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-${{ github.sha }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7
