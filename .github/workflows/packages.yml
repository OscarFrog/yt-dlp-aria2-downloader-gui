name: Package validation
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  previous-release:
    name: Previous immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
      version: ${{ steps.previous.outputs.version }}
      commit: ${{ steps.previous.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve previous semantic-version release
        id: previous
        shell: bash
        run: |
          set -Eeuo pipefail

          current_version=$(./download-video.sh --version)
          current_version=${current_version##* }

          if [[ ! ${current_version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Error: invalid current project version: %s\n' \
              "${current_version}" >&2
            exit 65
          fi

          current_tag="v${current_version}"
          found_current=false
          previous_tag=''

          while IFS= read -r candidate; do
            [[ ${candidate} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

            if [[ ${found_current} == false ]]; then
              if [[ ${candidate} == "${current_tag}" ]]; then
                found_current=true
              fi
              continue
            fi

            previous_tag=${candidate}
            break
          done < <(
            {
              git tag --list 'v[0-9]*.[0-9]*.[0-9]*'
              printf '%s\n' "${current_tag}"
            } | LC_ALL=C sort -Vr -u
          )

          if [[ ${found_current} != true ]]; then
            printf 'Error: current project version was not found in semantic ordering: %s\n' \
              "${current_tag}" >&2
            exit 65
          fi

          if [[ ! ${previous_tag} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Error: unable to resolve the release preceding %s.\n' \
              "${current_tag}" >&2
            exit 65
          fi

          previous_commit=$(git rev-parse "${previous_tag}^{commit}")
          current_commit=$(git rev-parse HEAD)

          if [[ ! ${previous_commit} =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Error: invalid previous release commit: %s\n' \
              "${previous_commit}" >&2
            exit 65
          fi

          if ! git merge-base --is-ancestor \
              "${previous_commit}" \
              "${current_commit}"; then
            printf 'Error: previous release %s is not an ancestor of PR commit %s.\n' \
              "${previous_tag}" "${current_commit}" >&2
            exit 65
          fi

          printf 'Previous release: %s\n' "${previous_tag}"
          printf 'Previous commit: %s\n' "${previous_commit}"

          {
            printf 'tag=%s\n' "${previous_tag}"
            printf 'version=%s\n' "${previous_tag#v}"
            printf 'commit=%s\n' "${previous_commit}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify exact published previous packages
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p previous

          immutable=$(
            gh release view "${PREVIOUS_TAG}" \
              -R "${GITHUB_REPOSITORY}" \
              --json isImmutable \
              --jq '.isImmutable'
          )

          if [[ ${immutable} != true ]]; then
            printf 'Error: previous release is not immutable: %s\n' \
              "${PREVIOUS_TAG}" >&2
            exit 65
          fi

          gh release verify "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}"

          gh release download "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --dir previous \
            --pattern '*.rpm'

          gh release download "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --dir previous \
            --pattern '*.deb'

          gh release download "${PREVIOUS_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --dir previous \
            --pattern 'SHA256SUMS'

          shopt -s nullglob
          rpms=(previous/*.rpm)
          debs=(previous/*.deb)
          shopt -u nullglob

          if ((${#rpms[@]} != 1 || ${#debs[@]} != 1)); then
            printf 'Error: expected exactly one previous RPM and one previous DEB; found %d/%d.\n' \
              "${#rpms[@]}" "${#debs[@]}" >&2
            exit 65
          fi

          grep -Fq "  ${rpms[0]##*/}" previous/SHA256SUMS
          grep -Fq "  ${debs[0]##*/}" previous/SHA256SUMS

          (
            cd previous
            sha256sum --ignore-missing --check SHA256SUMS
          )

          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/release.yml"

          for asset in \
            "${rpms[0]}" \
            "${debs[0]}" \
            previous/SHA256SUMS; do

            gh release verify-asset \
              "${PREVIOUS_TAG}" \
              "${asset}" \
              -R "${GITHUB_REPOSITORY}"

            gh attestation verify \
              "${asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${PREVIOUS_COMMIT}"
          done

          (
            cd previous
            sha256sum -- *.rpm *.deb > PREVIOUS_SHA256SUMS
            sha256sum --check PREVIOUS_SHA256SUMS
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previous-release-packages-${{ github.sha }}
          path: |
            previous/*.rpm
            previous/*.deb
            previous/PREVIOUS_SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  rpm-build:
    name: Fedora 44 RPM build-once
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install RPM build tools
        run: dnf install --assumeyes cpio desktop-file-utils findutils gawk git gnupg2 gzip python3 rpm-build rpm-sign tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build RPM once
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          version=$(./download-video.sh --version); version=${version##* }
          bash packaging/rpm/build-rpm.sh "${version}" dist
      - name: Qualify RPM v4/v6 signature semantics (3x)
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(dist/*.rpm)
          shopt -u nullglob
          ((${#packages[@]} == 1))

          for iteration in {1..3}; do
            printf '=== RPM v4/v6 qualification iteration %d/3 ===\n' "${iteration}"
            timeout --signal=TERM --kill-after=10s 4m \
              bash ./tests/rpm6-multisig-integration.sh "${packages[0]}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-under-test-${{ github.sha }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: Fedora 44 RPM (${{ matrix.scenario }})
    needs:
      - rpm-build
      - previous-release
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 35
    env:
      PACKAGE_TEST_HOME: /root
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, ffmpeg-free]
    steps:
      - name: Install test tools
        run: |
          dnf install --assumeyes cpio desktop-file-utils findutils git gnupg2 gzip rpm-build rpm-sign tar
          if [[ '${{ matrix.scenario }}' == 'ffmpeg-free' ]]; then
            dnf install --assumeyes ffmpeg-free
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: rpm-under-test-${{ github.sha }}
          path: dist

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: previous-release-packages-${{ github.sha }}
          path: previous
      - name: Reject a different globally trusted RPM signer in PR CI
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          shopt -s nullglob
          packages=(dist/*.rpm)
          shopt -u nullglob
          ((${#packages[@]} == 1))

          wrong_home=$(mktemp -d)
          wrong_public=$(mktemp)
          wrong_rpm=$(mktemp --suffix=.rpm)
          wrong_passphrase=$(mktemp)
          wrong_verify_keyring="${wrong_home}/rpm-keyring"
          log=$(mktemp)

          cleanup_wrong_signer() {
            rm -rf -- "${wrong_home}" || true
            rm -f --               "${wrong_public}"               "${wrong_rpm}"               "${wrong_passphrase}"               "${log}" || true
          }
          trap cleanup_wrong_signer EXIT
          chmod 700 "${wrong_home}"
          chmod 600 "${wrong_passphrase}"
          mkdir -p -- "${wrong_verify_keyring}"
          chmod 700 "${wrong_verify_keyring}"

          gpg \
            --homedir "${wrong_home}" \
            --batch \
            --pinentry-mode loopback \
            --passphrase '' \
            --quick-generate-key \
            'yt-dlp-aria2 wrong-signer PR CI <wrong-signer@example.invalid>' \
            rsa2048 sign 1d

          wrong_fingerprint=$(
            gpg \
              --homedir "${wrong_home}" \
              --batch \
              --with-colons \
              --list-secret-keys \
              --fingerprint |
              awk -F: \
                '$1 == "fpr" && !found {
                   value=toupper($10); found=1
                 }
                 END { if (found) print value }'
          )

          [[ ${wrong_fingerprint} =~ ^[0-9A-F]{40}$ ]]

          gpg \
            --homedir "${wrong_home}" \
            --batch \
            --armor \
            --export "${wrong_fingerprint}" >"${wrong_public}"

          # Deliberately trust the wrong key globally. The production bootstrap
          # must still reject the RPM because authorization is bound to the pinned
          # OscarFrog certificate and its unique signing subkey in an isolated fs keyring.
          rpmkeys --import "${wrong_public}"

          cp -- "${packages[0]}" "${wrong_rpm}"

          GPG_TTY=/dev/null rpmsign \
            --addsign \
            --key-id "${wrong_fingerprint}" \
            --define "_openpgp_sign gpg" \
            --define "_gpg_path ${wrong_home}" \
            --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file ${wrong_passphrase}" \
            "${wrong_rpm}"

          wrong_state=$(
            LC_ALL=C rpm -qp --qf '%|OPENPGP?{signed}:{unsigned}|\n' \
              -- "${wrong_rpm}"
          )
          [[ ${wrong_state} == signed ]]

          # Prove the adversarial RPM is valid for the attacker before
          # requiring the production bootstrap to reject it.
          rpmkeys \
            --define "_keyring fs" \
            --define "_keyringpath ${wrong_verify_keyring}" \
            --define "_keyring_lockpath ${wrong_verify_keyring}/.keyring.lock" \
            --define "_rpmlock_path ${wrong_verify_keyring}/.rpm.lock" \
            --import "${wrong_public}"
          rpmkeys \
            --define "_keyring fs" \
            --define "_keyringpath ${wrong_verify_keyring}" \
            --define "_keyring_lockpath ${wrong_verify_keyring}/.keyring.lock" \
            --define "_rpmlock_path ${wrong_verify_keyring}/.rpm.lock" \
            --checksig "${wrong_rpm}"

          set +e
          HOME="${PACKAGE_TEST_HOME}" \
            bash ./install-fedora.sh "${wrong_rpm}" >"${log}" 2>&1
          status=$?
          set -e

          [[ ${status} -eq 65 ]]
          grep -Fq 'RPM OpenPGP signature verification failed against the isolated pinned certificate.' "${log}"

      - name: Confirm unsigned PR RPM is rejected by release bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          state=$(LC_ALL=C rpm -qp --qf '%|OPENPGP?{signed}:{unsigned}|\n' -- "${packages[0]}")
          [[ ${state} == unsigned ]]

          log=$(mktemp)
          trap 'rm -f -- "${log}"' EXIT
          set +e
          HOME="${PACKAGE_TEST_HOME}" bash ./install-fedora.sh "${packages[0]}" >"${log}" 2>&1
          status=$?
          set -e
          [[ ${status} -eq 65 ]]
          grep -Fq 'RPM has no OpenPGP signature' "${log}"

      - name: Install exact unsigned PR RPM through explicit development bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          HOME="${PACKAGE_TEST_HOME}" bash ./install-fedora.sh             --allow-unsigned-dev             "${packages[0]}"
      - name: Validate installed environment
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm -q yt-dlp-aria2-downloader-gui ffmpeg aria2 zenity
          if rpm -q ffmpeg-free >/dev/null 2>&1; then
            printf '%s\n' 'Error: ffmpeg-free must not remain installed after bootstrap.' >&2
            exit 65
          fi
          vendor=$(rpm -q --qf '%{VENDOR}\n' ffmpeg)
          [[ ${vendor} == *'RPM Fusion'* ]]
          if command -v deno >/dev/null 2>&1; then
            printf '%s\n' 'Error: Deno must not be provided by the system PATH.' >&2
            exit 65
          fi
          runtime_manager=/usr/libexec/yt-dlp-aria2-downloader/runtime-manager.sh
          HOME="${PACKAGE_TEST_HOME}" "${runtime_manager}" versions
          /usr/bin/yt-dlp-aria2-downloader --version
      - name: Remove and re-run exact RPM lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf remove --assumeyes yt-dlp-aria2-downloader-gui

          runtime_root="${PACKAGE_TEST_HOME}/.local/share/yt-dlp-aria2-downloader/runtime"
          if [[ -e ${runtime_root} || -L ${runtime_root} ]]; then
            printf 'Error: supported Fedora bootstrap runtime survived final RPM removal: %s\n' \
              "${runtime_root}" >&2
            exit 65
          fi

          version=$(./download-video.sh --version); version=${version##* }
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          bash packaging/rpm/test-package-lifecycle.sh "${packages[0]}" "${version}"
      - name: Test previous immutable release -> current RPM upgrade
        if: matrix.scenario == 'fresh'
        env:
          PREVIOUS_VERSION: ${{ needs.previous-release.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          shopt -s nullglob
          old=(previous/*.rpm)
          current=(dist/*.rpm)
          shopt -u nullglob

          if ((${#old[@]} != 1 || ${#current[@]} != 1)); then
            printf 'Error: expected one previous RPM and one current RPM; found %d/%d.\n' \
              "${#old[@]}" "${#current[@]}" >&2
            exit 65
          fi

          (
            cd previous
            sha256sum --check PREVIOUS_SHA256SUMS
          )

          version=$(./download-video.sh --version)
          version=${version##* }

          HOME="${PACKAGE_TEST_HOME}" bash packaging/rpm/test-package-upgrade.sh \
            "${old[0]}" \
            "${current[0]}" \
            "${PREVIOUS_VERSION}" \
            "${version}"

  deb:
    name: Ubuntu 24.04 DEB
    needs: previous-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: previous-release-packages-${{ github.sha }}
          path: ${{ runner.temp }}/previous-release

      - name: Install DEB build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes desktop-file-utils
      - name: Build, lifecycle, reinstall, and upgrade DEB
        env:
          PREVIOUS_VERSION: ${{ needs.previous-release.outputs.version }}
          PREVIOUS_DIR: ${{ runner.temp }}/previous-release
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(./download-video.sh --version); version=${version##* }
          bash packaging/deb/build-deb.sh "${version}" dist
          shopt -s nullglob; packages=(dist/*.deb); shopt -u nullglob
          ((${#packages[@]} == 1))
          sudo bash packaging/deb/test-package-lifecycle.sh "${packages[0]}" "${version}"
          shopt -s nullglob
          old=("${PREVIOUS_DIR}"/*.deb)
          shopt -u nullglob

          if ((${#old[@]} != 1)); then
            printf 'Error: expected exactly one previous DEB; found %d.\n' \
              "${#old[@]}" >&2
            exit 65
          fi

          (
            cd "${PREVIOUS_DIR}"
            sha256sum --check PREVIOUS_SHA256SUMS
          )

          sudo bash packaging/deb/test-package-upgrade.sh \
            "${old[0]}" \
            "${packages[0]}" \
            "${PREVIOUS_VERSION}" \
            "${version}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ github.sha }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
