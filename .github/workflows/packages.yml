name: Package validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install DEB build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes \
            desktop-file-utils dpkg-dev

      - name: Build and inspect DEB
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(./download-video.sh --version)
          version=${version##* }
          bash packaging/deb/build-deb.sh "${version}" dist

      - name: Retain DEB build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ github.sha }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: Fedora 44 RPM
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Install RPM build tools
        run: |
          dnf install --assumeyes \
            cpio desktop-file-utils findutils git gzip rpm-build tar

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and inspect RPM
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(./download-video.sh --version)
          version=${version##* }
          bash packaging/rpm/build-rpm.sh "${version}" dist

      - name: Retain RPM build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-${{ github.sha }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7
