name: Package validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity:
    name: Source identity ${{ github.sha }}
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 3
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust only the checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          [[ ${workspace} == "$(pwd -P)" && ${workspace} != / && ${workspace} != */\* ]]
          git config --global --add safe.directory "${workspace}"
      - name: Bind validation to the event source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(git rev-parse HEAD) == "${EXPECTED_SHA}" ]]
          git rev-parse 'HEAD^{tree}'
          python3 -B scripts/check-push-version.py coherence
          source tests/lib/project-files.sh
          for file in "${ALL_SHELL_FILES[@]}"; do
            bash -n -- "${file}"
          done
  source-archive:
    needs: identity
    name: Fedora 45 Git-free source archive
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 10
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf --repo=fedora --repo=updates --assumeyes --best distro-sync
          dnf --repo=fedora --repo=updates -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust only the checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          [[ ${workspace} == "$(pwd -P)" && ${workspace} != / && ${workspace} != */\* ]]
          git config --global --add safe.directory "${workspace}"
      - name: Install archive validation tools
        run: |
          dnf --repo=fedora --repo=updates -y install cargo clippy gcc rust rustfmt aria2 bash coreutils curl desktop-file-utils diffutils findutils git gnupg2 grep jq procps-ng python3 python3-pip sed ShellCheck unzip util-linux tar gzip which file
      - name: Build and retest Git-free source archive
        shell: bash
        run: |
          set -Eeuo pipefail

          version_output=$(./download-video.sh --version)
          if [[ ${version_output} =~ ^download-video\.sh[[:space:]]version[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version=${BASH_REMATCH[1]}
          else
            printf 'Error: unexpected download-video.sh --version output: %q\n' \
              "${version_output}" >&2
            exit 65
          fi
          package="yt-dlp-aria2-downloader-gui-${version}"
          scratch=$(mktemp -d)
          trap 'rm -rf -- "${scratch}"' EXIT

          git archive \
            --format=zip \
            --prefix="${package}/" \
            --output="${scratch}/${package}.zip" \
            HEAD

          unzip -t "${scratch}/${package}.zip"
          unzip -q "${scratch}/${package}.zip" -d "${scratch}/extract"

          [[ ! -e ${scratch}/extract/${package}/.git ]]

          (
            cd "${scratch}/extract/${package}"
            bash ./tests/run-all.sh --jobs 4
          )

  previous-release:
    needs: identity
    name: Previous immutable release
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
      version: ${{ steps.previous.outputs.version }}
      commit: ${{ steps.previous.outputs.commit }}
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install git python3 gh jq gnupg2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust only the checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          [[ ${workspace} == "$(pwd -P)" && ${workspace} != / && ${workspace} != */\* ]]
          git config --global --add safe.directory "${workspace}"

      - name: Resolve previous semantic-version release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          version_output=$(./download-video.sh --version)
          if [[ ${version_output} =~ ^download-video\.sh[[:space:]]version[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            current_version=${BASH_REMATCH[1]}
          else
            printf 'Error: unexpected download-video.sh --version output: %q\n' \
              "${version_output}" >&2
            exit 65
          fi

          current_tag="v${current_version}"
          # Ordinary development may retain a published source version. Select
          # a strictly older immutable release for the real upgrade tests;
          # only release.yml may publish objects under a signed version tag.
          found_current=false
          previous_tag=''
          published_release_tags=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --paginate \
              --jq '.[] | select(.draft == false and .prerelease == false and .published_at != null) | .tag_name'
          )

          while IFS= read -r candidate; do
            [[ ${candidate} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

            if [[ ${found_current} == false ]]; then
              if [[ ${candidate} == "${current_tag}" ]]; then
                found_current=true
              fi
              continue
            fi

            previous_tag=${candidate}
            break
          done < <(
            {
              printf '%s\n' "${current_tag}"
              printf '%s\n' "${published_release_tags}"
            } | LC_ALL=C sort -Vr -u
          )

          if [[ ! ${previous_tag} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Error: unable to resolve the release preceding %s.\n' \
              "${current_tag}" >&2
            exit 65
          fi

          previous_commit=$(git rev-parse "${previous_tag}^{commit}")
          current_commit=$(git rev-parse HEAD)

          if [[ ! ${previous_commit} =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Error: invalid previous release commit: %s\n' \
              "${previous_commit}" >&2
            exit 65
          fi

          if ! git merge-base --is-ancestor \
              "${previous_commit}" \
              "${current_commit}"; then
            printf 'Error: previous release %s is not an ancestor of PR commit %s.\n' \
              "${previous_tag}" "${current_commit}" >&2
            exit 65
          fi

          printf 'Previous release: %s\n' "${previous_tag}"
          printf 'Previous commit: %s\n' "${previous_commit}"

          {
            printf 'tag=%s\n' "${previous_tag}"
            printf 'version=%s\n' "${previous_tag#v}"
            printf 'commit=%s\n' "${previous_commit}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify exact published previous packages
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
        shell: bash
        run: |
          bash scripts/verify-previous-packages.sh "${PREVIOUS_TAG}" "${PREVIOUS_COMMIT}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous-release-packages-${{ github.sha }}
          path: |
            previous/*.rpm
            previous/PREVIOUS_SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  rpm-build:
    needs: identity
    name: Fedora 45 RPM build-once
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
    timeout-minutes: 20
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
      - name: Install RPM build tools
        run: |
          dnf --repo=fedora --repo=updates --assumeyes --best distro-sync
          dnf --repo=fedora --repo=updates install --assumeyes cpio desktop-file-utils findutils gawk git gnupg2 gzip python3 rpm-build rpm-sign tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust only the checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          [[ ${workspace} == "$(pwd -P)" && ${workspace} != / && ${workspace} != */\* ]]
          git config --global --add safe.directory "${workspace}"
      - name: Build RPM once
        shell: bash
        run: |
          set -Eeuo pipefail
          version_output=$(./download-video.sh --version)
          if [[ ${version_output} =~ ^download-video\.sh[[:space:]]version[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version=${BASH_REMATCH[1]}
          else
            printf 'Error: unexpected download-video.sh --version output: %q\n' \
              "${version_output}" >&2
            exit 65
          fi
          bash packaging/rpm/build-rpm.sh "${version}" dist
      - name: Qualify RPM v4/v6 signature semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(dist/*.rpm)
          shopt -u nullglob
          ((${#packages[@]} == 1))

          timeout --signal=TERM --kill-after=10s 4m \
            bash ./tests/rpm6-multisig-integration.sh "${packages[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-under-test-${{ github.sha }}-${{ github.run_id }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  rpm:
    name: Fedora 45 RPM (${{ matrix.scenario }})
    needs:
      - rpm-build
      - previous-release
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 35
    env:
      TMPDIR: /var/tmp
      PACKAGE_TEST_HOME: /root
    strategy:
      fail-fast: true
      matrix:
        scenario: [fresh, ffmpeg-free]
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
      - name: Install test tools
        env:
          PACKAGE_SCENARIO: ${{ matrix.scenario }}
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf --repo=fedora --repo=updates --assumeyes --best distro-sync
          dnf --repo=fedora --repo=updates install --assumeyes cpio desktop-file-utils findutils git gnupg2 gzip rpm-build rpm-sign tar
          if [[ ${PACKAGE_SCENARIO} == ffmpeg-free ]]; then
            dnf --repo=fedora --repo=updates install --assumeyes ffmpeg-free
            dnf repoquery --installed --queryformat '%{full_nevra} %{from_repo}\n' ffmpeg-free
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm-under-test-${{ github.sha }}-${{ github.run_id }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous-release-packages-${{ github.sha }}
          path: previous
      - name: Reject a different globally trusted RPM signer in PR CI
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          shopt -s nullglob
          packages=(dist/*.rpm)
          shopt -u nullglob
          ((${#packages[@]} == 1))

          wrong_home=$(mktemp -d)
          wrong_public=$(mktemp)
          wrong_rpm=$(mktemp --suffix=.rpm)
          wrong_passphrase=$(mktemp)
          wrong_verify_keyring="${wrong_home}/rpm-keyring"
          wrong_fingerprint=''
          log=$(mktemp)

          cleanup_wrong_signer() {
            if [[ -n ${wrong_fingerprint} ]]; then
              rpmkeys --erase "${wrong_fingerprint}" >/dev/null 2>&1 || true
            fi
            rm -rf -- "${wrong_home}" || true
            rm -f --               "${wrong_public}"               "${wrong_rpm}"               "${wrong_passphrase}"               "${log}" || true
          }
          trap cleanup_wrong_signer EXIT
          chmod 700 "${wrong_home}"
          chmod 600 "${wrong_passphrase}"
          mkdir -p -- "${wrong_verify_keyring}"
          chmod 700 "${wrong_verify_keyring}"

          gpg \
            --homedir "${wrong_home}" \
            --batch \
            --pinentry-mode loopback \
            --passphrase '' \
            --quick-generate-key \
            'yt-dlp-aria2 wrong-signer PR CI <wrong-signer@example.invalid>' \
            rsa2048 sign 1d

          wrong_fingerprint=$(
            gpg \
              --homedir "${wrong_home}" \
              --batch \
              --with-colons \
              --list-secret-keys \
              --fingerprint |
              awk -F: \
                '$1 == "fpr" && !found {
                   value=toupper($10); found=1
                 }
                 END { if (found) print value }'
          )

          [[ ${wrong_fingerprint} =~ ^[0-9A-F]{40}$ ]]

          gpg \
            --homedir "${wrong_home}" \
            --batch \
            --armor \
            --export "${wrong_fingerprint}" >"${wrong_public}"

          # Deliberately trust the wrong key globally. The production bootstrap
          # must still reject the RPM because authorization is bound to the pinned
          # OscarFrog certificate and its unique signing subkey in an isolated fs keyring.
          rpmkeys --import "${wrong_public}"

          cp -- "${packages[0]}" "${wrong_rpm}"

          GPG_TTY=/dev/null rpmsign \
            --addsign \
            --key-id "${wrong_fingerprint}" \
            --define "_openpgp_sign gpg" \
            --define "_gpg_path ${wrong_home}" \
            --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file ${wrong_passphrase}" \
            "${wrong_rpm}"

          wrong_state=$(
            LC_ALL=C rpm -qp --qf '%|OPENPGP?{signed}:{unsigned}|\n' \
              -- "${wrong_rpm}"
          )
          [[ ${wrong_state} == signed ]]

          # Prove the adversarial RPM is valid for the attacker before
          # requiring the production bootstrap to reject it.
          rpmkeys \
            --define "_keyring fs" \
            --define "_keyringpath ${wrong_verify_keyring}" \
            --define "_keyring_lockpath ${wrong_verify_keyring}/.keyring.lock" \
            --define "_rpmlock_path ${wrong_verify_keyring}/.rpm.lock" \
            --import "${wrong_public}"
          rpmkeys \
            --define "_keyring fs" \
            --define "_keyringpath ${wrong_verify_keyring}" \
            --define "_keyring_lockpath ${wrong_verify_keyring}/.keyring.lock" \
            --define "_rpmlock_path ${wrong_verify_keyring}/.rpm.lock" \
            --checksig "${wrong_rpm}"

          set +e
          HOME="${PACKAGE_TEST_HOME}" \
            bash ./install-fedora.sh "${wrong_rpm}" >"${log}" 2>&1
          status=$?
          set -e

          [[ ${status} -eq 65 ]]
          grep -Fq 'RPM OpenPGP signature verification failed against the isolated pinned certificate.' "${log}"

          rpmkeys --erase "${wrong_fingerprint}"
          wrong_fingerprint=''

      - name: Confirm unsigned PR RPM is rejected by release bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          state=$(LC_ALL=C rpm -qp --qf '%|OPENPGP?{signed}:{unsigned}|\n' -- "${packages[0]}")
          [[ ${state} == unsigned ]]

          log=$(mktemp)
          trap 'rm -f -- "${log}"' EXIT
          set +e
          HOME="${PACKAGE_TEST_HOME}" bash ./install-fedora.sh "${packages[0]}" >"${log}" 2>&1
          status=$?
          set -e
          [[ ${status} -eq 65 ]]
          grep -Fq 'RPM has no OpenPGP signature' "${log}"

      - name: Install exact unsigned PR RPM through explicit development bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          HOME="${PACKAGE_TEST_HOME}" bash ./install-fedora.sh             --allow-unsigned-dev             "${packages[0]}"
      - name: Validate installed environment
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm -q yt-dlp-aria2-downloader-gui ffmpeg aria2 zenity
          if rpm -q ffmpeg-free >/dev/null 2>&1; then
            printf '%s\n' 'Error: ffmpeg-free must not remain installed after bootstrap.' >&2
            exit 65
          fi
          vendor=$(rpm -q --qf '%{VENDOR}\n' ffmpeg)
          [[ ${vendor} == *'RPM Fusion'* ]]
          if command -v deno >/dev/null 2>&1; then
            printf '%s\n' 'Error: Deno must not be provided by the system PATH.' >&2
            exit 65
          fi
          runtime_manager=/usr/libexec/yt-dlp-aria2-downloader/runtime-manager.sh
          HOME="${PACKAGE_TEST_HOME}" "${runtime_manager}" versions
          /usr/bin/yt-dlp-aria2-downloader --version
      - name: Remove and re-run exact RPM lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          dnf remove --assumeyes yt-dlp-aria2-downloader-gui

          runtime_root="${PACKAGE_TEST_HOME}/.local/share/yt-dlp-aria2-downloader/runtime"
          if [[ -e ${runtime_root} || -L ${runtime_root} ]]; then
            printf 'Error: supported Fedora bootstrap runtime survived final RPM removal: %s\n' \
              "${runtime_root}" >&2
            exit 65
          fi

          version_output=$(./download-video.sh --version)
          if [[ ${version_output} =~ ^download-video\.sh[[:space:]]version[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version=${BASH_REMATCH[1]}
          else
            printf 'Error: unexpected download-video.sh --version output: %q\n' \
              "${version_output}" >&2
            exit 65
          fi
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          bash packaging/rpm/test-package-lifecycle.sh --allow-unsigned-dev "${packages[0]}" "${version}"
      - name: Test previous immutable release -> current RPM upgrade
        if: matrix.scenario == 'fresh'
        env:
          PREVIOUS_VERSION: ${{ needs.previous-release.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          shopt -s nullglob
          old=(previous/*.rpm)
          current=(dist/*.rpm)
          shopt -u nullglob

          if ((${#old[@]} != 1 || ${#current[@]} != 1)); then
            printf 'Error: expected one previous RPM and one current RPM; found %d/%d.\n' \
              "${#old[@]}" "${#current[@]}" >&2
            exit 65
          fi

          (
            cd previous
            sha256sum --check PREVIOUS_SHA256SUMS
          )

          version_output=$(./download-video.sh --version)
          if [[ ${version_output} =~ ^download-video\.sh[[:space:]]version[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version=${BASH_REMATCH[1]}
          else
            printf 'Error: unexpected download-video.sh --version output: %q\n' \
              "${version_output}" >&2
            exit 65
          fi

          HOME="${PACKAGE_TEST_HOME}" bash packaging/rpm/test-package-upgrade.sh --allow-unsigned-dev \
            "${old[0]}" \
            "${current[0]}" \
            "${PREVIOUS_VERSION}" \
            "${version}"
