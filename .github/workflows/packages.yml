name: Package validation
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rpm:
    name: Fedora 44 RPM
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install RPM build tools and repositories
        run: |
          dnf install --assumeyes cpio desktop-file-utils findutils git gzip rpm-build tar
          dnf install --assumeyes \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build RPM
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          version=$(./download-video.sh --version); version=${version##* }
          bash packaging/rpm/build-rpm.sh "${version}" dist
      - name: Install and remove RPM
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(./download-video.sh --version); version=${version##* }
          shopt -s nullglob; packages=(dist/*.rpm); shopt -u nullglob
          ((${#packages[@]} == 1))
          bash packaging/rpm/test-package-lifecycle.sh "${packages[0]}" "${version}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-${{ github.sha }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7
