name: Extended qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  identity:
    name: Source identity ${{ github.sha }}
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 3
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust only the checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          [[ ${workspace} == "$(pwd -P)" && ${workspace} != / && ${workspace} != */\* ]]
          git config --global --add safe.directory "${workspace}"
      - name: Bind validation to the event source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ $(git rev-parse HEAD) == "${EXPECTED_SHA}" ]]
          git rev-parse 'HEAD^{tree}'
          python3 -B scripts/check-push-version.py coherence
          source tests/lib/project-files.sh
          for file in "${ALL_SHELL_FILES[@]}"; do
            bash -n -- "${file}"
          done
  ffmpeg-fedora-9:
    needs: identity
    name: FFmpeg 9.0.2 / Fedora 45
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    env:
      TMPDIR: /var/tmp
    timeout-minutes: 35
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Fedora bootstrap tools and authenticated RPM Fusion
        run: bash ./scripts/ci-fedora-media.sh
      - name: Install pinned yt-dlp
        run: |
          python3 -m venv "${RUNNER_TEMP}/yt-dlp-venv"
          printf '%s\n' \
            'yt-dlp==2026.8.19 --hash=sha256:1d57897e94c6665a0a6f9bc54b34e584284e32c034ffab3a7df25d8f7b24eedf' \
            >"${RUNNER_TEMP}/yt-dlp-requirements.txt"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" install \
            --disable-pip-version-check --only-binary=:all: --require-hashes \
            --requirement "${RUNNER_TEMP}/yt-dlp-requirements.txt"
          echo "${RUNNER_TEMP}/yt-dlp-venv/bin" >>"${GITHUB_PATH}"
      - name: Qualify FFmpeg 9.0.2 generation
        env:
          EXPECTED_YTDLP_VERSION: 2026.08.19
          EXPECTED_FFMPEG_VERSION: 9.0.2
        run: |
          timeout --signal=TERM --kill-after=10s 25m \
            bash ./tests/ffmpeg-generation-qualification.sh

  ffmpeg-upstream:
    needs: identity
    strategy:
      matrix:
        version: ['6.1.1', '8.1.3', '9.0.1']
    name: FFmpeg ${{ matrix.version }} / verified upstream source
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 50
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          bash ./scripts/ci-fedora-media.sh
          dnf -y install gcc make lame-devel opus-devel libvpx-devel x264-devel nasm pkgconf-pkg-config xz
      - name: Download, verify and build FFmpeg ${{ matrix.version }}
        env:
          FFMPEG_VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          readonly version=${FFMPEG_VERSION}
          readonly fingerprint=FCF986EA15E6E293A5644F10B4322F04D67658D8
          source_dir="${RUNNER_TEMP}/ffmpeg-source"
          prefix="${RUNNER_TEMP}/ffmpeg-${version}"
          gpg_home=$(mktemp -d)
          key_file=$(mktemp)
          trap 'rm -rf -- "${gpg_home}"; rm -f -- "${key_file}"' EXIT
          chmod 700 -- "${gpg_home}"

          mkdir -p -- "${source_dir}"
          cd -- "${source_dir}"

          curl --fail --location --retry 3 --retry-all-errors \
            --output "ffmpeg-${version}.tar.xz" \
            "https://ffmpeg.org/releases/ffmpeg-${version}.tar.xz"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "ffmpeg-${version}.tar.xz.asc" \
            "https://ffmpeg.org/releases/ffmpeg-${version}.tar.xz.asc"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${key_file}" \
            'https://ffmpeg.org/ffmpeg-devel.asc'

          gpg --homedir "${gpg_home}" --batch --no-options --import "${key_file}"
          imported_primary_fingerprints=$(
            gpg --homedir "${gpg_home}" --batch --no-options \
              --with-colons --list-keys |
              awk -F: '
                $1 == "pub" { want_fpr=1; next }
                want_fpr && $1 == "fpr" {
                  print toupper($10)
                  want_fpr=0
                }
              '
          )
          [[ ${imported_primary_fingerprints} == "${fingerprint}" ]]

          verify_status=$(
            gpg --homedir "${gpg_home}" --batch --no-options \
              --status-fd=1 \
              --verify "ffmpeg-${version}.tar.xz.asc" "ffmpeg-${version}.tar.xz"
          )
          signature_primary_fingerprint=$(
            awk '
              $1 == "[GNUPG:]" && $2 == "VALIDSIG" {
                if (NF < 12 || $12 == "") {
                  exit 65
                }
                print toupper($12)
                exit
              }
            ' <<<"${verify_status}"
          )
          if [[ ${signature_primary_fingerprint} != "${fingerprint}" ]]; then
            printf 'Error: FFmpeg source signature primary fingerprint mismatch: %s\n' \
              "${signature_primary_fingerprint:-<missing>}" >&2
            exit 65
          fi

          tar -xf "ffmpeg-${version}.tar.xz"
          cd -- "ffmpeg-${version}"
          ./configure \
            --prefix="${prefix}" \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --enable-gpl \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvpx \
            --enable-libx264
          make -j"$(nproc)"
          make install

          echo "${prefix}/bin" >>"${GITHUB_PATH}"
      - name: Install pinned yt-dlp
        run: |
          python3 -m venv "${RUNNER_TEMP}/yt-dlp-venv"
          printf '%s\n' \
            'yt-dlp==2026.8.19 --hash=sha256:1d57897e94c6665a0a6f9bc54b34e584284e32c034ffab3a7df25d8f7b24eedf' \
            >"${RUNNER_TEMP}/yt-dlp-requirements.txt"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" install \
            --disable-pip-version-check --only-binary=:all: --require-hashes \
            --requirement "${RUNNER_TEMP}/yt-dlp-requirements.txt"
          echo "${RUNNER_TEMP}/yt-dlp-venv/bin" >>"${GITHUB_PATH}"
      - name: Qualify FFmpeg ${{ matrix.version }} generation
        env:
          EXPECTED_YTDLP_VERSION: 2026.08.19
          EXPECTED_FFMPEG_VERSION: ${{ matrix.version }}
        run: |
          timeout --signal=TERM --kill-after=10s 25m \
            bash ./tests/ffmpeg-generation-qualification.sh
