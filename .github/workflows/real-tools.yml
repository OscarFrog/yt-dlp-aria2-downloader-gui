name: Real tool integration
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: real-tools-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  pinned-local-media:
    if: github.event_name != 'schedule'
    name: Local media, pinned yt-dlp ${{ matrix.yt_dlp_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        yt_dlp_version: ['2026.6.9', '2026.7.4', '2026.8.19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install real engines
        env:
          YT_DLP_VERSION: ${{ matrix.yt_dlp_version }}
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            aria2 ffmpeg python3-venv

          case ${YT_DLP_VERSION} in
            2026.6.9)
              yt_dlp_sha=442ba4c75724b9496144c8434b617962ee08d0ee7c26ec663848fe9b78d5a3e4
              ;;
            2026.7.4)
              yt_dlp_sha=f11f2b11d5a8ac4059f9bdf29fa4407dc7c6bb00c5097e95ca22a7a9db518266
              ;;
            2026.8.19)
              yt_dlp_sha=1d57897e94c6665a0a6f9bc54b34e584284e32c034ffab3a7df25d8f7b24eedf
              ;;
            *)
              printf 'Error: no approved yt-dlp wheel digest for %s.\n' \
                "${YT_DLP_VERSION}" >&2
              exit 65
              ;;
          esac

          requirements="${RUNNER_TEMP}/yt-dlp-requirements.txt"
          printf 'yt-dlp==%s --hash=sha256:%s\n' \
            "${YT_DLP_VERSION}" "${yt_dlp_sha}" >"${requirements}"

          python3 -m venv "${RUNNER_TEMP}/yt-dlp-venv"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement "${requirements}"
          echo "${RUNNER_TEMP}/yt-dlp-venv/bin" >>"${GITHUB_PATH}"
      - name: Record resolved tool versions
        run: |
          set -Eeuo pipefail
          printf 'yt-dlp: %s\n' "$(yt-dlp --version)"
          aria2c --version | awk 'NR == 1 { first = $0 } END { print first }'
          ffmpeg -hide_banner -version | awk 'NR == 1 { first = $0 } END { print first }'
          ffprobe -hide_banner -version | awk 'NR == 1 { first = $0 } END { print first }'
      - name: Run direct, audio, HLS and DASH boundary qualification (3x)
        shell: bash
        run: |
          bash ./tests/repeat-qualification.sh \
            --label 'real-tool routing iteration' --runs 3 --jobs 3 -- \
            timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/real-tools-integration.sh
      - name: Run aria2 direct-transfer behavior qualification
        env:
          ARIA2_BEHAVIOR_BASIC_RUNS: 3
          ARIA2_BEHAVIOR_CANCEL_RESTART_RUNS: 10
        run: |
          timeout --signal=TERM --kill-after=10s 12m \
            bash ./tests/aria2-real-behavior-integration.sh
      - name: Run real FFmpeg progress qualification
        run: |
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/ffmpeg-real-progress-integration.sh
      - name: Run HLS post-remux duration validation (3x)
        shell: bash
        run: |
          bash ./tests/repeat-qualification.sh \
            --label 'HLS duration guard iteration' --runs 3 --jobs 3 -- \
            timeout --signal=TERM --kill-after=10s 5m \
            bash ./tests/hls-remux-duration-integration.sh

  current-stable-local-media:
    if: github.event_name == 'schedule'
    name: Scheduled current stable yt-dlp
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install real engines and current yt-dlp stable
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            aria2 ffmpeg python3-venv
          python3 -m venv "${RUNNER_TEMP}/yt-dlp-venv"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --upgrade yt-dlp
          echo "${RUNNER_TEMP}/yt-dlp-venv/bin" >>"${GITHUB_PATH}"
      - name: Record resolved current-stable tool versions
        run: |
          set -Eeuo pipefail
          printf 'yt-dlp: %s\n' "$(yt-dlp --version)"
          aria2c --version | awk 'NR == 1 { first = $0 } END { print first }'
          ffmpeg -hide_banner -version | awk 'NR == 1 { first = $0 } END { print first }'
          ffprobe -hide_banner -version | awk 'NR == 1 { first = $0 } END { print first }'
      - name: Run current-stable routing qualification (3x)
        shell: bash
        run: |
          bash ./tests/repeat-qualification.sh \
            --label 'current stable routing iteration' --runs 3 --jobs 3 -- \
            timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/real-tools-integration.sh
      - name: Run current-stable aria2 direct-transfer behavior qualification
        env:
          ARIA2_BEHAVIOR_BASIC_RUNS: 3
          ARIA2_BEHAVIOR_CANCEL_RESTART_RUNS: 10
        run: |
          timeout --signal=TERM --kill-after=10s 12m \
            bash ./tests/aria2-real-behavior-integration.sh
      - name: Run current-stable real FFmpeg progress qualification
        run: |
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/ffmpeg-real-progress-integration.sh
      - name: Run current-stable HLS duration validation (3x)
        shell: bash
        run: |
          bash ./tests/repeat-qualification.sh \
            --label 'current stable HLS guard iteration' --runs 3 --jobs 3 -- \
            timeout --signal=TERM --kill-after=10s 5m \
            bash ./tests/hls-remux-duration-integration.sh
