name: Real tool integration
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: real-tools-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  identity:
    name: Source identity ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind validation to the event source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(git rev-parse HEAD) == "${EXPECTED_SHA}" ]]
          git rev-parse 'HEAD^{tree}'
          python3 -B scripts/check-push-version.py coherence
          source tests/lib/project-files.sh
          for file in "${ALL_SHELL_FILES[@]}"; do
            bash -n -- "${file}"
          done
  pinned-local-media:
    needs: identity
    if: github.event_name != 'schedule'
    name: Local media, pinned yt-dlp ${{ matrix.yt_dlp_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        yt_dlp_version: ['2026.6.9', '2026.7.4', '2026.8.19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install real engines
        env:
          YT_DLP_VERSION: ${{ matrix.yt_dlp_version }}
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            aria2 curl ffmpeg python3-venv unzip

          case ${YT_DLP_VERSION} in
            2026.6.9)
              yt_dlp_sha=442ba4c75724b9496144c8434b617962ee08d0ee7c26ec663848fe9b78d5a3e4
              ;;
            2026.7.4)
              yt_dlp_sha=f11f2b11d5a8ac4059f9bdf29fa4407dc7c6bb00c5097e95ca22a7a9db518266
              ;;
            2026.8.19)
              yt_dlp_sha=1d57897e94c6665a0a6f9bc54b34e584284e32c034ffab3a7df25d8f7b24eedf
              ;;
            *)
              printf 'Error: no approved yt-dlp wheel digest for %s.\n' \
                "${YT_DLP_VERSION}" >&2
              exit 65
              ;;
          esac

          requirements="${RUNNER_TEMP}/yt-dlp-requirements.txt"
          printf 'yt-dlp==%s --hash=sha256:%s\n' \
            "${YT_DLP_VERSION}" "${yt_dlp_sha}" >"${requirements}"

          python3 -m venv "${RUNNER_TEMP}/yt-dlp-venv"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement "${requirements}"
          echo "${RUNNER_TEMP}/yt-dlp-venv/bin" >>"${GITHUB_PATH}"
      - name: Install verified Deno for shared-destination qualification
        if: matrix.yt_dlp_version == '2026.8.19'
        run: |
          set -Eeuo pipefail
          umask 077
          readonly version=2.9.4
          # Digest from the immutable upstream release and its official checksum.
          readonly archive_sha=c24f955d9fbfe0ea5ae2b501c8e71ae76e31e4c9782390a54a284b3364fda725
          tool_dir=$(mktemp -d "${RUNNER_TEMP}/deno.XXXXXXXX")
          archive=$(mktemp "${RUNNER_TEMP}/deno-archive.XXXXXXXX")
          trap 'rm -f -- "${archive}"' EXIT
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${archive}" \
            "https://github.com/denoland/deno/releases/download/v${version}/deno-x86_64-unknown-linux-gnu.zip"
          printf '%s  %s\n' "${archive_sha}" "${archive}" | sha256sum --check
          [[ $(unzip -Z1 "${archive}") == deno ]]
          unzip -q "${archive}" deno -d "${tool_dir}"
          chmod 0755 -- "${tool_dir}/deno"
          resolved=$("${tool_dir}/deno" --version | awk 'NR == 1 { version = $2 } END { print version }')
          [[ ${resolved} == "${version}" ]]
          "${tool_dir}/deno" --version
          printf '%s\n' "${tool_dir}" >>"${GITHUB_PATH}"
      - name: Record resolved tool versions
        env:
          EXPECTED_FFMPEG_VERSION: 6.1.1
        run: |
          set -Eeuo pipefail
          printf 'yt-dlp: %s\n' "$(yt-dlp --version)"
          aria2c --version | awk 'NR == 1 { first = $0 } END { print first }'
          for tool in ffmpeg ffprobe; do
            resolved=$("${tool}" -hide_banner -version | awk 'NR == 1 { version = $3 } END { print version }')
            printf '%s: %s\n' "${tool}" "${resolved}"
            case ${resolved} in
              "${EXPECTED_FFMPEG_VERSION}" | "${EXPECTED_FFMPEG_VERSION}"-* | "${EXPECTED_FFMPEG_VERSION}"+* | "${EXPECTED_FFMPEG_VERSION}"~*) ;;
              *)
                printf 'Error: %s does not match expected generation %s.\n' \
                  "${tool}" "${EXPECTED_FFMPEG_VERSION}" >&2
                exit 65
                ;;
            esac
          done
      - name: Run direct, audio, HLS and DASH boundary qualification
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/real-tools-integration.sh
      - name: Run aria2 direct-transfer behavior qualification
        env:
          ARIA2_BEHAVIOR_BASIC_RUNS: 3
          ARIA2_BEHAVIOR_CANCEL_RESTART_RUNS: 10
        run: |
          timeout --signal=TERM --kill-after=10s 12m \
            bash ./tests/aria2-real-behavior-integration.sh
      - name: Run real FFmpeg progress qualification
        if: matrix.yt_dlp_version == '2026.8.19'
        run: |
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/ffmpeg-real-progress-integration.sh
      - name: Run HLS post-remux duration validation
        if: matrix.yt_dlp_version == '2026.8.19'
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 5m \
            bash ./tests/hls-remux-duration-integration.sh
      - name: Install pinned impersonation dependencies for shared qualification
        if: matrix.yt_dlp_version == '2026.8.19'
        run: |
          set -Eeuo pipefail
          umask 077
          # Versions from the verified yt-dlp wheel's pin-curl-cffi extra;
          # wheel digests from the corresponding public PyPI release metadata.
          requirements="${RUNNER_TEMP}/yt-dlp-impersonation-requirements.txt"
          cat >"${requirements}" <<'EOF_REQUIREMENTS'
          certifi==2026.7.22 --hash=sha256:62f22742b58a1a33014a2b6b706588a8d7e2a88ae7bd1a6ebe8c992928483775
          cffi==2.1.1 --hash=sha256:c1453022f490d2459a11819d83ad1d586e9ff65a12ac3e705ffebd46d3685dcf
          curl-cffi==0.16.0 --hash=sha256:182416f07d71a342240554fa62c22e591999b78c225b21d3fe27d9f807420dd6
          pycparser==3.0 --hash=sha256:b727414169a36b7d524c1c3e31839a521725078d7b2ff038656844266160a992
          EOF_REQUIREMENTS
          "${RUNNER_TEMP}/yt-dlp-venv/bin/python" -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" --isolated install \
            --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            --require-hashes \
            --requirement "${requirements}"
      - name: Run real shared-destination GUI and CLI qualification
        if: matrix.yt_dlp_version == '2026.8.19'
        env:
          TMPDIR: ${{ runner.temp }}/shared-destination-evidence
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p -- "${TMPDIR}"
          # All instances share the fixture's HOME/XDG; select only this job's
          # verified executable, never a pre-existing personal runtime.
          export YTDLP_REAL_BINARY="${RUNNER_TEMP}/yt-dlp-venv/bin/yt-dlp"
          [[ $("${YTDLP_REAL_BINARY}" --ignore-config --no-plugin-dirs --version) == 2026.08.19 ]]
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/repeat-qualification.sh --runs 1 --jobs 1 \
              --label 'Shared-destination real tools' -- \
              python3 -B ./tests/multi-instance-real.py \
            2>&1 | tee "${TMPDIR}/qualification.log"
      - name: Retain shared-destination verdicts and monotonic events
        if: ${{ always() && matrix.yt_dlp_version == '2026.8.19' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-destination-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/shared-destination-evidence/qualification.log
            ${{ runner.temp }}/shared-destination-evidence/shared-destination-real-*/*.log
            ${{ runner.temp }}/shared-destination-evidence/shared-destination-real-*/events.json
            ${{ runner.temp }}/shared-destination-evidence/shared-destination-real-*/*.before-rescue.json
            ${{ runner.temp }}/shared-destination-evidence/shared-destination-real-*/*.final-before-rescue.json

  current-stable-local-media:
    needs: identity
    if: github.event_name == 'schedule'
    name: Scheduled current stable yt-dlp
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install real engines and current yt-dlp stable
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            aria2 ffmpeg python3-venv
          python3 -m venv "${RUNNER_TEMP}/yt-dlp-venv"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --upgrade yt-dlp
          echo "${RUNNER_TEMP}/yt-dlp-venv/bin" >>"${GITHUB_PATH}"
      - name: Record resolved current-stable tool versions
        run: |
          set -Eeuo pipefail
          printf 'yt-dlp: %s\n' "$(yt-dlp --version)"
          aria2c --version | awk 'NR == 1 { first = $0 } END { print first }'
          ffmpeg -hide_banner -version | awk 'NR == 1 { first = $0 } END { print first }'
          ffprobe -hide_banner -version | awk 'NR == 1 { first = $0 } END { print first }'
      - name: Run current-stable routing qualification
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/real-tools-integration.sh
      - name: Run current-stable aria2 direct-transfer behavior qualification
        env:
          ARIA2_BEHAVIOR_BASIC_RUNS: 3
          ARIA2_BEHAVIOR_CANCEL_RESTART_RUNS: 10
        run: |
          timeout --signal=TERM --kill-after=10s 12m \
            bash ./tests/aria2-real-behavior-integration.sh
      - name: Run current-stable real FFmpeg progress qualification
        run: |
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/ffmpeg-real-progress-integration.sh
      - name: Run current-stable HLS duration validation
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 5m \
            bash ./tests/hls-remux-duration-integration.sh
