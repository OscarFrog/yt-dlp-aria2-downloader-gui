name: Real tool integration
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: real-tools-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  identity:
    name: Source identity ${{ github.sha }}
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    timeout-minutes: 3
    steps:
      - name: Verify Fedora 45 userspace
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust only the checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          [[ ${workspace} == "$(pwd -P)" && ${workspace} != / && ${workspace} != */\* ]]
          git config --global --add safe.directory "${workspace}"
      - name: Bind validation to the event source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(git rev-parse HEAD) == "${EXPECTED_SHA}" ]]
          git rev-parse 'HEAD^{tree}'
          python3 -B scripts/check-push-version.py coherence
          source tests/lib/project-files.sh
          for file in "${ALL_SHELL_FILES[@]}"; do
            bash -n -- "${file}"
          done
  pinned-local-media:
    needs: identity
    if: github.event_name != 'schedule'
    name: Fedora 45 shared destination (pinned yt-dlp)
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    # Include every test deadline, provisioning and diagnostic retention.
    timeout-minutes: 65
    steps:
      - name: Verify Fedora 45 userspace
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Install real engines
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=10s 6m bash ./scripts/ci-fedora-media.sh
          python3 -m venv "${RUNNER_TEMP}/yt-dlp-venv"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" --isolated install \
            --disable-pip-version-check --index-url https://pypi.org/simple \
            --only-binary=:all: --require-hashes \
            --requirement scripts/dev-tools/yt-dlp-requirements.txt
          cat scripts/dev-tools/yt-dlp-requirements.txt
          "${RUNNER_TEMP}/yt-dlp-venv/bin/yt-dlp" --version
          echo "${RUNNER_TEMP}/yt-dlp-venv/bin" >>"${GITHUB_PATH}"
      - name: Install verified Deno for shared-destination qualification
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          umask 077
          readonly version=2.9.8
          # Digest from the immutable upstream release and its official checksum.
          readonly archive_sha=e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609
          tool_dir=$(mktemp -d "${RUNNER_TEMP}/deno.XXXXXXXX")
          archive=$(mktemp "${RUNNER_TEMP}/deno-archive.XXXXXXXX")
          trap 'rm -f -- "${archive}"' EXIT
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${archive}" \
            "https://github.com/denoland/deno/releases/download/v${version}/deno-x86_64-unknown-linux-gnu.zip"
          printf '%s  %s\n' "${archive_sha}" "${archive}" | sha256sum --check
          [[ $(unzip -Z1 "${archive}") == deno ]]
          unzip -q "${archive}" deno -d "${tool_dir}"
          chmod 0755 -- "${tool_dir}/deno"
          resolved=$("${tool_dir}/deno" --version | awk 'NR == 1 { version = $2 } END { print version }')
          [[ ${resolved} == "${version}" ]]
          "${tool_dir}/deno" --version
          printf '%s\n' "${tool_dir}" >>"${GITHUB_PATH}"
      - name: Run aria2 direct-transfer behavior qualification
        env:
          ARIA2_BEHAVIOR_BASIC_RUNS: 3
          ARIA2_BEHAVIOR_CANCEL_RESTART_RUNS: 10
        run: |
          timeout --signal=TERM --kill-after=10s 12m \
            bash ./tests/aria2-real-behavior-integration.sh
      - name: Install pinned impersonation dependencies for shared qualification
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          umask 077
          # Versions from the verified yt-dlp wheel's pin-curl-cffi extra;
          # wheel digests from the corresponding public PyPI release metadata.
          requirements="${RUNNER_TEMP}/yt-dlp-impersonation-requirements.txt"
          cat >"${requirements}" <<'EOF_REQUIREMENTS'
          certifi==2026.10.23 --hash=sha256:e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1
          cffi==2.1.1 --hash=sha256:aeae0e330c9f6acd681f647d46cefd30c29f93e3392882e792e82080c9691399
          curl-cffi==0.17.0 --hash=sha256:2dac9c915a0ee7d7cc4285203d210816bb187c8deb5c20ee21e0613639c2a8bf
          pycparser==3.12 --hash=sha256:a076f3f489b39b43ed13563a1dafe42447445bec2e294154ec5c57fcdda4c85e
          EOF_REQUIREMENTS
          sed -n 's/^yt-dlp==/yt-dlp[pin-curl-cffi]==/p' scripts/dev-tools/yt-dlp-requirements.txt >>"${requirements}"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/python" -c 'import sys; assert sys.version_info[:2] == (3, 15)'
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" --isolated install \
            --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            --require-hashes \
            --requirement "${requirements}"
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" --isolated check
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" --isolated list --format=freeze
      - name: Run real shared-destination GUI and CLI qualification
        id: shared_run
        run: |
          set -Eeuo pipefail
          umask 077
          export TMPDIR="${RUNNER_TEMP:?}/shared-destination-evidence"
          mkdir -p -- "${TMPDIR}"
          # All instances share the fixture's HOME/XDG; select only this job's
          # verified executable, never a pre-existing personal runtime.
          export YTDLP_REAL_BINARY="${RUNNER_TEMP}/yt-dlp-venv/bin/yt-dlp"
          [[ $("${YTDLP_REAL_BINARY}" --ignore-config --no-plugin-dirs --version) == 2026.11.23 ]]
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/repeat-qualification.sh --runs 1 --jobs 1 \
              --label 'Shared-destination real tools' -- \
              python3 -B ./tests/multi-instance-real.py \
            2>&1 | tee "${TMPDIR}/qualification.log"
      - name: Validate and stage shared-destination evidence
        id: evidence
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          SHARED_OUTCOME: ${{ steps.shared_run.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          umask 077
          options=()
          if [[ ${SHARED_OUTCOME} != success ]]; then
            [[ ${JOB_STATUS} == failure || ${JOB_STATUS} == cancelled ]] || exit 65
            options+=(--partial)
          fi
          python3 -IB tests/multi-instance-real.py --stage-evidence \
            "${RUNNER_TEMP:?}/shared-destination-evidence" shared-destination-public "${options[@]}"
      - name: Retain shared-destination verdicts and monotonic events
        timeout-minutes: 1
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-destination-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            shared-destination-public/qualification.log
            shared-destination-public/shared-destination-real-*/*.log
            shared-destination-public/shared-destination-real-*/events.json
            shared-destination-public/shared-destination-real-*/qualification-errors.json
            shared-destination-public/shared-destination-real-*/*.before-rescue.json
            shared-destination-public/shared-destination-real-*/*.final-before-rescue.json

  current-stable-local-media:
    needs: identity
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Scheduled current stable yt-dlp
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:89fe812033e4b10bb8b05bd573fce914e7a11c2337772ede441c9382f874717b
      volumes:
        - /tmp
        - /var/tmp
    # Include every test deadline, provisioning and diagnostic retention.
    timeout-minutes: 65
    steps:
      - name: Verify Fedora 45 userspace
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source /etc/os-release
          [[ ${ID} == fedora && ${VERSION_ID} == 45 ]]
          kernel_arch=$(uname -m)
          rpm_arch=$(rpm --eval '%{_arch}')
          printf 'Userspace %s; shared host kernel %s; kernel arch %s; RPM arch %s\n' \
            "${PRETTY_NAME}" "$(uname -r)" "${kernel_arch}" "${rpm_arch}"
          [[ ${kernel_arch} == x86_64 && ${rpm_arch} == x86_64 ]]
          dnf -y --setopt=install_weak_deps=False install git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Install real engines and current yt-dlp stable
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          umask 077
          # Bound stalled connections and the complete package transaction;
          # provisioning must leave the independently bounded media tests time.
          timeout --signal=TERM --kill-after=10s 6m bash ./scripts/ci-fedora-media.sh
          python3 -m venv "${RUNNER_TEMP}/yt-dlp-venv"
          mkdir -p -- "${RUNNER_TEMP}/shared-destination-evidence"
          # Select the published stable before resolving extras. Otherwise pip
          # may backtrack to an older yt-dlp when a new dependency is unavailable.
          package_version=$("${RUNNER_TEMP}/yt-dlp-venv/bin/python" - \
            "${RUNNER_TEMP}/shared-destination-evidence/stable-resolution.json" <<'PY_STABLE_VERSION'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          import re
          import sys
          import urllib.request

          source = 'https://pypi.org/pypi/yt-dlp/json'
          limit = 8 * 1024 * 1024

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError('PyPI metadata redirects are not permitted.')

          with urllib.request.build_opener(NoRedirect()).open(source, timeout=30) as response:
              raw = response.read(limit + 1)
          if len(raw) > limit:
              raise ValueError('PyPI metadata exceeds the supported size.')
          info = json.loads(raw)['info']
          version = info['version']
          if (info['name'] != 'yt-dlp' or info['yanked'] is not False
                  or not isinstance(version, str)
                  or re.fullmatch(r'[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(?:\.[0-9]+)?', version) is None):
              raise ValueError('PyPI did not identify a usable stable yt-dlp release.')
          datetime.strptime('.'.join(version.split('.')[:3]), '%Y.%m.%d')
          Path(sys.argv[1]).write_text(json.dumps({
              'source': source, 'observed_at': datetime.now(timezone.utc).isoformat(),
              'package_version': version, 'requires_python': info.get('requires_python'),
          }, sort_keys=True) + '\n', encoding='utf-8')
          print(version)
          PY_STABLE_VERSION
          )
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" --isolated --no-cache-dir install \
            --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            "yt-dlp[pin-curl-cffi]==${package_version}"
          installed=$("${RUNNER_TEMP}/yt-dlp-venv/bin/python" -c 'from importlib.metadata import version; print(version("yt-dlp"))')
          [[ ${installed} == "${package_version}" ]]
          printf 'CURRENT_STABLE_YTDLP_PACKAGE_VERSION=%s\n' "${package_version}" >>"${GITHUB_ENV}"
          echo "${RUNNER_TEMP}/yt-dlp-venv/bin" >>"${GITHUB_PATH}"
      - name: Install verified Deno for current-stable shared qualification
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          umask 077
          readonly version=2.9.8
          # Digest from the immutable upstream release and its official checksum.
          readonly archive_sha=e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609
          tool_dir=$(mktemp -d "${RUNNER_TEMP}/deno.XXXXXXXX")
          archive=$(mktemp "${RUNNER_TEMP}/deno-archive.XXXXXXXX")
          trap 'rm -f -- "${archive}"' EXIT
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${archive}" \
            "https://github.com/denoland/deno/releases/download/v${version}/deno-x86_64-unknown-linux-gnu.zip"
          printf '%s  %s\n' "${archive_sha}" "${archive}" | sha256sum --check
          [[ $(unzip -Z1 "${archive}") == deno ]]
          unzip -q "${archive}" deno -d "${tool_dir}"
          chmod 0755 -- "${tool_dir}/deno"
          resolved=$("${tool_dir}/deno" --version | awk 'NR == 1 { version = $2 } END { print version }')
          [[ ${resolved} == "${version}" ]]
          "${tool_dir}/deno" --version
          printf '%s\n' "${tool_dir}" >>"${GITHUB_PATH}"
      - name: Validate current-stable shared prerequisites
        timeout-minutes: 1
        run: |
          set -Eeuo pipefail
          "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" --isolated --no-cache-dir check
          deno_version=$(deno --version | awk 'NR == 1 { version = $2 } END { print version }')
          # Evaluate the selected wheel's compatibility extra, not an older
          # release's pin-deno preference. Unknown requirements fail closed.
          "${RUNNER_TEMP}/yt-dlp-venv/bin/python" - "${deno_version}" <<'PY_DENO_COMPAT'
          from importlib.metadata import requires
          import sys
          from pip._vendor.packaging.requirements import Requirement
          from pip._vendor.packaging.version import Version

          version = Version(sys.argv[1])
          requirements = [Requirement(item) for item in requires('yt-dlp') or ()]
          applicable = [item for item in requirements if item.name.lower() == 'deno'
                        and (item.marker is None or item.marker.evaluate({'extra': 'deno'}))]
          if not applicable or any(item.url or version not in item.specifier for item in applicable):
              raise SystemExit('Verified Deno does not satisfy the selected yt-dlp compatibility metadata.')
          print('Verified Deno compatibility:', version, '; '.join(map(str, applicable)))
          PY_DENO_COMPAT
      - name: Record resolved current-stable tool versions
        timeout-minutes: 1
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p -- "${RUNNER_TEMP}/shared-destination-evidence"
          installed=$("${RUNNER_TEMP}/yt-dlp-venv/bin/python" -c 'from importlib.metadata import version; print(version("yt-dlp"))')
          [[ ${installed} == "${CURRENT_STABLE_YTDLP_PACKAGE_VERSION}" ]]
          resolved=$("${RUNNER_TEMP}/yt-dlp-venv/bin/yt-dlp" --ignore-config --no-plugin-dirs --version)
          [[ ${resolved} =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}([.][0-9]+)?$ ]]
          printf 'CURRENT_STABLE_YTDLP_VERSION=%s\n' "${resolved}" >>"${GITHUB_ENV}"
          {
            cat -- "${RUNNER_TEMP}/shared-destination-evidence/stable-resolution.json"
            printf 'yt-dlp: %s\n' "${resolved}"
            deno --version
            aria2c --version | awk 'NR == 1 { first = $0 } END { print first }'
            ffmpeg -hide_banner -version | awk 'NR == 1 { first = $0 } END { print first }'
            ffprobe -hide_banner -version | awk 'NR == 1 { first = $0 } END { print first }'
            "${RUNNER_TEMP}/yt-dlp-venv/bin/pip" --isolated --no-cache-dir list --format=freeze
          } | tee "${RUNNER_TEMP}/shared-destination-evidence/tool-versions.log"
      - name: Run current-stable routing qualification
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/real-tools-integration.sh
      - name: Run current-stable aria2 direct-transfer behavior qualification
        env:
          ARIA2_BEHAVIOR_BASIC_RUNS: 3
          ARIA2_BEHAVIOR_CANCEL_RESTART_RUNS: 10
        run: |
          timeout --signal=TERM --kill-after=10s 12m \
            bash ./tests/aria2-real-behavior-integration.sh
      - name: Run current-stable real FFmpeg progress qualification
        run: |
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/ffmpeg-real-progress-integration.sh
      - name: Run current-stable HLS duration validation
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 5m \
            bash ./tests/hls-remux-duration-integration.sh
      - name: Run current-stable shared-destination GUI and CLI qualification
        id: shared_run
        run: |
          set -Eeuo pipefail
          umask 077
          export TMPDIR="${RUNNER_TEMP:?}/shared-destination-evidence"
          mkdir -p -- "${TMPDIR}"
          # All instances share the fixture's HOME/XDG; select only this job's
          # verified executable, never a pre-existing personal runtime.
          export YTDLP_REAL_BINARY="${RUNNER_TEMP}/yt-dlp-venv/bin/yt-dlp"
          [[ $("${YTDLP_REAL_BINARY}" --ignore-config --no-plugin-dirs --version) == "${CURRENT_STABLE_YTDLP_VERSION}" ]]
          timeout --signal=TERM --kill-after=10s 8m \
            bash ./tests/repeat-qualification.sh --runs 1 --jobs 1 \
              --label 'Shared-destination real tools' -- \
              python3 -B ./tests/multi-instance-real.py \
            2>&1 | tee "${TMPDIR}/qualification.log"
      - name: Validate and stage current-stable shared-destination evidence
        id: evidence
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          SHARED_OUTCOME: ${{ steps.shared_run.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          umask 077
          options=(--current-stable)
          if [[ ${SHARED_OUTCOME} != success ]]; then
            [[ ${JOB_STATUS} == failure || ${JOB_STATUS} == cancelled ]] || exit 65
            options+=(--partial)
          fi
          python3 -IB tests/multi-instance-real.py --stage-evidence \
            "${RUNNER_TEMP:?}/shared-destination-evidence" shared-destination-public "${options[@]}"
      - name: Retain current-stable shared-destination verdicts and monotonic events
        timeout-minutes: 1
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-destination-current-stable-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            shared-destination-public/stable-resolution.json
            shared-destination-public/tool-versions.log
            shared-destination-public/qualification.log
            shared-destination-public/shared-destination-real-*/*.log
            shared-destination-public/shared-destination-real-*/events.json
            shared-destination-public/shared-destination-real-*/qualification-errors.json
            shared-destination-public/shared-destination-real-*/*.before-rescue.json
            shared-destination-public/shared-destination-real-*/*.final-before-rescue.json
